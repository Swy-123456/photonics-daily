<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="sans-serif"><rect width="640" height="360" fill="#f8f9fa"/><circle cx="320" cy="180" r="40" fill="#ffd700" stroke="#b8860b" stroke-width="2"/><text x="320" y="185" text-anchor="middle" font-size="14" fill="#333">纳米颗粒</text><line x1="100" y1="180" x2="280" y2="180" stroke="#1e90ff" stroke-width="3" marker-end="url(#arrowBlue)"/><text x="150" y="170" font-size="14" fill="#1e90ff">电子束</text><line x1="320" y1="140" x2="320" y2="80" stroke="#ff4500" stroke-width="3" marker-end="url(#arrowRed)"/><line x1="320" y1="220" x2="320" y2="280" stroke="#32cd32" stroke-width="3" marker-end="url(#arrowGreen)"/><text x="340" y="100" font-size="14" fill="#ff4500">偶极模式1</text><text x="340" y="260" font-size="14" fill="#32cd32">偶极模式2</text><path d="M400,180 Q420,160 440,180 Q460,200 480,180" stroke="#8a2be2" stroke-width="3" fill="none" marker-end="url(#arrowPurple)"/><text x="490" y="180" font-size="14" fill="#8a2be2">圆偏振光</text><defs><marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#1e90ff"/></marker><marker id="arrowRed" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#ff4500"/></marker><marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#32cd32"/></marker><marker id="arrowPurple" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#8a2be2"/></marker></defs><text x="320" y="340" text-anchor="middle" font-size="12" fill="#666">电子束激发两个正交偶极模式，远场干涉产生圆偏振光</text></svg>