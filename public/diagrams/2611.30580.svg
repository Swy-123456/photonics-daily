<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
  <rect x="20" y="20" width="280" height="200" fill="#f0f8ff" stroke="#4682b4" stroke-width="2" rx="10"/>
  <text x="160" y="45" text-anchor="middle" font-size="14" fill="#333">正向蒙特卡罗</text>
  <rect x="50" y="70" width="100" height="60" fill="#ffd700" stroke="#daa520" stroke-width="1.5" rx="5"/>
  <text x="100" y="105" text-anchor="middle" font-size="12" fill="#333">闪烁体</text>
  <path d="M150 100 Q200 80 230 120" stroke="#4682b4" stroke-width="3" fill="none"/>
  <path d="M150 100 Q200 120 230 120" stroke="#4682b4" stroke-width="3" fill="none"/>
  <text x="190" y="95" font-size="10" fill="#333">光导</text>
  <rect x="230" y="100" width="20" height="40" fill="#32cd32" stroke="#228b22" stroke-width="1.5"/>
  <text x="240" y="160" text-anchor="middle" font-size="10" fill="#333">读出面</text>
  <line x1="100" y1="70" x2="100" y2="40" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="100" y="35" text-anchor="middle" font-size="10" fill="#333">粒子</text>
  <circle cx="100" cy="70" r="3" fill="#ff4500"/>
  <circle cx="120" cy="80" r="2" fill="#ff4500"/>
  <circle cx="140" cy="90" r="2" fill="#ff4500"/>
  <rect x="340" y="20" width="280" height="200" fill="#fff0f5" stroke="#db7093" stroke-width="2" rx="10"/>
  <text x="480" y="45" text-anchor="middle" font-size="14" fill="#333">伴随蒙特卡罗</text>
  <rect x="370" y="70" width="100" height="60" fill="#ffd700" stroke="#daa520" stroke-width="1.5" rx="5"/>
  <text x="420" y="105" text-anchor="middle" font-size="12" fill="#333">闪烁体</text>
  <path d="M470 100 Q520 80 550 120" stroke="#db7093" stroke-width="3" fill="none"/>
  <path d="M470 100 Q520 120 550 120" stroke="#db7093" stroke-width="3" fill="none"/>
  <text x="510" y="95" font-size="10" fill="#333">光导</text>
  <rect x="550" y="100" width="20" height="40" fill="#32cd32" stroke="#228b22" stroke-width="1.5"/>
  <text x="560" y="160" text-anchor="middle" font-size="10" fill="#333">读出面</text>
  <line x1="560" y1="100" x2="560" y2="70" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="560" y1="70" x2="560" y2="50" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="560" y="45" text-anchor="middle" font-size="10" fill="#333">反向光子</text>
  <rect x="170" y="250" width="300" height="80" fill="#f5f5f5" stroke="#808080" stroke-width="2" rx="10"/>
  <text x="320" y="275" text-anchor="middle" font-size="14" fill="#333">神经网络代理模型</text>
  <text x="320" y="295" text-anchor="middle" font-size="11" fill="#333">输入：几何参数 → 输出：收集概率、时间分布</text>
  <text x="320" y="315" text-anchor="middle" font-size="11" fill="#333">可微 → 梯度优化</text>
  <line x1="300" y1="220" x2="300" y2="250" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="220" x2="400" y2="250" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="350" y="240" text-anchor="middle" font-size="10" fill="#333">训练数据</text>
  <rect x="20" y="330" width="600" height="20" fill="none"/>
  <text x="320" y="345" text-anchor="middle" font-size="10" fill="#666">图例：黄色=闪烁体，蓝色=光导，绿色=读出面，红色=光子轨迹</text>
</svg>