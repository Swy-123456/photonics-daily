<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="sans-serif">
  <rect width="640" height="360" fill="#f8fafc"/>
  <text x="320" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">CPO 与可插拔光模块架构对比</text>

  <!-- Left: pluggable -->
  <rect x="20" y="50" width="280" height="250" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="160" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">可插拔光模块</text>
  <rect x="50" y="100" width="80" height="60" rx="6" fill="#fde68a" stroke="#f59e0b"/>
  <text x="90" y="135" text-anchor="middle" font-size="11" fill="#78350f">交换 ASIC</text>
  <line x1="130" y1="130" x2="210" y2="130" stroke="#f97316" stroke-width="3" stroke-dasharray="6,4"/>
  <text x="170" y="120" text-anchor="middle" font-size="10" fill="#c2410c">长铜走线</text>
  <rect x="210" y="100" width="70" height="60" rx="6" fill="#bfdbfe" stroke="#3b82f6"/>
  <text x="245" y="135" text-anchor="middle" font-size="11" fill="#1e3a8a">光模块</text>
  <line x1="280" y1="130" x2="300" y2="130" stroke="#3b82f6" stroke-width="3"/>
  <text x="160" y="200" text-anchor="middle" font-size="10" fill="#64748b">电信号经长 PCB 走线到达面板</text>
  <text x="160" y="220" text-anchor="middle" font-size="10" fill="#64748b">损耗大、功耗高、密度受限</text>

  <!-- Right: CPO -->
  <rect x="340" y="50" width="280" height="250" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="480" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">共封装光学（CPO）</text>
  <rect x="370" y="100" width="80" height="60" rx="6" fill="#fde68a" stroke="#f59e0b"/>
  <text x="410" y="135" text-anchor="middle" font-size="11" fill="#78350f">交换 ASIC</text>
  <rect x="460" y="100" width="80" height="60" rx="6" fill="#bbf7d0" stroke="#22c55e"/>
  <text x="500" y="128" text-anchor="middle" font-size="10" fill="#166534">硅光引擎</text>
  <text x="500" y="145" text-anchor="middle" font-size="9" fill="#166534">调制/探测</text>
  <line x1="450" y1="130" x2="460" y2="130" stroke="#f97316" stroke-width="4"/>
  <text x="455" y="118" text-anchor="middle" font-size="9" fill="#c2410c">短</text>
  <rect x="560" y="100" width="45" height="60" rx="6" fill="#e9d5ff" stroke="#a855f7"/>
  <text x="582" y="130" text-anchor="middle" font-size="9" fill="#6b21a8">外置</text>
  <text x="582" y="145" text-anchor="middle" font-size="9" fill="#6b21a8">激光</text>
  <line x1="540" y1="130" x2="560" y2="130" stroke="#a855f7" stroke-width="2"/>
  <line x1="540" y1="130" x2="540" y2="180" stroke="#3b82f6" stroke-width="3"/>
  <text x="480" y="200" text-anchor="middle" font-size="10" fill="#64748b">电走线缩短到毫米级</text>
  <text x="480" y="220" text-anchor="middle" font-size="10" fill="#64748b">功耗低、带宽密度高</text>

  <!-- legend -->
  <rect x="20" y="320" width="12" height="12" fill="#f97316"/>
  <text x="38" y="331" font-size="11" fill="#334155">电信号</text>
  <rect x="110" y="320" width="12" height="12" fill="#3b82f6"/>
  <text x="128" y="331" font-size="11" fill="#334155">光信号</text>
  <rect x="200" y="320" width="12" height="12" fill="#22c55e"/>
  <text x="218" y="331" font-size="11" fill="#334155">硅光引擎</text>
  <rect x="310" y="320" width="12" height="12" fill="#a855f7"/>
  <text x="328" y="331" font-size="11" fill="#334155">外置激光器</text>
</svg>