<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 360' font-family='sans-serif'>
  <rect width='640' height='360' fill='#f8f9fa'/>
  <text x='320' y='28' text-anchor='middle' font-size='16' font-weight='bold' fill='#1a1a2e'>AI 光互连：可插拔 vs 共封装（CPO）</text>
  <!-- 可插拔 -->
  <text x='20' y='60' font-size='13' font-weight='bold' fill='#0f3460'>传统可插拔</text>
  <rect x='20' y='75' width='120' height='60' rx='6' fill='#e94560' opacity='0.85'/>
  <text x='80' y='110' text-anchor='middle' font-size='12' fill='#fff'>交换 ASIC</text>
  <line x1='140' y1='105' x2='300' y2='105' stroke='#333' stroke-width='3' stroke-dasharray='6,4'/>
  <text x='220' y='98' text-anchor='middle' font-size='10' fill='#555'>长 PCB 走线（损耗大）</text>
  <rect x='300' y='75' width='100' height='60' rx='6' fill='#533483' opacity='0.85'/>
  <text x='350' y='110' text-anchor='middle' font-size='12' fill='#fff'>可插拔模块</text>
  <line x1='400' y1='105' x2='560' y2='105' stroke='#0f3460' stroke-width='3'/>
  <text x='480' y='98' text-anchor='middle' font-size='10' fill='#0f3460'>光纤</text>
  <text x='500' y='130' font-size='10' fill='#e94560'>含 DSP，~15 pJ/bit</text>
  <!-- CPO -->
  <text x='20' y='200' font-size='13' font-weight='bold' fill='#0f3460'>共封装光学 CPO</text>
  <rect x='20' y='215' width='120' height='60' rx='6' fill='#e94560' opacity='0.85'/>
  <text x='80' y='250' text-anchor='middle' font-size='12' fill='#fff'>交换 ASIC</text>
  <rect x='150' y='215' width='90' height='60' rx='6' fill='#16a085' opacity='0.9'/>
  <text x='195' y='250' text-anchor='middle' font-size='11' fill='#fff'>光引擎</text>
  <line x1='140' y1='245' x2='150' y2='245' stroke='#333' stroke-width='4'/>
  <text x='145' y='235' text-anchor='middle' font-size='9' fill='#555'>mm 级</text>
  <line x1='240' y1='245' x2='560' y2='245' stroke='#0f3460' stroke-width='3'/>
  <text x='400' y='238' text-anchor='middle' font-size='10' fill='#0f3460'>光纤</text>
  <text x='400' y='268' font-size='10' fill='#16a085'>简化 DSP，&lt;5 pJ/bit</text>
  <!-- 图例 -->
  <rect x='20' y='310' width='14' height='14' fill='#e94560'/>
  <text x='40' y='322' font-size='11' fill='#333'>ASIC</text>
  <rect x='110' y='310' width='14' height='14' fill='#533483'/>
  <text x='130' y='322' font-size='11' fill='#333'>可插拔模块</text>
  <rect x='230' y='310' width='14' height='14' fill='#16a085'/>
  <text x='250' y='322' font-size='11' fill='#333'>光引擎</text>
  <line x1='330' y1='317' x2='370' y2='317' stroke='#0f3460' stroke-width='3'/>
  <text x='378' y='322' font-size='11' fill='#333'>光纤</text>
  <text x='440' y='322' font-size='11' fill='#888'>OIF 标准覆盖：CEI-224G / 3.2T / CPO 框架</text>
</svg>