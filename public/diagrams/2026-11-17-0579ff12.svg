<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>
  <rect x="10" y="10" width="620" height="340" fill="#fafafa" stroke="#ccc" rx="8"/>
  <text x="320" y="35" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">硅光芯片自动化测试流程</text>
  <!-- Laser -->
  <rect x="30" y="70" width="100" height="50" fill="#d0e8ff" stroke="#4a90d9" rx="6"/>
  <text x="80" y="92" text-anchor="middle" font-size="12" fill="#1a4d80">可调谐激光器</text>
  <text x="80" y="108" text-anchor="middle" font-size="11" fill="#1a4d80">阵列</text>
  <!-- Fiber array -->
  <rect x="170" y="70" width="100" height="50" fill="#e8f5e9" stroke="#43a047" rx="6"/>
  <text x="220" y="92" text-anchor="middle" font-size="12" fill="#2e7d32">光纤阵列</text>
  <text x="220" y="108" text-anchor="middle" font-size="11" fill="#2e7d32">（垂直耦合）</text>
  <!-- Chip -->
  <rect x="310" y="60" width="140" height="70" fill="#fff3e0" stroke="#fb8c00" rx="6"/>
  <text x="380" y="82" text-anchor="middle" font-size="12" fill="#e65100">硅光芯片</text>
  <text x="380" y="98" text-anchor="middle" font-size="11" fill="#e65100">光栅耦合器 + 微环</text>
  <text x="380" y="114" text-anchor="middle" font-size="11" fill="#e65100">（晶圆级探针台）</text>
  <!-- Detector -->
  <rect x="490" y="70" width="100" height="50" fill="#fce4ec" stroke="#d81b60" rx="6"/>
  <text x="540" y="92" text-anchor="middle" font-size="12" fill="#880e4f">光电探测器</text>
  <text x="540" y="108" text-anchor="middle" font-size="11" fill="#880e4f">+ 数据采集</text>
  <!-- Arrows -->
  <line x1="130" y1="95" x2="168" y2="95" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="270" y1="95" x2="308" y2="95" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="95" x2="488" y2="95" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Feedback -->
  <rect x="310" y="170" width="140" height="45" fill="#ede7f6" stroke="#5e35b1" rx="6"/>
  <text x="380" y="190" text-anchor="middle" font-size="12" fill="#311b92">数据分析与反馈</text>
  <text x="380" y="206" text-anchor="middle" font-size="11" fill="#311b92">（插入损耗、谐振波长）</text>
  <line x1="540" y1="120" x2="540" y2="192" stroke="#5e35b1" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <line x1="490" y1="192" x2="452" y2="192" stroke="#5e35b1" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <!-- Control to fiber -->
  <line x1="310" y1="192" x2="220" y2="122" stroke="#5e35b1" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="250" y="165" font-size="11" fill="#5e35b1">纳米定位控制</text>
  <!-- Legend -->
  <line x1="40" y1="280" x2="80" y2="280" stroke="#333" stroke-width="2"/>
  <text x="88" y="284" font-size="11" fill="#333">光路</text>
  <line x1="150" y1="280" x2="190" y2="280" stroke="#333" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="198" y="284" font-size="11" fill="#333">电/控制信号</text>
  <rect x="300" y="270" width="20" height="15" fill="#fff3e0" stroke="#fb8c00"/>
  <text x="328" y="282" font-size="11" fill="#333">待测芯片区域</text>
</svg>