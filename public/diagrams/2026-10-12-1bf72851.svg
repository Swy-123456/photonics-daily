<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 360' font-family='sans-serif'>
  <rect x='0' y='0' width='640' height='360' fill='#f8f9fa'/>
  <text x='320' y='28' text-anchor='middle' font-size='16' font-weight='bold' fill='#1a1a2e'>硅光芯片：从工艺开发到高产量制造</text>
  <!-- 区域1 -->
  <rect x='20' y='50' width='130' height='120' rx='8' fill='#e3f2fd' stroke='#1976d2' stroke-width='1.5'/>
  <text x='85' y='72' text-anchor='middle' font-size='12' font-weight='bold' fill='#1976d2'>晶圆与工艺</text>
  <rect x='40' y='85' width='90' height='20' rx='3' fill='#bbdefb' stroke='#1976d2'/>
  <text x='85' y='99' text-anchor='middle' font-size='10' fill='#0d47a1'>SOI晶圆</text>
  <rect x='40' y='112' width='90' height='20' rx='3' fill='#bbdefb' stroke='#1976d2'/>
  <text x='85' y='126' text-anchor='middle' font-size='10' fill='#0d47a1'>光刻/刻蚀</text>
  <text x='85' y='155' text-anchor='middle' font-size='9' fill='#555'>线宽±2nm</text>
  <!-- 箭头1 -->
  <line x1='150' y1='110' x2='180' y2='110' stroke='#888' stroke-width='2' marker-end='url(#arrow)'/>
  <!-- 区域2 -->
  <rect x='185' y='50' width='170' height='120' rx='8' fill='#e8f5e9' stroke='#388e3c' stroke-width='1.5'/>
  <text x='270' y='72' text-anchor='middle' font-size='12' font-weight='bold' fill='#388e3c'>核心器件</text>
  <circle cx='225' cy='105' r='18' fill='none' stroke='#2e7d32' stroke-width='2'/>
  <text x='225' y='109' text-anchor='middle' font-size='9' fill='#2e7d32'>微环</text>
  <rect x='255' y='92' width='80' height='26' rx='4' fill='#c8e6c9' stroke='#388e3c'/>
  <text x='295' y='109' text-anchor='middle' font-size='9' fill='#1b5e20'>MZI调制器</text>
  <rect x='255' y='128' width='80' height='26' rx='4' fill='#c8e6c9' stroke='#388e3c'/>
  <text x='295' y='145' text-anchor='middle' font-size='9' fill='#1b5e20'>Ge探测器</text>
  <!-- 箭头2 -->
  <line x1='355' y1='110' x2='385' y2='110' stroke='#888' stroke-width='2' marker-end='url(#arrow)'/>
  <!-- 区域3 -->
  <rect x='390' y='50' width='110' height='120' rx='8' fill='#fff3e0' stroke='#f57c00' stroke-width='1.5'/>
  <text x='445' y='72' text-anchor='middle' font-size='12' font-weight='bold' fill='#f57c00'>封装耦合</text>
  <rect x='405' y='85' width='80' height='20' rx='3' fill='#ffe0b2' stroke='#f57c00'/>
  <text x='445' y='99' text-anchor='middle' font-size='9' fill='#e65100'>光纤阵列</text>
  <rect x='405' y='112' width='80' height='20' rx='3' fill='#ffe0b2' stroke='#f57c00'/>
  <text x='445' y='126' text-anchor='middle' font-size='9' fill='#e65100'>耦合损耗</text>
  <text x='445' y='155' text-anchor='middle' font-size='9' fill='#555'>对准容差</text>
  <!-- 箭头3 -->
  <line x1='500' y1='110' x2='530' y2='110' stroke='#888' stroke-width='2' marker-end='url(#arrow)'/>
  <!-- 区域4 -->
  <rect x='535' y='50' width='85' height='120' rx='8' fill='#fce4ec' stroke='#c62828' stroke-width='1.5'/>
  <text x='577' y='72' text-anchor='middle' font-size='12' font-weight='bold' fill='#c62828'>测试量产</text>
  <rect x='545' y='85' width='65' height='20' rx='3' fill='#f8bbd0' stroke='#c62828'/>
  <text x='577' y='99' text-anchor='middle' font-size='9' fill='#b71c1c'>晶圆级测试</text>
  <rect x='545' y='112' width='65' height='20' rx='3' fill='#f8bbd0' stroke='#c62828'/>
  <text x='577' y='126' text-anchor='middle' font-size='9' fill='#b71c1c'>良率/吞吐</text>
  <!-- 底部流程 -->
  <rect x='60' y='210' width='520' height='40' rx='20' fill='#e0e0e0' stroke='#9e9e9e'/>
  <text x='320' y='235' text-anchor='middle' font-size='12' fill='#333'>从「单件验证」到「百万颗一致性」</text>
  <!-- 图例 -->
  <rect x='60' y='275' width='12' height='12' fill='#e3f2fd' stroke='#1976d2'/>
  <text x='78' y='285' font-size='10' fill='#333'>工艺</text>
  <rect x='130' y='275' width='12' height='12' fill='#e8f5e9' stroke='#388e3c'/>
  <text x='148' y='285' font-size='10' fill='#333'>器件</text>
  <rect x='200' y='275' width='12' height='12' fill='#fff3e0' stroke='#f57c00'/>
  <text x='218' y='285' font-size='10' fill='#333'>封装</text>
  <rect x='270' y='275' width='12' height='12' fill='#fce4ec' stroke='#c62828'/>
  <text x='288' y='285' font-size='10' fill='#333'>测试</text>
  <!-- 公式标注 -->
  <text x='320' y='325' text-anchor='middle' font-size='11' fill='#555' font-style='italic'>谐振条件：mλ = 2πR n_eff</text>
  <text x='320' y='345' text-anchor='middle' font-size='11' fill='#555' font-style='italic'>相位差：Δφ = 2πΔn_eff L / λ</text>
  <defs>
    <marker id='arrow' markerWidth='8' markerHeight='6' refX='8' refY='3' orient='auto'>
      <path d='M0,0 L8,3 L0,6 Z' fill='#888'/>
    </marker>
  </defs>
</svg>