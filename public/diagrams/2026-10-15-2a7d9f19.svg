<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="sans-serif">
  <rect x="1" y="1" width="638" height="358" fill="#f8f9fa" stroke="#ccc" stroke-width="1"/>
  <!-- 窄阱 -->
  <rect x="80" y="80" width="120" height="180" fill="#a8d8ea" stroke="#2c3e50" stroke-width="2"/>
  <text x="140" y="70" text-anchor="middle" font-size="14" fill="#2c3e50">窄阱 (n=1)</text>
  <text x="140" y="160" text-anchor="middle" font-size="12" fill="#2c3e50">高能激子</text>
  <text x="140" y="180" text-anchor="middle" font-size="12" fill="#2c3e50">自旋极化</text>
  <!-- 宽阱 -->
  <rect x="440" y="80" width="120" height="180" fill="#f7c59f" stroke="#2c3e50" stroke-width="2"/>
  <text x="500" y="70" text-anchor="middle" font-size="14" fill="#2c3e50">宽阱 (n=2,3)</text>
  <text x="500" y="160" text-anchor="middle" font-size="12" fill="#2c3e50">低能激子</text>
  <text x="500" y="180" text-anchor="middle" font-size="12" fill="#2c3e50">长自旋寿命</text>
  <!-- 级联箭头 -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#27ae60"/>
    </marker>
  </defs>
  <line x1="200" y1="170" x2="440" y2="170" stroke="#27ae60" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="320" y="160" text-anchor="middle" font-size="12" fill="#27ae60">自旋级联</text>
  <!-- 激发光 -->
  <line x1="140" y1="20" x2="140" y2="80" stroke="#e74c3c" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="140" y="15" text-anchor="middle" font-size="12" fill="#e74c3c">光激发</text>
  <!-- 发射光 -->
  <line x1="500" y1="260" x2="500" y2="320" stroke="#8e44ad" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="500" y="340" text-anchor="middle" font-size="12" fill="#8e44ad">圆偏振光发射</text>
  <!-- 图例 -->
  <rect x="20" y="300" width="12" height="12" fill="#a8d8ea" stroke="#2c3e50"/>
  <text x="40" y="310" font-size="12" fill="#2c3e50">窄阱</text>
  <rect x="100" y="300" width="12" height="12" fill="#f7c59f" stroke="#2c3e50"/>
  <text x="120" y="310" font-size="12" fill="#2c3e50">宽阱</text>
  <line x1="180" y1="306" x2="210" y2="306" stroke="#27ae60" stroke-width="2"/>
  <text x="215" y="310" font-size="12" fill="#2c3e50">能量转移</text>
</svg>