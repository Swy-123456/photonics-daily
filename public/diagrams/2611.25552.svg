<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="sans-serif"><rect width="640" height="360" fill="#f8f9fa"/><text x="320" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c3e50">焦斑测量原理与满功率展宽</text><g transform="translate(20,50)"><text x="100" y="15" text-anchor="middle" font-size="12" fill="#34495e">铝球法测量包围能量</text><rect x="20" y="30" width="160" height="120" fill="#fff" stroke="#bdc3c7" rx="5"/><line x1="40" y1="90" x2="160" y2="90" stroke="#e74c3c" stroke-width="2" stroke-dasharray="4,2"/><circle cx="100" cy="90" r="8" fill="#95a5a6" stroke="#7f8c8d"/><circle cx="100" cy="90" r="16" fill="none" stroke="#95a5a6" stroke-width="1" stroke-dasharray="2,2"/><circle cx="100" cy="90" r="24" fill="none" stroke="#95a5a6" stroke-width="1" stroke-dasharray="2,2"/><text x="100" y="130" text-anchor="middle" font-size="10" fill="#7f8c8d">不同直径铝球</text><text x="100" y="145" text-anchor="middle" font-size="10" fill="#7f8c8d">遮挡中心，测透射能量</text></g><g transform="translate(320,50)"><text x="150" y="15" text-anchor="middle" font-size="12" fill="#34495e">焦斑轮廓对比</text><rect x="20" y="30" width="260" height="200" fill="#fff" stroke="#bdc3c7" rx="5"/><line x1="40" y1="210" x2="260" y2="210" stroke="#34495e" stroke-width="1"/><line x1="40" y1="210" x2="40" y2="40" stroke="#34495e" stroke-width="1"/><text x="150" y="235" text-anchor="middle" font-size="10" fill="#34495e">径向位置 (μm)</text><text x="15" y="125" text-anchor="middle" font-size="10" fill="#34495e" transform="rotate(-90,15,125)">强度 (a.u.)</text><path d="M40,210 Q60,210 70,80 Q80,210 100,210" fill="none" stroke="#3498db" stroke-width="2" stroke-dasharray="5,3"/><path d="M40,210 Q60,210 70,80 Q80,210 100,210" fill="none" stroke="#3498db" stroke-width="2" stroke-dasharray="5,3"/><path d="M40,210 Q50,210 55,150 Q60,210 70,210" fill="none" stroke="#e74c3c" stroke-width="2"/><path d="M40,210 Q45,210 48,180 Q50,210 55,210" fill="none" stroke="#e74c3c" stroke-width="2"/><text x="140" y="70" font-size="10" fill="#3498db">低功率 (D50=34μm)</text><text x="140" y="90" font-size="10" fill="#e74c3c">满功率 (D50=102μm)</text></g><g transform="translate(20,280)"><rect x="0" y="0" width="12" height="12" fill="#3498db" stroke="#2980b9"/><text x="18" y="10" font-size="10" fill="#34495e">窄分量 (低功率)</text><rect x="120" y="0" width="12" height="12" fill="#e74c3c" stroke="#c0392b"/><text x="138" y="10" font-size="10" fill="#34495e">宽分量 (满功率)</text></g></svg>