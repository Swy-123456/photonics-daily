<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="640" height="360" fill="#fafafa" stroke="#ccc"/>
  <text x="320" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">PIC 规模化制造关键环节与微环谐振器原理</text>
  <!-- 区域1：晶圆制造 -->
  <rect x="20" y="50" width="180" height="200" rx="8" fill="#e8f0fe" stroke="#4a90d9"/>
  <text x="110" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a4b8c">① 晶圆制造</text>
  <circle cx="110" cy="140" r="55" fill="#c9daf8" stroke="#4a90d9" stroke-width="1.5"/>
  <g fill="#4a90d9">
    <rect x="75" y="105" width="10" height="10"/><rect x="95" y="105" width="10" height="10"/><rect x="115" y="105" width="10" height="10"/><rect x="135" y="105" width="10" height="10"/>
    <rect x="75" y="125" width="10" height="10"/><rect x="95" y="125" width="10" height="10"/><rect x="115" y="125" width="10" height="10"/><rect x="135" y="125" width="10" height="10"/>
    <rect x="75" y="145" width="10" height="10"/><rect x="95" y="145" width="10" height="10"/><rect x="115" y="145" width="10" height="10"/><rect x="135" y="145" width="10" height="10"/>
    <rect x="75" y="165" width="10" height="10"/><rect x="95" y="165" width="10" height="10"/><rect x="115" y="165" width="10" height="10"/><rect x="135" y="165" width="10" height="10"/>
  </g>
  <text x="110" y="215" text-anchor="middle" font-size="11" fill="#333">300 mm 晶圆</text>
  <text x="110" y="232" text-anchor="middle" font-size="11" fill="#333">波导宽度 ±0.5 nm</text>
  <!-- 区域2：微环原理 -->
  <rect x="220" y="50" width="200" height="200" rx="8" fill="#e6f4ea" stroke="#34a853"/>
  <text x="320" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e6b34">② 微环谐振器</text>
  <!-- 直波导 -->
  <rect x="240" y="150" width="160" height="12" rx="6" fill="#4a90d9"/>
  <!-- 环形波导 -->
  <circle cx="320" cy="130" r="38" fill="none" stroke="#4a90d9" stroke-width="10"/>
  <!-- 输入输出箭头 -->
  <line x1="230" y1="156" x2="245" y2="156" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="395" y1="156" x2="410" y2="156" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="225" y="145" font-size="11" fill="#333">输入</text>
  <text x="400" y="145" font-size="11" fill="#333">直通</text>
  <text x="320" y="118" text-anchor="middle" font-size="11" fill="#1e6b34">λ_m 谐振</text>
  <text x="320" y="200" text-anchor="middle" font-size="11" fill="#333">mλ = n_eff·L</text>
  <!-- 区域3：封装测试 -->
  <rect x="440" y="50" width="180" height="200" rx="8" fill="#fef7e0" stroke="#f9ab00"/>
  <text x="530" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a5a00">③ 封装与测试</text>
  <!-- 芯片 -->
  <rect x="470" y="120" width="60" height="40" rx="4" fill="#c9daf8" stroke="#4a90d9"/>
  <text x="500" y="145" text-anchor="middle" font-size="10" fill="#333">PIC</text>
  <!-- 光纤阵列 -->
  <rect x="470" y="95" width="60" height="8" rx="2" fill="#f9ab00"/>
  <line x1="500" y1="103" x2="500" y2="120" stroke="#f9ab00" stroke-width="2"/>
  <text x="530" y="100" font-size="10" fill="#8a5a00">光纤阵列</text>
  <text x="530" y="180" font-size="10" fill="#333">对准 &lt; 0.5 μm</text>
  <text x="530" y="198" font-size="10" fill="#333">晶圆级测试</text>
  <!-- 底部图例 -->
  <rect x="20" y="270" width="600" height="70" rx="6" fill="#fff" stroke="#ddd"/>
  <text x="40" y="292" font-size="12" font-weight="bold" fill="#333">图例</text>
  <rect x="40" y="305" width="14" height="14" fill="#4a90d9"/><text x="60" y="317" font-size="11" fill="#333">硅波导</text>
  <rect x="130" y="305" width="14" height="14" fill="#c9daf8"/><text x="150" y="317" font-size="11" fill="#333">二氧化硅包层</text>
  <rect x="250" y="305" width="14" height="14" fill="#f9ab00"/><text x="270" y="317" font-size="11" fill="#333">金属加热器/光纤</text>
  <text x="390" y="317" font-size="11" fill="#333">箭头：光信号流向</text>
</svg>