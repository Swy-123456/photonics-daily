<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 360' font-family='sans-serif'>
  <rect width='640' height='360' fill='#f8f9fa'/>
  <text x='320' y='28' text-anchor='middle' font-size='16' font-weight='bold' fill='#1a1a2e'>模式工程型硅光调制器概念示意</text>
  <!-- 输入波导 -->
  <rect x='30' y='150' width='90' height='40' rx='6' fill='#a8dadc' stroke='#457b9d' stroke-width='2'/>
  <text x='75' y='175' text-anchor='middle' font-size='12' fill='#1d3557'>输入波导</text>
  <text x='75' y='145' text-anchor='middle' font-size='11' fill='#457b9d'>TE0 基模</text>
  <!-- 模式转换器 -->
  <polygon points='120,150 200,140 200,200 120,190' fill='#ffd166' stroke='#e09f3e' stroke-width='2'/>
  <text x='160' y='178' text-anchor='middle' font-size='11' fill='#7f4f24'>模式转换</text>
  <text x='160' y='128' text-anchor='middle' font-size='11' fill='#e09f3e'>TE0 → TE1</text>
  <!-- 调制区 -->
  <rect x='200' y='140' width='180' height='60' rx='6' fill='#cdb4db' stroke='#7b2cbf' stroke-width='2'/>
  <text x='290' y='165' text-anchor='middle' font-size='12' fill='#3c096c'>调制区</text>
  <text x='290' y='183' text-anchor='middle' font-size='11' fill='#5a189a'>载流子注入 Δn</text>
  <!-- 电极 -->
  <rect x='230' y='100' width='120' height='24' rx='4' fill='#ffb703' stroke='#fb8500' stroke-width='2'/>
  <text x='290' y='116' text-anchor='middle' font-size='11' fill='#7f4f24'>电极 Vπ</text>
  <line x1='290' y1='124' x2='290' y2='140' stroke='#fb8500' stroke-width='2' stroke-dasharray='4,3'/>
  <!-- 模式干涉器 -->
  <polygon points='380,140 460,150 460,190 380,200' fill='#a8dadc' stroke='#457b9d' stroke-width='2'/>
  <text x='420' y='178' text-anchor='middle' font-size='11' fill='#1d3557'>模式干涉</text>
  <text x='420' y='128' text-anchor='middle' font-size='11' fill='#457b9d'>TE1 → TE0</text>
  <!-- 输出波导 -->
  <rect x='460' y='150' width='90' height='40' rx='6' fill='#a8dadc' stroke='#457b9d' stroke-width='2'/>
  <text x='505' y='175' text-anchor='middle' font-size='12' fill='#1d3557'>输出波导</text>
  <text x='505' y='145' text-anchor='middle' font-size='11' fill='#457b9d'>调制信号</text>
  <!-- 光路箭头 -->
  <line x1='120' y1='170' x2='200' y2='170' stroke='#e63946' stroke-width='2' marker-end='url(#arrow)'/>
  <line x1='380' y1='170' x2='460' y2='170' stroke='#e63946' stroke-width='2' marker-end='url(#arrow)'/>
  <line x1='460' y1='170' x2='550' y2='170' stroke='#e63946' stroke-width='2' marker-end='url(#arrow)'/>
  <defs>
    <marker id='arrow' markerWidth='8' markerHeight='8' refX='6' refY='3' orient='auto'>
      <path d='M0,0 L6,3 L0,6 Z' fill='#e63946'/>
    </marker>
  </defs>
  <!-- 图例 -->
  <rect x='30' y='280' width='580' height='60' rx='6' fill='#ffffff' stroke='#dee2e6'/>
  <line x1='50' y1='300' x2='90' y2='300' stroke='#e63946' stroke-width='2' marker-end='url(#arrow)'/>
  <text x='100' y='304' font-size='11' fill='#333'>光路</text>
  <line x1='170' y1='300' x2='210' y2='300' stroke='#fb8500' stroke-width='2' stroke-dasharray='4,3'/>
  <text x='220' y='304' font-size='11' fill='#333'>电信号</text>
  <ellipse cx='310' cy='300' rx='18' ry='8' fill='none' stroke='#7b2cbf' stroke-width='2'/>
  <text x='340' y='304' font-size='11' fill='#333'>模式分布</text>
  <text x='430' y='304' font-size='11' fill='#333'>Δn：折射率变化</text>
  <text x='430' y='322' font-size='11' fill='#333'>L：调制区长度</text>
  <text x='50' y='322' font-size='11' fill='#333'>Vπ：半波电压</text>
</svg>