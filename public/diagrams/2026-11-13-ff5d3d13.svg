<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="sans-serif"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#555"/></marker></defs><rect width="640" height="360" fill="#fafafa"/><text x="320" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">AI 逆设计光子器件闭环流程</text><rect x="30" y="60" width="130" height="70" rx="8" fill="#e3f2fd" stroke="#1976d2"/><text x="95" y="88" text-anchor="middle" font-size="13" fill="#0d47a1">设计目标</text><text x="95" y="108" text-anchor="middle" font-size="11" fill="#0d47a1">目标透射谱 R*</text><rect x="255" y="60" width="130" height="70" rx="8" fill="#fff3e0" stroke="#f57c00"/><text x="320" y="88" text-anchor="middle" font-size="13" fill="#e65100">AI 代理/生成模型</text><text x="320" y="108" text-anchor="middle" font-size="11" fill="#e65100">g = F⁻¹(R*)</text><rect x="480" y="60" width="130" height="70" rx="8" fill="#e8f5e9" stroke="#388e3c"/><text x="545" y="88" text-anchor="middle" font-size="13" fill="#1b5e20">几何结构 g</text><text x="545" y="108" text-anchor="middle" font-size="11" fill="#1b5e20">波导/微环版图</text><line x1="160" y1="95" x2="250" y2="95" stroke="#555" marker-end="url(#a)"/><line x1="385" y1="95" x2="475" y2="95" stroke="#555" marker-end="url(#a)"/><rect x="255" y="190" width="130" height="70" rx="8" fill="#fce4ec" stroke="#c2185b"/><text x="320" y="218" text-anchor="middle" font-size="13" fill="#880e4f">FDTD 电磁仿真</text><text x="320" y="238" text-anchor="middle" font-size="11" fill="#880e4f">校验 R = F(g)</text><line x1="545" y1="130" x2="545" y2="225" stroke="#555"/><line x1="545" y1="225" x2="390" y2="225" stroke="#555" marker-end="url(#a)"/><path d="M255,225 C180,225 180,130 160,115" fill="none" stroke="#d32f2f" stroke-dasharray="5,4" marker-end="url(#a)"/><text x="150" y="185" font-size="11" fill="#d32f2f">误差回传</text><rect x="480" y="190" width="130" height="70" rx="8" fill="#ede7f6" stroke="#5e35b1"/><text x="545" y="218" text-anchor="middle" font-size="13" fill="#311b92">流片验证</text><text x="545" y="238" text-anchor="middle" font-size="11" fill="#311b92">代工厂 PDK</text><line x1="390" y1="225" x2="475" y2="225" stroke="#555" marker-end="url(#a)"/><rect x="30" y="300" width="580" height="40" rx="6" fill="#f5f5f5" stroke="#bbb"/><text x="320" y="325" text-anchor="middle" font-size="12" fill="#444">传统人工迭代：仿真数小时/次，循环几十次；AI 闭环：推理毫秒级，循环数十万次</text></svg>