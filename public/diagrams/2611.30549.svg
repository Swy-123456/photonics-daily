<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="sans-serif">
  <defs>
    <linearGradient id="laser" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff4d4d"/>
      <stop offset="100%" stop-color="#ff9999"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="640" height="360" fill="#f8f9fb"/>
  <!-- 激光器 -->
  <rect x="30" y="30" width="90" height="40" rx="6" fill="#3a6ea5"/>
  <text x="75" y="55" text-anchor="middle" fill="white" font-size="13">飞秒激光器</text>
  <!-- 激光束 -->
  <line x1="120" y1="50" x2="300" y2="50" stroke="url(#laser)" stroke-width="6"/>
  <text x="210" y="40" text-anchor="middle" fill="#c00" font-size="12">近红外超短脉冲</text>
  <!-- 物镜 -->
  <path d="M300 30 L340 30 L330 70 L310 70 Z" fill="#888" stroke="#555"/>
  <text x="320" y="88" text-anchor="middle" fill="#333" font-size="12">物镜</text>
  <!-- 聚焦光束 -->
  <line x1="320" y1="70" x2="320" y2="170" stroke="#ff4d4d" stroke-width="3"/>
  <!-- 约束片 -->
  <rect x="200" y="110" width="240" height="10" fill="#b3d9ff" stroke="#4a90d9"/>
  <text x="440" y="118" fill="#2a6fb0" font-size="12">透明约束片</text>
  <!-- 粉床 -->
  <rect x="200" y="120" width="240" height="50" fill="#e6d9b8" stroke="#b8a36a"/>
  <text x="320" y="150" text-anchor="middle" fill="#7a6a3a" font-size="12">TiO₂ + Nb₂O₅ 混合粉床</text>
  <!-- 反应区 -->
  <ellipse cx="320" cy="145" rx="35" ry="18" fill="#ffb347" opacity="0.7"/>
  <text x="320" y="148" text-anchor="middle" fill="#8a4b00" font-size="11">TNO 反应区</text>
  <!-- 衬底 -->
  <rect x="180" y="170" width="280" height="18" fill="#a0a0a0" stroke="#666"/>
  <text x="320" y="183" text-anchor="middle" fill="white" font-size="11">衬底</text>
  <!-- 扫描方向 -->
  <line x1="240" y1="210" x2="400" y2="210" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#333"/>
    </marker>
  </defs>
  <text x="320" y="228" text-anchor="middle" fill="#333" font-size="12">扫描方向</text>
  <!-- 右侧相图例 -->
  <rect x="470" y="100" width="140" height="150" rx="6" fill="white" stroke="#ccc"/>
  <text x="540" y="120" text-anchor="middle" fill="#333" font-size="13">脉冲能量调控</text>
  <rect x="485" y="130" width="20" height="20" fill="#e6d9b8"/>
  <text x="515" y="145" fill="#333" font-size="11">低：混合相</text>
  <rect x="485" y="160" width="20" height="20" fill="#ffb347"/>
  <text x="515" y="175" fill="#333" font-size="11">中：TiNb₂O₇</text>
  <rect x="485" y="190" width="20" height="20" fill="#d96b6b"/>
  <text x="515" y="205" fill="#333" font-size="11">高：富Ti/Nb相</text>
  <!-- 图例标题 -->
  <text x="540" y="240" text-anchor="middle" fill="#666" font-size="11">相组成随能量变化</text>
</svg>