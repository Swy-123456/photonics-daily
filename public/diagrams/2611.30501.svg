<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#333"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#d32f2f"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="640" height="360" fill="#fafafa" stroke="#ccc"/>
  <!-- Input waveguide -->
  <rect x="40" y="150" width="60" height="20" fill="#90caf9" stroke="#1565c0" stroke-width="1.5"/>
  <text x="70" y="140" font-size="12" text-anchor="middle" fill="#1565c0">输入光</text>
  <line x1="100" y1="160" x2="130" y2="160" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Splitter -->
  <polygon points="130,140 160,160 130,180" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="145" y="135" font-size="11" text-anchor="middle" fill="#1565c0">分束器</text>
  <!-- Upper arm -->
  <line x1="160" y1="150" x2="300" y2="120" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="200" y="100" width="80" height="30" fill="#ffcc80" stroke="#e65100" stroke-width="1.5" rx="4"/>
  <text x="240" y="118" font-size="11" text-anchor="middle" fill="#e65100">Ce:YIG</text>
  <text x="240" y="95" font-size="11" text-anchor="middle" fill="#e65100">磁场 B</text>
  <!-- Magnetic field symbol -->
  <circle cx="240" cy="85" r="8" fill="none" stroke="#e65100" stroke-width="1.5"/>
  <circle cx="240" cy="85" r="2" fill="#e65100"/>
  <!-- Lower arm -->
  <line x1="160" y1="170" x2="300" y2="200" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="230" y="195" font-size="11" text-anchor="middle" fill="#555">参考臂</text>
  <!-- Combiner -->
  <polygon points="300,120 330,160 300,200" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="315" y="115" font-size="11" text-anchor="middle" fill="#1565c0">合束器</text>
  <!-- Output waveguide -->
  <line x1="330" y1="160" x2="400" y2="160" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="400" y="150" width="60" height="20" fill="#90caf9" stroke="#1565c0" stroke-width="1.5"/>
  <text x="430" y="140" font-size="12" text-anchor="middle" fill="#1565c0">输出光</text>
  <!-- Backward reflection arrow -->
  <line x1="460" y1="180" x2="380" y2="180" stroke="#d32f2f" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowRed)"/>
  <text x="420" y="195" font-size="11" text-anchor="middle" fill="#d32f2f">反向光被隔离</text>
  <!-- Cross-section inset -->
  <rect x="480" y="40" width="140" height="100" fill="#fff" stroke="#999" stroke-width="1"/>
  <text x="550" y="55" font-size="11" text-anchor="middle" fill="#333">截面示意</text>
  <!-- Si substrate -->
  <rect x="490" y="110" width="120" height="15" fill="#b0bec5" stroke="#555"/>
  <text x="550" y="122" font-size="9" text-anchor="middle" fill="#333">Si 衬底</text>
  <!-- SiO2 cladding -->
  <rect x="490" y="85" width="120" height="25" fill="#e0e0e0" stroke="#999"/>
  <text x="550" y="100" font-size="9" text-anchor="middle" fill="#555">SiO2 包层</text>
  <!-- SiN waveguide -->
  <rect x="530" y="80" width="40" height="10" fill="#80deea" stroke="#00838f"/>
  <text x="550" y="75" font-size="9" text-anchor="middle" fill="#00838f">SiN 波导</text>
  <!-- Ce:YIG film -->
  <rect x="530" y="65" width="40" height="10" fill="#ffcc80" stroke="#e65100"/>
  <text x="550" y="60" font-size="9" text-anchor="middle" fill="#e65100">Ce:YIG</text>
  <!-- Legend -->
  <rect x="40" y="280" width="560" height="60" fill="#fff" stroke="#ccc"/>
  <text x="50" y="295" font-size="11" fill="#333">图例：</text>
  <rect x="100" y="285" width="15" height="10" fill="#90caf9" stroke="#1565c0"/>
  <text x="120" y="295" font-size="10" fill="#333">光波导</text>
  <rect x="180" y="285" width="15" height="10" fill="#ffcc80" stroke="#e65100"/>
  <text x="200" y="295" font-size="10" fill="#333">Ce:YIG 磁光薄膜</text>
  <line x1="300" y1="290" x2="330" y2="290" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="340" y="295" font-size="10" fill="#333">正向光</text>
  <line x1="400" y1="290" x2="430" y2="290" stroke="#d32f2f" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowRed)"/>
  <text x="440" y="295" font-size="10" fill="#333">反向光（被隔离）</text>
  <circle cx="540" cy="290" r="6" fill="none" stroke="#e65100" stroke-width="1.5"/>
  <circle cx="540" cy="290" r="2" fill="#e65100"/>
  <text x="555" y="295" font-size="10" fill="#333">磁场方向</text>
</svg>