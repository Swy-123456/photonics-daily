<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="640" height="360" fill="#f8f9fa" stroke="#ccc"/>
  <!-- 激光器阵列 -->
  <rect x="30" y="40" width="80" height="60" rx="6" fill="#e74c3c" opacity="0.8"/>
  <text x="70" y="65" text-anchor="middle" fill="#fff" font-size="12">III-V激光器</text>
  <text x="70" y="85" text-anchor="middle" fill="#fff" font-size="10">红/绿/蓝</text>
  <!-- 波导连接 -->
  <line x1="110" y1="70" x2="160" y2="70" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- 微环调制器阵列 -->
  <rect x="160" y="40" width="100" height="60" rx="6" fill="#3498db" opacity="0.8"/>
  <text x="210" y="65" text-anchor="middle" fill="#fff" font-size="12">微环调制器</text>
  <text x="210" y="85" text-anchor="middle" fill="#fff" font-size="10">阵列</text>
  <!-- 波导 -->
  <line x1="260" y1="70" x2="310" y2="70" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- 合束器 -->
  <rect x="310" y="40" width="100" height="60" rx="6" fill="#2ecc71" opacity="0.8"/>
  <text x="360" y="65" text-anchor="middle" fill="#fff" font-size="12">波分复用</text>
  <text x="360" y="85" text-anchor="middle" fill="#fff" font-size="10">(MZI级联)</text>
  <!-- 波导 -->
  <line x1="410" y1="70" x2="460" y2="70" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- 光栅耦合器 -->
  <rect x="460" y="40" width="80" height="60" rx="6" fill="#f39c12" opacity="0.8"/>
  <text x="500" y="65" text-anchor="middle" fill="#fff" font-size="12">光栅</text>
  <text x="500" y="85" text-anchor="middle" fill="#fff" font-size="10">耦合器</text>
  <!-- 垂直出射箭头 -->
  <line x1="500" y1="40" x2="500" y2="10" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="520" y="20" font-size="10" fill="#333">出射光</text>
  <!-- 全息波导 -->
  <rect x="440" y="110" width="140" height="80" rx="8" fill="#9b59b6" opacity="0.6"/>
  <text x="510" y="140" text-anchor="middle" fill="#fff" font-size="12">全息波导</text>
  <text x="510" y="160" text-anchor="middle" fill="#fff" font-size="10">(扩瞳)</text>
  <!-- 人眼 -->
  <ellipse cx="510" cy="230" rx="30" ry="20" fill="#34495e" opacity="0.7"/>
  <text x="510" y="235" text-anchor="middle" fill="#fff" font-size="10">人眼</text>
  <!-- 光路箭头从波导出射到人眼 -->
  <line x1="510" y1="110" x2="510" y2="210" stroke="#333" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow)"/>
  <!-- 图例 -->
  <rect x="30" y="280" width="580" height="60" fill="#fff" stroke="#ccc" rx="4"/>
  <text x="40" y="300" font-size="11" fill="#333">图例：</text>
  <rect x="80" y="290" width="12" height="12" fill="#e74c3c"/>
  <text x="96" y="300" font-size="10" fill="#333">光源</text>
  <rect x="140" y="290" width="12" height="12" fill="#3498db"/>
  <text x="156" y="300" font-size="10" fill="#333">调制</text>
  <rect x="200" y="290" width="12" height="12" fill="#2ecc71"/>
  <text x="216" y="300" font-size="10" fill="#333">合束</text>
  <rect x="260" y="290" width="12" height="12" fill="#f39c12"/>
  <text x="276" y="300" font-size="10" fill="#333">耦合</text>
  <rect x="320" y="290" width="12" height="12" fill="#9b59b6"/>
  <text x="336" y="300" font-size="10" fill="#333">波导</text>
  <line x1="400" y1="296" x2="430" y2="296" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="436" y="300" font-size="10" fill="#333">光路</text>
  <!-- 公式符号标注 -->
  <text x="160" y="130" font-size="10" fill="#666">λ_m = 2πR n_eff / m</text>
  <text x="460" y="130" font-size="10" fill="#666">β = k₀ n_clad sinθ + 2π/Λ</text>
</svg>