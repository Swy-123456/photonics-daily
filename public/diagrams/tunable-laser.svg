<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" font-family="system-ui, sans-serif">
  <title>III-V/Si 异质集成外腔可调谐激光器结构</title>
  <rect width="640" height="320" fill="#f8fafc" rx="10"/>

  <!-- 硅波导总线 -->
  <line x1="140" y1="160" x2="600" y2="160" stroke="#2563eb" stroke-width="8" stroke-linecap="round"/>

  <!-- 微环谐振器 -->
  <circle cx="240" cy="160" r="48" fill="none" stroke="#2563eb" stroke-width="8"/>
  <text x="240" y="160" text-anchor="middle" font-size="12" fill="#1e3a8a">微环谐振器</text>

  <!-- III-V 增益区 -->
  <rect x="330" y="142" width="150" height="36" fill="#dc2626" rx="6"/>
  <text x="405" y="165" text-anchor="middle" font-size="13" fill="#fff">III-V 增益区</text>

  <!-- 热光调谐电极 -->
  <rect x="380" y="120" width="60" height="14" fill="#f59e0b" rx="3"/>
  <line x1="410" y1="120" x2="410" y2="96" stroke="#b45309" stroke-width="2"/>
  <text x="410" y="86" text-anchor="middle" font-size="12" fill="#92400e">热光调谐</text>

  <!-- 输出箭头 -->
  <line x1="600" y1="160" x2="620" y2="160" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
  <path d="M612 150 L624 160 L612 170 Z" fill="#ef4444"/>
  <text x="560" y="192" text-anchor="middle" font-size="14" fill="#b91c1c">输出光</text>

  <!-- 标注 -->
  <text x="140" y="140" text-anchor="middle" font-size="13" fill="#334155">硅波导</text>
  <text x="240" y="238" text-anchor="middle" font-size="12" fill="#334155">波长选择 + 调谐</text>

  <!-- 图例 -->
  <g font-size="12" fill="#334155">
    <rect x="24" y="24" width="18" height="8" fill="#2563eb" rx="2"/>
    <text x="48" y="32">硅波导</text>
    <rect x="120" y="24" width="18" height="8" fill="#dc2626" rx="2"/>
    <text x="144" y="32">III-V 增益介质</text>
    <rect x="250" y="24" width="18" height="8" fill="#f59e0b" rx="2"/>
    <text x="274" y="32">调谐电极</text>
  </g>
</svg>
