<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#555"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="640" height="360" fill="#fafafa" stroke="#ddd"/>
  <text x="320" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">OIF七项互连项目技术分层</text>
  <rect x="60" y="50" width="520" height="60" rx="8" fill="#e8eef7" stroke="#7a9cc6"/>
  <text x="320" y="78" text-anchor="middle" font-size="14" fill="#1a3a5c">能效与管理框架（pJ/bit、管理接口）</text>
  <text x="320" y="98" text-anchor="middle" font-size="11" fill="#555">标准化目标：CPO链路 &lt;5 pJ/bit</text>
  <rect x="60" y="130" width="520" height="80" rx="8" fill="#fdf0e0" stroke="#d4a05a"/>
  <text x="320" y="158" text-anchor="middle" font-size="14" fill="#7a4a10">CPO光引擎（硅光调制器 + 光电探测器）</text>
  <text x="320" y="180" text-anchor="middle" font-size="11" fill="#555">微环/MZM调制 · 锗探测器 · 光纤耦合</text>
  <text x="320" y="198" text-anchor="middle" font-size="11" fill="#555">光信号经光纤连接外部网络</text>
  <rect x="60" y="230" width="520" height="60" rx="8" fill="#e0f0e8" stroke="#6aa87a"/>
  <text x="320" y="258" text-anchor="middle" font-size="14" fill="#1a5c2a">CEI-224G电接口（PAM-4，112GBaud）</text>
  <text x="320" y="278" text-anchor="middle" font-size="11" fill="#555">主机SerDes ↔ 光引擎，线性驱动或重定时</text>
  <line x1="320" y1="290" x2="320" y2="310" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="240" y="312" width="160" height="30" rx="6" fill="#ddd" stroke="#999"/>
  <text x="320" y="332" text-anchor="middle" font-size="12" fill="#333">交换ASIC / GPU</text>
  <line x1="580" y1="110" x2="580" y2="230" stroke="#555" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="595" y="170" font-size="10" fill="#555" transform="rotate(90,595,170)">数据流</text>
  <rect x="20" y="300" width="12" height="12" fill="#7a9cc6"/>
  <text x="38" y="311" font-size="10" fill="#333">标准框架</text>
  <rect x="20" y="320" width="12" height="12" fill="#d4a05a"/>
  <text x="38" y="331" font-size="10" fill="#333">光引擎</text>
  <rect x="20" y="340" width="12" height="12" fill="#6aa87a"/>
  <text x="38" y="351" font-size="10" fill="#333">电接口</text>
</svg>