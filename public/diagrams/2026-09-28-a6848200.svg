<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#d32f2f"/>
    </marker>
  </defs>
  <rect x="40" y="140" width="120" height="80" rx="10" fill="#bbdefb" stroke="#1976d2" stroke-width="2"/>
  <text x="100" y="185" text-anchor="middle" font-size="14" fill="#0d47a1">增益芯片</text>
  <line x1="160" y1="180" x2="280" y2="180" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="220" y="170" text-anchor="middle" font-size="12" fill="#333">总线波导</text>
  <circle cx="360" cy="180" r="50" fill="none" stroke="#388e3c" stroke-width="3"/>
  <text x="360" y="185" text-anchor="middle" font-size="14" fill="#1b5e20">微环</text>
  <line x1="310" y1="180" x2="280" y2="180" stroke="#d32f2f" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowRed)"/>
  <text x="300" y="210" text-anchor="middle" font-size="12" fill="#d32f2f">反馈光</text>
  <line x1="410" y1="180" x2="520" y2="180" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="470" y="170" text-anchor="middle" font-size="12" fill="#333">输出光</text>
  <rect x="40" y="260" width="560" height="80" rx="8" fill="#f5f5f5" stroke="#9e9e9e"/>
  <text x="60" y="285" font-size="13" fill="#333">锁定条件：Δω = ω₀ - ω_r ≈ 0</text>
  <text x="60" y="310" font-size="13" fill="#333">线宽压缩：Δν = ω_r / (2πQ)</text>
  <text x="60" y="335" font-size="13" fill="#333">无源调节：克尔效应 + 热光效应</text>
  <text x="500" y="50" font-size="12" fill="#666">图例</text>
  <line x1="500" y1="65" x2="530" y2="65" stroke="#333" stroke-width="2"/>
  <text x="535" y="70" font-size="12" fill="#333">光路</text>
  <line x1="500" y1="85" x2="530" y2="85" stroke="#d32f2f" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="535" y="90" font-size="12" fill="#333">反馈</text>
</svg>