<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="sans-serif">
  <defs>
    <linearGradient id="waveguide" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a90d9" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#4a90d9" stop-opacity="0.2"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
  <!-- 背景 -->
  <rect x="0" y="0" width="640" height="360" fill="#f9f9f9" stroke="#ccc" stroke-width="2"/>
  <!-- 衬底 -->
  <rect x="20" y="280" width="600" height="40" fill="#d9d9d9" stroke="#999" stroke-width="1"/>
  <text x="320" y="305" text-anchor="middle" font-size="12" fill="#666">硅衬底 (Si)</text>
  <!-- 埋氧层 -->
  <rect x="20" y="260" width="600" height="20" fill="#b3d9ff" stroke="#999" stroke-width="1"/>
  <text x="320" y="275" text-anchor="middle" font-size="10" fill="#666">埋氧层 (SiO₂)</text>
  <!-- 波导 -->
  <rect x="80" y="220" width="480" height="30" fill="url(#waveguide)" stroke="#2c6fbb" stroke-width="2" rx="5"/>
  <text x="320" y="240" text-anchor="middle" font-size="12" fill="#fff">光波导 (Si)</text>
  <!-- 激光器 -->
  <rect x="60" y="200" width="60" height="70" fill="#ff9999" stroke="#cc0000" stroke-width="2" rx="5"/>
  <text x="90" y="240" text-anchor="middle" font-size="11" fill="#fff">激光器</text>
  <text x="90" y="255" text-anchor="middle" font-size="9" fill="#fff">(III-V)</text>
  <!-- 调制器 -->
  <rect x="200" y="180" width="100" height="50" fill="#99cc99" stroke="#006600" stroke-width="2" rx="5"/>
  <text x="250" y="205" text-anchor="middle" font-size="11" fill="#fff">MZ 调制器</text>
  <text x="250" y="220" text-anchor="middle" font-size="9" fill="#fff">(PN 结)</text>
  <!-- 微环 -->
  <circle cx="400" cy="215" r="30" fill="none" stroke="#ff9900" stroke-width="3" stroke-dasharray="5,3"/>
  <text x="400" y="260" text-anchor="middle" font-size="10" fill="#ff9900">微环谐振器</text>
  <!-- 探测器 -->
  <rect x="500" y="190" width="60" height="50" fill="#cc99ff" stroke="#6600cc" stroke-width="2" rx="5"/>
  <text x="530" y="215" text-anchor="middle" font-size="11" fill="#fff">探测器</text>
  <text x="530" y="230" text-anchor="middle" font-size="9" fill="#fff">(Ge)</text>
  <!-- 光路箭头 -->
  <line x1="120" y1="235" x2="195" y2="235" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="300" y1="235" x2="365" y2="235" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="435" y1="235" x2="495" y2="235" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- 电信号箭头 -->
  <line x1="250" y1="160" x2="250" y2="175" stroke="#cc0000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="260" y="155" font-size="10" fill="#cc0000">电信号输入</text>
  <line x1="530" y1="185" x2="530" y2="170" stroke="#6600cc" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="540" y="165" font-size="10" fill="#6600cc">电信号输出</text>
  <!-- 图例 -->
  <rect x="20" y="20" width="160" height="80" fill="#fff" stroke="#ccc" stroke-width="1" rx="5"/>
  <text x="30" y="40" font-size="11" font-weight="bold">图例</text>
  <rect x="30" y="50" width="15" height="10" fill="#ff9999"/>
  <text x="50" y="60" font-size="10">光源</text>
  <rect x="30" y="65" width="15" height="10" fill="#99cc99"/>
  <text x="50" y="75" font-size="10">调制器</text>
  <rect x="30" y="80" width="15" height="10" fill="#cc99ff"/>
  <text x="50" y="90" font-size="10">探测器</text>
</svg>