<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 360' font-family='sans-serif'>
  <rect width='640' height='360' fill='#f7f9fc'/>
  <text x='320' y='28' text-anchor='middle' font-size='16' fill='#1a2b4a' font-weight='bold'>光子集成芯片典型链路</text>
  <rect x='30' y='80' width='100' height='60' rx='8' fill='#ffd166' stroke='#b8860b'/>
  <text x='80' y='105' text-anchor='middle' font-size='12' fill='#5a3e00'>片上激光器</text>
  <text x='80' y='125' text-anchor='middle' font-size='10' fill='#5a3e00'>连续光载波</text>
  <rect x='170' y='80' width='120' height='60' rx='8' fill='#8ecae6' stroke='#0077b6'/>
  <text x='230' y='105' text-anchor='middle' font-size='12' fill='#003049'>微环谐振器</text>
  <text x='230' y='125' text-anchor='middle' font-size='10' fill='#003049'>波长选择</text>
  <rect x='330' y='80' width='130' height='60' rx='8' fill='#a8dadc' stroke='#1d3557'/>
  <text x='395' y='105' text-anchor='middle' font-size='12' fill='#1d3557'>马赫-曾德尔调制器</text>
  <text x='395' y='125' text-anchor='middle' font-size='10' fill='#1d3557'>电光转换</text>
  <rect x='500' y='80' width='110' height='60' rx='8' fill='#f4a261' stroke='#e76f51'/>
  <text x='555' y='105' text-anchor='middle' font-size='12' fill='#5a2a00'>锗光电探测器</text>
  <text x='555' y='125' text-anchor='middle' font-size='10' fill='#5a2a00'>光电转换</text>
  <line x1='130' y1='110' x2='170' y2='110' stroke='#333' stroke-width='2' marker-end='url(#arrow)'/>
  <line x1='290' y1='110' x2='330' y2='110' stroke='#333' stroke-width='2' marker-end='url(#arrow)'/>
  <line x1='460' y1='110' x2='500' y2='110' stroke='#333' stroke-width='2' marker-end='url(#arrow)'/>
  <defs>
    <marker id='arrow' markerWidth='8' markerHeight='8' refX='6' refY='3' orient='auto'>
      <path d='M0,0 L6,3 L0,6 Z' fill='#333'/>
    </marker>
  </defs>
  <rect x='60' y='200' width='520' height='120' rx='10' fill='#ffffff' stroke='#cbd5e1'/>
  <text x='320' y='225' text-anchor='middle' font-size='13' fill='#1a2b4a' font-weight='bold'>核心物理关系</text>
  <text x='90' y='255' font-size='12' fill='#334155'>谐振条件：mλ = 2πR n_eff</text>
  <text x='90' y='280' font-size='12' fill='#334155'>干涉光强：I = I₁ + I₂ + 2√(I₁I₂)cosΔφ</text>
  <text x='90' y='305' font-size='12' fill='#334155'>四波混频：ω₁+ω₂ = ω₃+ω₄</text>
  <text x='320' y='345' text-anchor='middle' font-size='10' fill='#64748b'>图例：黄=光源，蓝=无源滤波，绿=调制，橙=探测</text>
</svg>