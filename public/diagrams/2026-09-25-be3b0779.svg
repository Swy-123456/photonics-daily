<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="sans-serif"><rect width="640" height="360" fill="#f8f9fa"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#212529">无悬挂键各向异性半导体X射线探测器</text><line x1="50" y1="60" x2="590" y2="60" stroke="#adb5bd" stroke-width="2"/><text x="60" y="55" font-size="12" fill="#6c757d">X射线</text><path d="M100 80 L100 140" stroke="#0d6efd" stroke-width="3" marker-end="url(#arrow)"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#0d6efd"/></marker></defs><rect x="80" y="150" width="480" height="30" fill="#e9ecef" stroke="#495057"/><text x="320" y="170" text-anchor="middle" font-size="12" fill="#212529">透明电极 (ITO)</text><rect x="80" y="180" width="480" height="80" fill="#d1e7dd" stroke="#495057"/><text x="320" y="220" text-anchor="middle" font-size="14" fill="#0f5132">无悬挂键、化学各向异性半导体</text><rect x="80" y="260" width="480" height="30" fill="#fff3cd" stroke="#495057"/><text x="320" y="280" text-anchor="middle" font-size="12" fill="#664d03">像素电极阵列</text><rect x="80" y="290" width="480" height="30" fill="#f8d7da" stroke="#495057"/><text x="320" y="310" text-anchor="middle" font-size="12" fill="#842029">读出电路 (ROIC)</text><circle cx="200" cy="200" r="4" fill="#0d6efd"/><circle cx="220" cy="210" r="4" fill="#0d6efd"/><circle cx="240" cy="195" r="4" fill="#0d6efd"/><circle cx="400" cy="205" r="4" fill="#dc3545"/><circle cx="420" cy="215" r="4" fill="#dc3545"/><circle cx="440" cy="200" r="4" fill="#dc3545"/><text x="500" y="200" font-size="12" fill="#0d6efd">电子</text><text x="500" y="220" font-size="12" fill="#dc3545">空穴</text><path d="M200 240 L200 260" stroke="#0d6efd" stroke-width="2" marker-end="url(#arrow)"/><path d="M220 240 L220 260" stroke="#0d6efd" stroke-width="2" marker-end="url(#arrow)"/><path d="M400 240 L400 260" stroke="#0d6efd" stroke-width="2" marker-end="url(#arrow)"/><text x="320" y="345" text-anchor="middle" font-size="11" fill="#6c757d">图例：蓝色圆点=电子，红色圆点=空穴，箭头=漂移方向</text></svg>