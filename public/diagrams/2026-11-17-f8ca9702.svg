<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="sans-serif">
  <rect x="0" y="0" width="640" height="360" fill="#f8f9fa" stroke="#ccc"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">OA-ICOS 火星甲烷探测仪原理</text>
  <!-- 激光器 -->
  <rect x="50" y="150" width="80" height="50" rx="8" fill="#4a90d9" stroke="#2c5f8a"/>
  <text x="90" y="180" text-anchor="middle" font-size="12" fill="white">激光器</text>
  <!-- 透镜 -->
  <ellipse cx="170" cy="175" rx="15" ry="25" fill="#a0c4e8" stroke="#2c5f8a"/>
  <text x="170" y="215" text-anchor="middle" font-size="11" fill="#333">透镜</text>
  <!-- 光学腔 -->
  <rect x="220" y="130" width="200" height="90" rx="5" fill="none" stroke="#666" stroke-width="2"/>
  <line x1="220" y1="130" x2="220" y2="220" stroke="#999" stroke-width="3"/>
  <line x1="420" y1="130" x2="420" y2="220" stroke="#999" stroke-width="3"/>
  <text x="320" y="120" text-anchor="middle" font-size="12" fill="#333">高反射腔（多次反射）</text>
  <!-- 多次反射光束 -->
  <path d="M220,160 L420,170 L220,180 L420,190 L220,200 L420,210" fill="none" stroke="#e67e22" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="320" y="240" text-anchor="middle" font-size="11" fill="#e67e22">离轴光斑</text>
  <!-- 探测器 -->
  <rect x="480" y="150" width="70" height="50" rx="8" fill="#27ae60" stroke="#1e8449"/>
  <text x="515" y="180" text-anchor="middle" font-size="12" fill="white">探测器</text>
  <!-- 信号处理 -->
  <rect x="480" y="250" width="70" height="40" rx="6" fill="#8e44ad" stroke="#6c3483"/>
  <text x="515" y="275" text-anchor="middle" font-size="11" fill="white">信号处理</text>
  <line x1="515" y1="200" x2="515" y2="250" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- 箭头定义 -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>
  <!-- 图例 -->
  <rect x="50" y="300" width="12" height="12" fill="#4a90d9"/>
  <text x="68" y="311" font-size="11" fill="#333">激光光源</text>
  <rect x="150" y="300" width="12" height="12" fill="#e67e22"/>
  <text x="168" y="311" font-size="11" fill="#333">光路</text>
  <rect x="230" y="300" width="12" height="12" fill="#27ae60"/>
  <text x="248" y="311" font-size="11" fill="#333">光电探测</text>
  <rect x="330" y="300" width="12" height="12" fill="#8e44ad"/>
  <text x="348" y="311" font-size="11" fill="#333">数据处理</text>
</svg>