<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2980b9"/>
    </marker>
  </defs>
  <!-- 背景 -->
  <rect x="0" y="0" width="640" height="360" fill="#f8f9fa"/>
  <!-- 芯片 -->
  <rect x="220" y="140" width="200" height="80" rx="8" fill="#d5e8d4" stroke="#27ae60" stroke-width="2"/>
  <text x="320" y="170" text-anchor="middle" font-size="14" fill="#1e5631">光子集成芯片 (PIC)</text>
  <text x="320" y="190" text-anchor="middle" font-size="12" fill="#1e5631">波导 + 调制器</text>
  <!-- 输入光栅 -->
  <rect x="240" y="130" width="20" height="10" fill="#f39c12" stroke="#e67e22" stroke-width="1"/>
  <text x="250" y="125" text-anchor="middle" font-size="10" fill="#e67e22">光栅</text>
  <!-- 输出光栅 -->
  <rect x="380" y="130" width="20" height="10" fill="#f39c12" stroke="#e67e22" stroke-width="1"/>
  <text x="390" y="125" text-anchor="middle" font-size="10" fill="#e67e22">光栅</text>
  <!-- 激光器 -->
  <rect x="40" y="60" width="100" height="50" rx="5" fill="#dae8fc" stroke="#2980b9" stroke-width="2"/>
  <text x="90" y="82" text-anchor="middle" font-size="13" fill="#1a5276">可调谐激光器</text>
  <text x="90" y="98" text-anchor="middle" font-size="11" fill="#1a5276">(λ扫描)</text>
  <!-- 输入探针 -->
  <line x1="140" y1="85" x2="240" y2="130" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="180" y="100" text-anchor="middle" font-size="11" fill="#e74c3c">光纤探针</text>
  <!-- 探测器 -->
  <rect x="500" y="60" width="100" height="50" rx="5" fill="#fdebd0" stroke="#e67e22" stroke-width="2"/>
  <text x="550" y="82" text-anchor="middle" font-size="13" fill="#a04000">光电探测器</text>
  <text x="550" y="98" text-anchor="middle" font-size="11" fill="#a04000">(光谱/眼图)</text>
  <!-- 输出探针 -->
  <line x1="400" y1="130" x2="500" y2="85" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="450" y="100" text-anchor="middle" font-size="11" fill="#e74c3c">光纤探针</text>
  <!-- 位移台 -->
  <rect x="220" y="250" width="200" height="30" rx="5" fill="#e8e8e8" stroke="#7f8c8d" stroke-width="2"/>
  <text x="320" y="270" text-anchor="middle" font-size="12" fill="#2c3e50">纳米位移台 (XYZ对准)</text>
  <!-- 电信号线 -->
  <line x1="320" y1="220" x2="320" y2="250" stroke="#2980b9" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowBlue)"/>
  <text x="340" y="240" font-size="10" fill="#2980b9">电信号</text>
  <!-- 图例 -->
  <rect x="480" y="280" width="140" height="60" rx="5" fill="#ffffff" stroke="#bdc3c7" stroke-width="1"/>
  <text x="490" y="298" font-size="11" fill="#2c3e50">图例</text>
  <line x1="490" y1="312" x2="520" y2="312" stroke="#e74c3c" stroke-width="2"/>
  <text x="525" y="316" font-size="10" fill="#2c3e50">光路</text>
  <line x1="490" y1="328" x2="520" y2="328" stroke="#2980b9" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="525" y="332" font-size="10" fill="#2c3e50">电信号</text>
</svg>