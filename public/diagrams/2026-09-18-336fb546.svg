<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="sans-serif">
  <rect width="640" height="360" fill="#f8fafc"/>
  <text x="320" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">1.6T 光模块测试链路</text>
  <!-- TX -->
  <rect x="30" y="70" width="120" height="200" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="90" y="95" text-anchor="middle" font-size="13" fill="#1e40af">PAM4 码型发生器</text>
  <text x="90" y="120" text-anchor="middle" font-size="11" fill="#1e40af">8 × 200Gbps</text>
  <rect x="45" y="140" width="90" height="22" rx="4" fill="#93c5fd"/>
  <rect x="45" y="170" width="90" height="22" rx="4" fill="#60a5fa"/>
  <rect x="45" y="200" width="90" height="22" rx="4" fill="#3b82f6"/>
  <rect x="45" y="230" width="90" height="22" rx="4" fill="#2563eb"/>
  <text x="90" y="256" text-anchor="middle" font-size="10" fill="#1e3a8a">... 8 通道</text>
  <!-- MUX -->
  <rect x="190" y="120" width="70" height="100" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="225" y="160" text-anchor="middle" font-size="12" fill="#92400e">波分</text>
  <text x="225" y="178" text-anchor="middle" font-size="12" fill="#92400e">复用器</text>
  <!-- Fiber -->
  <line x1="260" y1="170" x2="370" y2="170" stroke="#64748b" stroke-width="4"/>
  <text x="315" y="160" text-anchor="middle" font-size="11" fill="#475569">光纤链路</text>
  <!-- DEMUX -->
  <rect x="370" y="120" width="70" height="100" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="405" y="160" text-anchor="middle" font-size="12" fill="#92400e">解复用器</text>
  <!-- RX -->
  <rect x="480" y="70" width="130" height="200" rx="8" fill="#dcfce7" stroke="#22c55e"/>
  <text x="545" y="95" text-anchor="middle" font-size="13" fill="#166534">光接收机</text>
  <text x="545" y="120" text-anchor="middle" font-size="11" fill="#166534">+ 误码分析仪</text>
  <rect x="500" y="140" width="90" height="22" rx="4" fill="#86efac"/>
  <rect x="500" y="170" width="90" height="22" rx="4" fill="#4ade80"/>
  <rect x="500" y="200" width="90" height="22" rx="4" fill="#22c55e"/>
  <rect x="500" y="230" width="90" height="22" rx="4" fill="#16a34a"/>
  <!-- Metrics -->
  <rect x="30" y="300" width="580" height="45" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="320" y="320" text-anchor="middle" font-size="11" fill="#334155">关键指标：每通道 BER / 眼高 / 抖动 / 通道间偏斜 / OSNR</text>
  <text x="320" y="337" text-anchor="middle" font-size="10" fill="#64748b">KP4 FEC 下 pre-FEC BER &lt; 2.4×10⁻⁴</text>
  <!-- Legend -->
  <rect x="30" y="45" width="12" height="12" fill="#3b82f6"/>
  <text x="48" y="55" font-size="10" fill="#334155">电信号</text>
  <rect x="110" y="45" width="12" height="12" fill="#f59e0b"/>
  <text x="128" y="55" font-size="10" fill="#334155">无源光器件</text>
  <rect x="220" y="45" width="12" height="12" fill="#22c55e"/>
  <text x="238" y="55" font-size="10" fill="#334155">接收/分析</text>
</svg>