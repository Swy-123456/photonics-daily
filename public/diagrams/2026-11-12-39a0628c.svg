<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#e63946"/>
    </marker>
    <marker id="earrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#457b9d"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="640" height="360" fill="#f8f9fa"/>
  <text x="320" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d3557">硅光 Chiplet 集成架构</text>
  <!-- Laser chiplet -->
  <rect x="40" y="50" width="150" height="90" rx="10" fill="#a8dadc" stroke="#1d3557" stroke-width="1.5"/>
  <text x="115" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d3557">III-V 激光器芯粒</text>
  <text x="115" y="100" text-anchor="middle" font-size="11" fill="#1d3557">连续光输出</text>
  <text x="115" y="118" text-anchor="middle" font-size="11" fill="#1d3557">量子阱 / 量子点</text>
  <!-- Modulator chiplet -->
  <rect x="450" y="50" width="150" height="90" rx="10" fill="#ffd166" stroke="#1d3557" stroke-width="1.5"/>
  <text x="525" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d3557">硅 MZM 调制器芯粒</text>
  <text x="525" y="100" text-anchor="middle" font-size="11" fill="#1d3557">马赫-曾德尔干涉</text>
  <text x="525" y="118" text-anchor="middle" font-size="11" fill="#1d3557">电光调制</text>
  <!-- Router chiplet -->
  <rect x="40" y="220" width="150" height="90" rx="10" fill="#b7e4c7" stroke="#1d3557" stroke-width="1.5"/>
  <text x="115" y="250" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d3557">无源路由芯粒</text>
  <text x="115" y="270" text-anchor="middle" font-size="11" fill="#1d3557">波分复用 / 分束</text>
  <text x="115" y="288" text-anchor="middle" font-size="11" fill="#1d3557">微环谐振器</text>
  <!-- Detector chiplet -->
  <rect x="450" y="220" width="150" height="90" rx="10" fill="#f4a261" stroke="#1d3557" stroke-width="1.5"/>
  <text x="525" y="250" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d3557">Ge 光电探测器芯粒</text>
  <text x="525" y="270" text-anchor="middle" font-size="11" fill="#1d3557">光电效应</text>
  <text x="525" y="288" text-anchor="middle" font-size="11" fill="#1d3557">光→电转换</text>
  <!-- Optical links -->
  <line x1="190" y1="95" x2="450" y2="95" stroke="#e63946" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="320" y="85" text-anchor="middle" font-size="11" fill="#e63946">光波导 + 倒锥耦合</text>
  <line x1="525" y1="140" x2="525" y2="220" stroke="#e63946" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="580" y="185" text-anchor="middle" font-size="11" fill="#e63946">调制光</text>
  <line x1="190" y1="265" x2="450" y2="265" stroke="#e63946" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="320" y="255" text-anchor="middle" font-size="11" fill="#e63946">路由光信号</text>
  <!-- Electrical link -->
  <path d="M115 140 L115 180 L525 180 L525 140" fill="none" stroke="#457b9d" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#earrow)"/>
  <text x="320" y="172" text-anchor="middle" font-size="11" fill="#457b9d">微凸点电互连（调制信号）</text>
  <!-- Thermal layer -->
  <rect x="40" y="320" width="560" height="20" rx="5" fill="#adb5bd" stroke="#495057" stroke-width="1"/>
  <text x="320" y="335" text-anchor="middle" font-size="11" fill="#212529">热沉 / 温控层（热隔离与散热）</text>
  <!-- Legend -->
  <rect x="40" y="5" width="12" height="12" fill="#e63946"/>
  <text x="58" y="15" font-size="10" fill="#333">光路</text>
  <line x1="100" y1="11" x2="120" y2="11" stroke="#457b9d" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="126" y="15" font-size="10" fill="#333">电互连</text>
  <rect x="180" y="5" width="12" height="12" fill="#adb5bd"/>
  <text x="198" y="15" font-size="10" fill="#333">热管理</text>
</svg>