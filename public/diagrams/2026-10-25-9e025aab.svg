<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="sans-serif">
  <rect width="640" height="360" fill="#f8fafc"/>
  <text x="320" y="28" text-anchor="middle" font-size="18" fill="#0f172a">光子芯片封装中的光纤—波导耦合</text>
  <!-- fiber -->
  <rect x="40" y="90" width="150" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="115" y="125" text-anchor="middle" font-size="14" fill="#1e3a8a">单模光纤</text>
  <text x="115" y="145" text-anchor="middle" font-size="11" fill="#1e3a8a">模场 ~10 μm</text>
  <!-- SSC -->
  <polygon points="190,100 300,118 300,122 190,140" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
  <text x="245" y="90" text-anchor="middle" font-size="14" fill="#92400e">模斑转换器</text>
  <!-- chip -->
  <rect x="300" y="70" width="290" height="100" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="445" y="95" text-anchor="middle" font-size="14" fill="#166534">硅光子芯片</text>
  <rect x="330" y="110" width="70" height="30" rx="4" fill="#bbf7d0" stroke="#15803d"/>
  <text x="365" y="129" text-anchor="middle" font-size="11" fill="#14532d">调制器</text>
  <rect x="430" y="110" width="70" height="30" rx="4" fill="#bbf7d0" stroke="#15803d"/>
  <text x="465" y="129" text-anchor="middle" font-size="11" fill="#14532d">探测器</text>
  <rect x="520" y="110" width="50" height="30" rx="4" fill="#bbf7d0" stroke="#15803d"/>
  <text x="545" y="129" text-anchor="middle" font-size="11" fill="#14532d">波导</text>
  <!-- light path -->
  <line x1="190" y1="120" x2="300" y2="120" stroke="#ef4444" stroke-width="2" stroke-dasharray="6 4"/>
  <!-- curve -->
  <text x="80" y="220" font-size="13" fill="#334155">耦合损耗随横向偏移增大</text>
  <line x1="80" y1="320" x2="300" y2="320" stroke="#475569" stroke-width="1.5"/>
  <line x1="80" y1="320" x2="80" y2="240" stroke="#475569" stroke-width="1.5"/>
  <path d="M80,250 Q140,255 190,275 T300,315" fill="none" stroke="#dc2626" stroke-width="2.5"/>
  <text x="190" y="340" text-anchor="middle" font-size="11" fill="#475569">横向偏移 d</text>
  <text x="40" y="250" font-size="11" fill="#475569" transform="rotate(-90 40,250)">损耗 (dB)</text>
  <!-- legend -->
  <rect x="360" y="230" width="240" height="90" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="375" y="252" font-size="13" fill="#0f172a">图例</text>
  <line x1="375" y1="270" x2="405" y2="270" stroke="#ef4444" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="415" y="274" font-size="12" fill="#334155">光传播路径</text>
  <rect x="375" y="285" width="30" height="14" fill="#fde68a" stroke="#d97706"/>
  <text x="415" y="297" font-size="12" fill="#334155">模场过渡区</text>
</svg>