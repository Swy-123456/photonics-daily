<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="sans-serif"><rect width="640" height="360" fill="#f8f9fa"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2c3e50">BIC：散射零点的汇聚</text><g transform="translate(20,60)"><rect x="0" y="0" width="280" height="240" fill="#ffffff" stroke="#bdc3c7" stroke-width="2" rx="8"/><text x="140" y="25" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c3e50">对称保护BIC</text><line x1="40" y1="200" x2="240" y2="200" stroke="#7f8c8d" stroke-width="2"/><text x="140" y="220" text-anchor="middle" font-size="12" fill="#7f8c8d">频率</text><circle cx="140" cy="180" r="8" fill="#e74c3c"/><circle cx="140" cy="180" r="8" fill="#3498db" opacity="0.5"/><text x="140" y="160" text-anchor="middle" font-size="12" fill="#e74c3c">反射零点</text><text x="140" y="140" text-anchor="middle" font-size="12" fill="#3498db">透射零点</text><text x="140" y="100" text-anchor="middle" font-size="12" fill="#2c3e50">零点重合 → BIC</text></g><g transform="translate(340,60)"><rect x="0" y="0" width="280" height="240" fill="#ffffff" stroke="#bdc3c7" stroke-width="2" rx="8"/><text x="140" y="25" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c3e50">偶然BIC</text><line x1="40" y1="200" x2="240" y2="200" stroke="#7f8c8d" stroke-width="2"/><text x="140" y="220" text-anchor="middle" font-size="12" fill="#7f8c8d">频率</text><circle cx="100" cy="180" r="8" fill="#e74c3c"/><circle cx="180" cy="180" r="8" fill="#e74c3c"/><circle cx="140" cy="180" r="8" fill="#3498db"/><text x="100" y="160" text-anchor="middle" font-size="12" fill="#e74c3c">反射零点</text><text x="140" y="140" text-anchor="middle" font-size="12" fill="#3498db">透射零点</text><text x="140" y="100" text-anchor="middle" font-size="12" fill="#2c3e50">局域模型：零点分离</text><text x="140" y="80" text-anchor="middle" font-size="12" fill="#e67e22">非局域效应 → 汇聚</text></g><g transform="translate(20,310)"><rect x="0" y="0" width="15" height="15" fill="#e74c3c"/><text x="20" y="12" font-size="12" fill="#2c3e50">反射零点</text><rect x="120" y="0" width="15" height="15" fill="#3498db"/><text x="140" y="12" font-size="12" fill="#2c3e50">透射零点</text><rect x="240" y="0" width="15" height="15" fill="#e67e22"/><text x="260" y="12" font-size="12" fill="#2c3e50">非局域效应</text></g></svg>