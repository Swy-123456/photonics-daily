<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eef4fb"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2b6cb0"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#c53030"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="640" height="360" fill="url(#bg)" rx="12"/>
  <text x="320" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1a365d">集成超导纳米线单光子探测器（SNSPD）工作原理</text>
  <rect x="40" y="60" width="120" height="60" rx="8" fill="#bee3f8" stroke="#2b6cb0" stroke-width="2"/>
  <text x="100" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#1a365d">入射光子</text>
  <text x="100" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2b6cb0">光纤/波导</text>
  <line x1="160" y1="90" x2="220" y2="90" stroke="#2b6cb0" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="220" y="60" width="160" height="60" rx="8" fill="#c6f6d5" stroke="#2f855a" stroke-width="2"/>
  <text x="300" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#22543d">超导纳米线</text>
  <text x="300" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2f855a">偏置电流 Ib</text>
  <line x1="380" y1="90" x2="440" y2="90" stroke="#c53030" stroke-width="2" marker-end="url(#arrowRed)"/>
  <rect x="440" y="60" width="160" height="60" rx="8" fill="#fed7d7" stroke="#c53030" stroke-width="2"/>
  <text x="520" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#742a2a">电压脉冲</text>
  <text x="520" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#c53030">读出电路</text>
  <rect x="220" y="150" width="160" height="50" rx="8" fill="#fefcbf" stroke="#b7791f" stroke-width="2"/>
  <text x="300" y="172" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#744210">热点形成</text>
  <text x="300" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#b7791f">局部超导态破坏</text>
  <line x1="300" y1="120" x2="300" y2="150" stroke="#b7791f" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <rect x="40" y="240" width="560" height="90" rx="8" fill="#ffffff" stroke="#a0aec0" stroke-width="1.5"/>
  <text x="60" y="265" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2d3748">图例</text>
  <line x1="60" y1="285" x2="100" y2="285" stroke="#2b6cb0" stroke-width="3"/>
  <text x="110" y="289" font-family="Arial, sans-serif" font-size="12" fill="#2d3748">光子/波导</text>
  <line x1="220" y1="285" x2="260" y2="285" stroke="#2f855a" stroke-width="3"/>
  <text x="270" y="289" font-family="Arial, sans-serif" font-size="12" fill="#2d3748">超导纳米线</text>
  <line x1="380" y1="285" x2="420" y2="285" stroke="#c53030" stroke-width="3"/>
  <text x="430" y="289" font-family="Arial, sans-serif" font-size="12" fill="#2d3748">电信号/读出</text>
  <text x="60" y="315" font-family="Arial, sans-serif" font-size="12" fill="#4a5568">低温环境（T &lt; Tc）：维持纳米线超导态</text>
</svg>