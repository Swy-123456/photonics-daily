<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="sans-serif">
  <defs>
    <linearGradient id="fiberGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4a90d9"/>
      <stop offset="100%" stop-color="#7ec8e3"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d9e6f2"/>
      <stop offset="100%" stop-color="#b0c4de"/>
    </linearGradient>
  </defs>
  <!-- 背景 -->
  <rect width="640" height="360" fill="#fafafa" rx="8"/>
  <!-- 光纤 -->
  <rect x="30" y="140" width="120" height="40" rx="20" fill="url(#fiberGrad)" stroke="#2c6fbb" stroke-width="2"/>
  <text x="90" y="165" text-anchor="middle" font-size="13" fill="#fff">单模光纤</text>
  <text x="90" y="130" text-anchor="middle" font-size="11" fill="#555">MFD ≈ 10 μm</text>
  <!-- 模斑转换器 -->
  <polygon points="150,140 210,155 210,165 150,180" fill="#f5a623" stroke="#d4891a" stroke-width="2"/>
  <text x="180" y="200" text-anchor="middle" font-size="11" fill="#d4891a">模斑转换器</text>
  <text x="180" y="215" text-anchor="middle" font-size="10" fill="#888">SSC</text>
  <!-- 硅光芯片 -->
  <rect x="210" y="120" width="280" height="80" rx="6" fill="url(#chipGrad)" stroke="#5a7fa0" stroke-width="2"/>
  <text x="350" y="112" text-anchor="middle" font-size="13" fill="#3a5a7a" font-weight="bold">硅光芯片</text>
  <!-- 波导 -->
  <line x1="210" y1="160" x2="490" y2="160" stroke="#e74c3c" stroke-width="3"/>
  <!-- 微环 -->
  <circle cx="300" cy="160" r="18" fill="none" stroke="#8e44ad" stroke-width="3"/>
  <text x="300" y="195" text-anchor="middle" font-size="10" fill="#8e44ad">微环</text>
  <!-- 调制器 -->
  <rect x="370" y="148" width="60" height="24" rx="4" fill="#2ecc71" opacity="0.7" stroke="#27ae60" stroke-width="2"/>
  <text x="400" y="165" text-anchor="middle" font-size="10" fill="#fff">调制器</text>
  <!-- 探测器 -->
  <rect x="450" y="148" width="30" height="24" rx="4" fill="#e67e22" opacity="0.8" stroke="#d35400" stroke-width="2"/>
  <text x="465" y="165" text-anchor="middle" font-size="9" fill="#fff">PD</text>
  <!-- 封装基板 -->
  <rect x="210" y="230" width="280" height="30" rx="4" fill="#7f8c8d" opacity="0.5" stroke="#5d6d7e" stroke-width="2"/>
  <text x="350" y="250" text-anchor="middle" font-size="12" fill="#fff">封装基板 / Interposer</text>
  <!-- 焊球 -->
  <circle cx="250" cy="275" r="8" fill="#bdc3c7" stroke="#95a5a6" stroke-width="1.5"/>
  <circle cx="310" cy="275" r="8" fill="#bdc3c7" stroke="#95a5a6" stroke-width="1.5"/>
  <circle cx="370" cy="275" r="8" fill="#bdc3c7" stroke="#95a5a6" stroke-width="1.5"/>
  <circle cx="430" cy="275" r="8" fill="#bdc3c7" stroke="#95a5a6" stroke-width="1.5"/>
  <text x="350" y="300" text-anchor="middle" font-size="11" fill="#555">焊球阵列（BGA）</text>
  <!-- 图例 -->
  <rect x="30" y="310" width="580" height="40" rx="6" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <line x1="50" y1="330" x2="80" y2="330" stroke="#e74c3c" stroke-width="3"/>
  <text x="85" y="334" font-size="11" fill="#555">光路</text>
  <line x1="150" y1="330" x2="180" y2="330" stroke="#2ecc71" stroke-width="3"/>
  <text x="185" y="334" font-size="11" fill="#555">电信号</text>
  <rect x="260" y="322" width="20" height="16" rx="3" fill="#bdc3c7" stroke="#95a5a6" stroke-width="1"/>
  <text x="285" y="334" font-size="11" fill="#555">机械/热支撑</text>
  <text x="420" y="334" font-size="11" fill="#888">izmo SiPh 封装示意</text>
</svg>