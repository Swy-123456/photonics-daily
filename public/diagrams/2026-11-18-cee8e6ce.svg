<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>
  <rect width="640" height="360" fill="#f9f9f9" stroke="#ccc"/>
  <!-- 光轴 -->
  <line x1="30" y1="180" x2="610" y2="180" stroke="#aaa" stroke-dasharray="5,5"/>
  <!-- 点光源 -->
  <circle cx="80" cy="180" r="6" fill="#e74c3c"/>
  <text x="60" y="210" font-size="12" fill="#e74c3c">点光源</text>
  <!-- 离轴抛物面镜 -->
  <path d="M200,60 Q260,180 200,300" stroke="#2980b9" stroke-width="3" fill="none"/>
  <text x="150" y="50" font-size="12" fill="#2980b9">离轴抛物面镜</text>
  <!-- 焦距标注 -->
  <line x1="80" y1="180" x2="200" y2="180" stroke="#333" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="130" y="170" font-size="12" fill="#333">f</text>
  <!-- 平行光束 -->
  <line x1="210" y1="140" x2="400" y2="140" stroke="#27ae60" stroke-width="2"/>
  <line x1="210" y1="180" x2="400" y2="180" stroke="#27ae60" stroke-width="2"/>
  <line x1="210" y1="220" x2="400" y2="220" stroke="#27ae60" stroke-width="2"/>
  <text x="280" y="130" font-size="12" fill="#27ae60">准直平行光</text>
  <!-- 被测镜头 -->
  <ellipse cx="430" cy="180" rx="15" ry="60" fill="#f1c40f" stroke="#b7950b"/>
  <text x="410" y="260" font-size="12" fill="#b7950b">被测镜头</text>
  <!-- 焦平面探测器 -->
  <rect x="520" y="150" width="20" height="60" fill="#8e44ad" stroke="#5b2c6f"/>
  <text x="500" y="235" font-size="12" fill="#8e44ad">焦平面探测器</text>
  <!-- 汇聚光线 -->
  <line x1="445" y1="140" x2="520" y2="175" stroke="#e67e22" stroke-width="1.5"/>
  <line x1="445" y1="220" x2="520" y2="185" stroke="#e67e22" stroke-width="1.5"/>
  <!-- MTF曲线小图 -->
  <rect x="470" y="20" width="140" height="80" fill="#fff" stroke="#999"/>
  <polyline points="480,90 500,40 540,30 580,50 600,90" fill="none" stroke="#c0392b" stroke-width="2"/>
  <text x="510" y="15" font-size="11" fill="#c0392b">MTF曲线</text>
  <!-- 图例 -->
  <rect x="20" y="300" width="600" height="50" fill="#fff" stroke="#ddd"/>
  <circle cx="40" cy="325" r="5" fill="#e74c3c"/><text x="50" y="329" font-size="11">点光源</text>
  <line x1="110" y1="325" x2="140" y2="325" stroke="#2980b9" stroke-width="3"/><text x="145" y="329" font-size="11">抛物面镜</text>
  <line x1="210" y1="325" x2="240" y2="325" stroke="#27ae60" stroke-width="2"/><text x="245" y="329" font-size="11">平行光</text>
  <ellipse cx="310" cy="325" rx="8" ry="12" fill="#f1c40f" stroke="#b7950b"/><text x="325" y="329" font-size="11">被测镜头</text>
  <rect x="390" y="318" width="10" height="14" fill="#8e44ad"/><text x="405" y="329" font-size="11">探测器</text>
  <line x1="460" y1="325" x2="490" y2="325" stroke="#c0392b" stroke-width="2"/><text x="495" y="329" font-size="11">MTF曲线</text>
</svg>