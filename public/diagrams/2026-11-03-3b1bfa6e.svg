<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>
  <rect width="640" height="360" fill="#f8f9fa" stroke="#ccc"/>
  <text x="320" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">硅光PIC核心器件与制造流程</text>
  <!-- Left: PIC layout -->
  <rect x="20" y="50" width="300" height="260" fill="#e3f2fd" stroke="#1565c0" rx="8"/>
  <text x="170" y="75" text-anchor="middle" font-size="13" fill="#0d47a1">硅光芯片布局</text>
  <!-- Laser input -->
  <rect x="40" y="100" width="40" height="30" fill="#ffcc80" stroke="#e65100"/>
  <text x="60" y="120" text-anchor="middle" font-size="10" fill="#e65100">激光器</text>
  <!-- Grating coupler -->
  <line x1="80" y1="115" x2="110" y2="115" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="110" y="100" width="30" height="30" fill="#a5d6a7" stroke="#2e7d32"/>
  <text x="125" y="120" text-anchor="middle" font-size="9" fill="#2e7d32">光栅</text>
  <!-- Splitter -->
  <line x1="140" y1="115" x2="170" y2="115" stroke="#333" stroke-width="2"/>
  <line x1="170" y1="115" x2="170" y2="85" stroke="#333" stroke-width="2"/>
  <line x1="170" y1="115" x2="170" y2="145" stroke="#333" stroke-width="2"/>
  <text x="180" y="110" font-size="9" fill="#555">分束</text>
  <!-- MZM upper arm -->
  <rect x="190" y="70" width="100" height="30" fill="#bbdefb" stroke="#1565c0"/>
  <text x="240" y="90" text-anchor="middle" font-size="10" fill="#0d47a1">MZM调制器</text>
  <line x1="170" y1="85" x2="190" y2="85" stroke="#333" stroke-width="2"/>
  <line x1="290" y1="85" x2="310" y2="85" stroke="#333" stroke-width="2"/>
  <!-- Ring lower arm -->
  <circle cx="240" cy="145" r="25" fill="none" stroke="#6a1b9a" stroke-width="2"/>
  <text x="240" y="180" text-anchor="middle" font-size="9" fill="#6a1b9a">微环谐振器</text>
  <line x1="170" y1="145" x2="215" y2="145" stroke="#333" stroke-width="2"/>
  <line x1="265" y1="145" x2="310" y2="145" stroke="#333" stroke-width="2"/>
  <!-- Combine -->
  <line x1="310" y1="85" x2="330" y2="85" stroke="#333" stroke-width="2"/>
  <line x1="310" y1="145" x2="330" y2="145" stroke="#333" stroke-width="2"/>
  <line x1="330" y1="85" x2="330" y2="145" stroke="#333" stroke-width="2"/>
  <!-- Ge detector -->
  <rect x="340" y="100" width="40" height="30" fill="#ef9a9a" stroke="#b71c1c"/>
  <text x="360" y="120" text-anchor="middle" font-size="9" fill="#b71c1c">Ge探测器</text>
  <line x1="330" y1="115" x2="340" y2="115" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Output -->
  <line x1="380" y1="115" x2="410" y2="115" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="420" y="120" font-size="9" fill="#555">电信号</text>
  <!-- Right: Fab flow -->
  <rect x="340" y="50" width="280" height="260" fill="#fff3e0" stroke="#e65100" rx="8"/>
  <text x="480" y="75" text-anchor="middle" font-size="13" fill="#bf360c">晶圆代工流程</text>
  <rect x="360" y="95" width="60" height="30" fill="#ffe0b2" stroke="#e65100"/>
  <text x="390" y="115" text-anchor="middle" font-size="9" fill="#bf360c">设计</text>
  <line x1="420" y1="110" x2="440" y2="110" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="440" y="95" width="60" height="30" fill="#ffe0b2" stroke="#e65100"/>
  <text x="470" y="115" text-anchor="middle" font-size="9" fill="#bf360c">掩膜</text>
  <line x1="500" y1="110" x2="520" y2="110" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="520" y="95" width="60" height="30" fill="#ffe0b2" stroke="#e65100"/>
  <text x="550" y="115" text-anchor="middle" font-size="9" fill="#bf360c">光刻</text>
  <line x1="550" y1="125" x2="550" y2="145" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="520" y="145" width="60" height="30" fill="#ffe0b2" stroke="#e65100"/>
  <text x="550" y="165" text-anchor="middle" font-size="9" fill="#bf360c">刻蚀</text>
  <line x1="520" y1="160" x2="500" y2="160" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="440" y="145" width="60" height="30" fill="#ffe0b2" stroke="#e65100"/>
  <text x="470" y="165" text-anchor="middle" font-size="9" fill="#bf360c">外延</text>
  <line x1="440" y1="160" x2="420" y2="160" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="360" y="145" width="60" height="30" fill="#ffe0b2" stroke="#e65100"/>
  <text x="390" y="165" text-anchor="middle" font-size="9" fill="#bf360c">测试</text>
  <!-- Legend -->
  <rect x="360" y="200" width="240" height="90" fill="#fff" stroke="#ccc" rx="4"/>
  <text x="370" y="220" font-size="10" font-weight="bold" fill="#333">图例</text>
  <rect x="370" y="230" width="12" height="12" fill="#bbdefb" stroke="#1565c0"/>
  <text x="388" y="240" font-size="9" fill="#333">调制器</text>
  <rect x="450" y="230" width="12" height="12" fill="#ef9a9a" stroke="#b71c1c"/>
  <text x="468" y="240" font-size="9" fill="#333">探测器</text>
  <circle cx="376" cy="258" r="6" fill="none" stroke="#6a1b9a" stroke-width="2"/>
  <text x="388" y="262" font-size="9" fill="#333">微环</text>
  <rect x="450" y="252" width="12" height="12" fill="#a5d6a7" stroke="#2e7d32"/>
  <text x="468" y="262" font-size="9" fill="#333">光栅耦合器</text>
</svg>