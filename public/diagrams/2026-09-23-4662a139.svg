<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="sans-serif"><rect width="640" height="360" fill="#f8f9fa"/><text x="320" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a2e">50G PAM4 前传链路与模拟均衡补偿</text><rect x="30" y="60" width="120" height="70" rx="8" fill="#e3f2fd" stroke="#1976d2"/><text x="90" y="88" text-anchor="middle" font-size="12" fill="#0d47a1">PAM4 映射</text><text x="90" y="108" text-anchor="middle" font-size="11" fill="#333">2×25G NRZ→50G</text><rect x="170" y="60" width="120" height="70" rx="8" fill="#e8f5e9" stroke="#388e3c"/><text x="230" y="88" text-anchor="middle" font-size="12" fill="#1b5e20">驱动器 + CTLE</text><text x="230" y="108" text-anchor="middle" font-size="11" fill="#333">高频预加重</text><rect x="310" y="60" width="120" height="70" rx="8" fill="#fff3e0" stroke="#f57c00"/><text x="370" y="88" text-anchor="middle" font-size="12" fill="#e65100">硅光 MZM</text><text x="370" y="108" text-anchor="middle" font-size="11" fill="#333">马赫-曾德尔调制</text><line x1="430" y1="95" x2="470" y2="95" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/><rect x="470" y="60" width="140" height="70" rx="8" fill="#fce4ec" stroke="#c2185b"/><text x="540" y="88" text-anchor="middle" font-size="12" fill="#880e4f">光纤传输</text><text x="540" y="108" text-anchor="middle" font-size="11" fill="#333">损耗 + 色散</text><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#555"/></marker></defs><line x1="540" y1="130" x2="540" y2="170" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/><rect x="440" y="170" width="200" height="70" rx="8" fill="#ede7f6" stroke="#5e35b1"/><text x="540" y="198" text-anchor="middle" font-size="12" fill="#311b92">Ge/Si 光电探测器 + TIA</text><text x="540" y="218" text-anchor="middle" font-size="11" fill="#333">光电转换 + 跨阻放大</text><line x1="440" y1="205" x2="380" y2="205" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/><rect x="240" y="170" width="140" height="70" rx="8" fill="#e0f7fa" stroke="#00838f"/><text x="310" y="198" text-anchor="middle" font-size="12" fill="#006064">CTLE 均衡</text><text x="310" y="218" text-anchor="middle" font-size="11" fill="#333">高频补偿</text><line x1="240" y1="205" x2="180" y2="205" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="170" width="120" height="70" rx="8" fill="#fffde7" stroke="#f9a825"/><text x="120" y="198" text-anchor="middle" font-size="12" fill="#f57f17">输出 50G PAM4</text><text x="120" y="218" text-anchor="middle" font-size="11" fill="#333">眼图张开</text><rect x="60" y="270" width="520" height="70" rx="8" fill="#ffffff" stroke="#ccc"/><text x="80" y="292" font-size="11" fill="#333">链路响应 |H_link(f)| 随频率下降（蓝）</text><line x1="80" y1="305" x2="560" y2="305" stroke="#e0e0e0" stroke-width="1"/><path d="M80,300 Q200,300 320,320 Q440,335 560,340" fill="none" stroke="#1976d2" stroke-width="2"/><text x="80" y="332" font-size="11" fill="#333">CTLE 响应 |H_CTLE(f)| 高频抬升（红）</text><path d="M80,335 Q200,335 320,320 Q440,310 560,305" fill="none" stroke="#d32f2f" stroke-width="2" stroke-dasharray="5,3"/><text x="320" y="355" text-anchor="middle" font-size="10" fill="#666">补偿后总响应在奈奎斯特频率附近趋于平坦</text></svg>