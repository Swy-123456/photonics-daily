<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="sans-serif">
  <rect width="640" height="360" fill="#f7f9fc"/>
  <text x="320" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2d3d">抗辐射太空光学系统环境载荷与设计对策</text>
  <g stroke="#2c3e50" stroke-width="1.5" fill="none">
    <rect x="30" y="60" width="120" height="50" rx="8" fill="#d6e4f0"/>
    <rect x="30" y="130" width="120" height="50" rx="8" fill="#f0d6d6"/>
    <rect x="30" y="200" width="120" height="50" rx="8" fill="#d6f0e0"/>
    <rect x="30" y="270" width="120" height="50" rx="8" fill="#f0e6d6"/>
  </g>
  <text x="90" y="90" text-anchor="middle" font-size="13" fill="#1f2d3d">发射振动</text>
  <text x="90" y="160" text-anchor="middle" font-size="13" fill="#1f2d3d">热真空循环</text>
  <text x="90" y="230" text-anchor="middle" font-size="13" fill="#1f2d3d">出气污染</text>
  <text x="90" y="300" text-anchor="middle" font-size="13" fill="#1f2d3d">宇宙辐射</text>
  <g stroke="#7f8c8d" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="150" y1="85" x2="230" y2="160"/>
    <line x1="150" y1="155" x2="230" y2="170"/>
    <line x1="150" y1="225" x2="230" y2="180"/>
    <line x1="150" y1="295" x2="230" y2="190"/>
  </g>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#7f8c8d"/>
    </marker>
  </defs>
  <g>
    <ellipse cx="330" cy="175" rx="70" ry="45" fill="#cfe2f3" stroke="#2c3e50" stroke-width="2"/>
    <ellipse cx="330" cy="175" rx="50" ry="30" fill="#e8f0fe" stroke="#2c3e50" stroke-width="1.5"/>
    <text x="330" y="180" text-anchor="middle" font-size="12" fill="#1f2d3d">光学镜头</text>
    <text x="330" y="240" text-anchor="middle" font-size="11" fill="#555">低CTE玻璃 · 抗辐射镀膜 · 柔性装夹</text>
  </g>
  <g stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrowG)">
    <line x1="400" y1="175" x2="470" y2="100"/>
    <line x1="400" y1="175" x2="470" y2="160"/>
    <line x1="400" y1="175" x2="470" y2="220"/>
    <line x1="400" y1="175" x2="470" y2="280"/>
  </g>
  <defs>
    <marker id="arrowG" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#27ae60"/>
    </marker>
  </defs>
  <g font-size="12" fill="#1f2d3d">
    <rect x="480" y="70" width="140" height="50" rx="6" fill="#eafaf1" stroke="#27ae60"/>
    <text x="550" y="90" text-anchor="middle">高刚度轻质结构</text>
    <text x="550" y="108" text-anchor="middle">一阶模态 &gt; 100 Hz</text>
    <rect x="480" y="130" width="140" height="50" rx="6" fill="#eafaf1" stroke="#27ae60"/>
    <text x="550" y="150" text-anchor="middle">低膨胀材料匹配</text>
    <text x="550" y="168" text-anchor="middle">Zerodur / ULE</text>
    <rect x="480" y="190" width="140" height="50" rx="6" fill="#eafaf1" stroke="#27ae60"/>
    <text x="550" y="210" text-anchor="middle">低出气工艺</text>
    <text x="550" y="228" text-anchor="middle">TML&lt;1% CVCM&lt;0.1%</text>
    <rect x="480" y="250" width="140" height="50" rx="6" fill="#eafaf1" stroke="#27ae60"/>
    <text x="550" y="270" text-anchor="middle">掺铈石英 + ITO</text>
    <text x="550" y="288" text-anchor="middle">抑制色心与静电</text>
  </g>
  <text x="320" y="345" text-anchor="middle" font-size="11" fill="#7f8c8d">图例：灰色箭头=环境载荷作用路径；绿色箭头=设计对策</text>
</svg>