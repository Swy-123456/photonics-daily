<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>
  <!-- 背景 -->
  <rect width="640" height="360" fill="#f9f9f9" stroke="#ccc" stroke-width="1"/>
  <!-- 标题 -->
  <text x="320" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">无标记光学成像监测癌细胞辐射响应</text>
  <!-- 激光光源 -->
  <rect x="30" y="60" width="80" height="40" rx="5" fill="#4a90d9" stroke="#2a5f9e"/>
  <text x="70" y="85" text-anchor="middle" font-size="12" fill="#fff">激光光源</text>
  <!-- 光束 -->
  <line x1="110" y1="80" x2="170" y2="80" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- 光学系统 -->
  <rect x="170" y="60" width="60" height="40" rx="5" fill="#f1c40f" stroke="#b7950b"/>
  <text x="200" y="85" text-anchor="middle" font-size="11" fill="#333">光学系统</text>
  <!-- 细胞 -->
  <circle cx="300" cy="80" r="25" fill="#aed6f1" stroke="#2e86c1" stroke-width="2"/>
  <text x="300" y="85" text-anchor="middle" font-size="11" fill="#1a5276">癌细胞</text>
  <!-- 散射光箭头 -->
  <line x1="325" y1="65" x2="380" y2="50" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="325" y1="80" x2="380" y2="80" stroke="#8e44ad" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="325" y1="95" x2="380" y2="110" stroke="#e67e22" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- 探测模块 -->
  <rect x="390" y="35" width="100" height="30" rx="4" fill="#d5f5e3" stroke="#27ae60"/>
  <text x="440" y="55" text-anchor="middle" font-size="11" fill="#1e8449">拉曼散射 (脂质/蛋白)</text>
  <rect x="390" y="70" width="100" height="30" rx="4" fill="#e8daef" stroke="#8e44ad"/>
  <text x="440" y="90" text-anchor="middle" font-size="11" fill="#6c3483">自发荧光 (NAD(P)H/FAD)</text>
  <rect x="390" y="105" width="100" height="30" rx="4" fill="#fdebd0" stroke="#e67e22"/>
  <text x="440" y="125" text-anchor="middle" font-size="11" fill="#a04000">相位成像 (形态/干质量)</text>
  <!-- 辐射前后对比 -->
  <text x="320" y="170" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">辐射前后信号变化</text>
  <!-- 辐射前 -->
  <rect x="80" y="190" width="200" height="120" rx="8" fill="#eaf2f8" stroke="#5dade2"/>
  <text x="180" y="210" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e86c1">辐射前</text>
  <text x="100" y="235" font-size="11" fill="#333">• 脂质滴：少</text>
  <text x="100" y="255" font-size="11" fill="#333">• 蛋白：还原态为主</text>
  <text x="100" y="275" font-size="11" fill="#333">• 代谢：NAD(P)H/FAD 较高</text>
  <!-- 辐射后 -->
  <rect x="360" y="190" width="200" height="120" rx="8" fill="#fdedec" stroke="#e74c3c"/>
  <text x="460" y="210" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">辐射后</text>
  <text x="380" y="235" font-size="11" fill="#333">• 脂质滴：增多</text>
  <text x="380" y="255" font-size="11" fill="#333">• 蛋白：氧化/降解</text>
  <text x="380" y="275" font-size="11" fill="#333">• 代谢：比值改变</text>
  <!-- 图例 -->
  <rect x="30" y="325" width="12" height="12" fill="#27ae60"/>
  <text x="48" y="335" font-size="10" fill="#333">拉曼</text>
  <rect x="100" y="325" width="12" height="12" fill="#8e44ad"/>
  <text x="118" y="335" font-size="10" fill="#333">自发荧光</text>
  <rect x="180" y="325" width="12" height="12" fill="#e67e22"/>
  <text x="198" y="335" font-size="10" fill="#333">相位</text>
</svg>