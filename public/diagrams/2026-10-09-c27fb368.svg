<svg viewBox='0 0 640 360' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif' font-size='12'><rect width='640' height='360' fill='#f8f9fa'/><text x='320' y='24' text-anchor='middle' font-size='16' font-weight='bold' fill='#1a1a2e'>PCIe 7.0 信号链架构</text><rect x='20' y='60' width='80' height='50' rx='8' fill='#4a90d9' stroke='#2c5f8a' stroke-width='2'/><text x='60' y='90' text-anchor='middle' fill='white' font-size='11'>发送端</text><text x='60' y='100' text-anchor='middle' fill='white' font-size='9'>128 GT/s</text><line x1='100' y1='85' x2='160' y2='85' stroke='#4a90d9' stroke-width='3' stroke-dasharray='6,3'/><text x='130' y='78' text-anchor='middle' fill='#4a90d9' font-size='9'>PCB 走线</text><rect x='160' y='55' width='100' height='60' rx='8' fill='#e67e22' stroke='#b85c0e' stroke-width='2'/><text x='210' y='80' text-anchor='middle' fill='white' font-size='11'>重定时器</text><text x='210' y='95' text-anchor='middle' fill='white' font-size='9'>CTLE+DFE+CDR</text><line x1='260' y1='85' x2='320' y2='85' stroke='#4a90d9' stroke-width='3'/><text x='290' y='78' text-anchor='middle' fill='#4a90d9' font-size='9'>再发送</text><rect x='320' y='55' width='110' height='60' rx='8' fill='#27ae60' stroke='#1a7a42' stroke-width='2'/><text x='375' y='80' text-anchor='middle' fill='white' font-size='11'>智能线缆模块</text><text x='375' y='95' text-anchor='middle' fill='white' font-size='9'>铜/光转换</text><line x1='430' y1='85' x2='500' y2='85' stroke='#e74c3c' stroke-width='3'/><text x='465' y='78' text-anchor='middle' fill='#e74c3c' font-size='9'>光信号</text><rect x='500' y='60' width='80' height='50' rx='8' fill='#8e44ad' stroke='#6c3483' stroke-width='2'/><text x='540' y='90' text-anchor='middle' fill='white' font-size='11'>接收端</text><text x='540' y='100' text-anchor='middle' fill='white' font-size='9'>眼图张开</text><rect x='40' y='160' width='560' height='80' rx='6' fill='#fff' stroke='#ccc' stroke-width='1'/><text x='60' y='182' font-size='11' fill='#333'>眼图演变：</text><path d='M80,220 Q120,180 160,220 Q200,260 240,220' fill='none' stroke='#e74c3c' stroke-width='2'/><text x='160' y='250' text-anchor='middle' fill='#e74c3c' font-size='9'>发送端眼图</text><path d='M280,220 Q300,215 320,220 Q340,225 360,220' fill='none' stroke='#e67e22' stroke-width='2'/><text x='320' y='250' text-anchor='middle' fill='#e67e22' font-size='9'>信道后眼图闭合</text><path d='M400,220 Q440,180 480,220 Q520,260 560,220' fill='none' stroke='#27ae60' stroke-width='2'/><text x='480' y='250' text-anchor='middle' fill='#27ae60' font-size='9'>重定时后眼图恢复</text><rect x='40' y='270' width='560' height='70' rx='6' fill='#fff' stroke='#ccc' stroke-width='1'/><text x='60' y='292' font-size='11' fill='#333'>图例：</text><rect x='80' y='282' width='16' height='10' fill='#4a90d9'/><text x='102' y='292' font-size='10' fill='#333'>电信号</text><rect x='180' y='282' width='16' height='10' fill='#e74c3c'/><text x='202' y='292' font-size='10' fill='#333'>光信号</text><rect x='280' y='282' width='16' height='10' fill='#e67e22'/><text x='302' y='292' font-size='10' fill='#333'>均衡/时钟恢复</text><rect x='420' y='282' width='16' height='10' fill='#27ae60'/><text x='442' y='292' font-size='10' fill='#333'>信号整形</text><text x='60' y='325' font-size='10' fill='#666'>注：CTLE=连续时间线性均衡器，DFE=判决反馈均衡器，CDR=时钟数据恢复</text></svg>