<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
    <linearGradient id="fiberGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e0f7fa"/>
      <stop offset="100%" stop-color="#b2ebf2"/>
    </linearGradient>
  </defs>
  <!-- 背景 -->
  <rect x="0" y="0" width="640" height="360" fill="#fafafa" stroke="none"/>
  <!-- 标题 -->
  <text x="320" y="25" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#333">GMN光纤放大器噪声演化</text>
  <!-- 输入区 -->
  <rect x="30" y="60" width="80" height="240" rx="8" fill="#fff3e0" stroke="#ff9800" stroke-width="1.5"/>
  <text x="70" y="80" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#e65100">输入</text>
  <text x="70" y="100" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#e65100">种子脉冲</text>
  <text x="70" y="120" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#e65100">+ 泵浦噪声</text>
  <!-- 输入信号波形 -->
  <path d="M40,180 Q50,150 60,180 T80,180" fill="none" stroke="#1976d2" stroke-width="2"/>
  <path d="M40,200 Q50,190 60,200 T80,200" fill="none" stroke="#d32f2f" stroke-width="1.5" stroke-dasharray="4,2"/>
  <!-- 箭头到光纤 -->
  <line x1="110" y1="180" x2="150" y2="180" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- 增益光纤 -->
  <rect x="150" y="80" width="340" height="200" rx="10" fill="url(#fiberGrad)" stroke="#00838f" stroke-width="2"/>
  <text x="320" y="100" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#006064">增益光纤（GMN区）</text>
  <!-- 频率相关增益曲线（绿色） -->
  <path d="M180,240 Q250,120 320,240 Q390,120 460,240" fill="none" stroke="#4caf50" stroke-width="2.5"/>
  <text x="320" y="260" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#2e7d32">频率相关增益</text>
  <!-- 信号频谱展宽（蓝色） -->
  <path d="M180,180 Q220,150 260,180 Q300,210 340,180 Q380,150 420,180 Q460,210 480,180" fill="none" stroke="#1976d2" stroke-width="2"/>
  <text x="330" y="150" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#0d47a1">信号频谱展宽</text>
  <!-- 噪声频谱（红色虚线） -->
  <path d="M180,200 Q230,170 280,200 Q330,230 380,200 Q430,170 480,200" fill="none" stroke="#d32f2f" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="330" y="220" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#b71c1c">噪声频谱搬移</text>
  <!-- SPM箭头 -->
  <path d="M300,160 L300,140" stroke="#fbc02d" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="310" y="135" font-family="sans-serif" font-size="11" fill="#f57f17">SPM</text>
  <!-- 箭头到输出 -->
  <line x1="490" y1="180" x2="530" y2="180" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- 输出区 -->
  <rect x="530" y="60" width="80" height="240" rx="8" fill="#e8f5e9" stroke="#4caf50" stroke-width="1.5"/>
  <text x="570" y="80" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1b5e20">输出</text>
  <text x="570" y="100" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1b5e20">脉冲能量</text>
  <text x="570" y="120" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1b5e20">涨落</text>
  <!-- 输出脉冲示意 -->
  <path d="M540,180 Q550,160 560,180 T580,180" fill="none" stroke="#1976d2" stroke-width="2"/>
  <path d="M540,195 Q550,185 560,195 T580,195" fill="none" stroke="#d32f2f" stroke-width="1.5" stroke-dasharray="4,2"/>
  <!-- 图例 -->
  <rect x="30" y="320" width="580" height="30" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="4"/>
  <line x1="50" y1="335" x2="80" y2="335" stroke="#1976d2" stroke-width="2"/>
  <text x="85" y="339" font-family="sans-serif" font-size="11" fill="#333">信号</text>
  <line x1="130" y1="335" x2="160" y2="335" stroke="#d32f2f" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="165" y="339" font-family="sans-serif" font-size="11" fill="#333">噪声</text>
  <line x1="210" y1="335" x2="240" y2="335" stroke="#4caf50" stroke-width="2.5"/>
  <text x="245" y="339" font-family="sans-serif" font-size="11" fill="#333">频率相关增益</text>
  <line x1="340" y1="335" x2="370" y2="335" stroke="#fbc02d" stroke-width="2"/>
  <text x="375" y="339" font-family="sans-serif" font-size="11" fill="#333">自相位调制</text>
</svg>