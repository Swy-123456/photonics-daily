<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#333"/>
    </marker>
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff4d4d"/>
      <stop offset="100%" stop-color="#ff9999"/>
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="640" height="360" fill="#f9f9f9" stroke="#ccc" stroke-width="1"/>
  
  <!-- 激光源 -->
  <rect x="30" y="140" width="70" height="50" rx="8" fill="url(#laserGrad)" stroke="#b30000" stroke-width="2"/>
  <text x="65" y="170" text-anchor="middle" font-size="12" fill="#fff">飞秒激光</text>
  
  <!-- 光束 -->
  <line x1="100" y1="165" x2="180" y2="165" stroke="#ff4d4d" stroke-width="3" marker-end="url(#arrow)"/>
  
  <!-- SLM -->
  <rect x="180" y="120" width="80" height="90" rx="5" fill="#cce5ff" stroke="#0066cc" stroke-width="2"/>
  <text x="220" y="155" text-anchor="middle" font-size="11" fill="#003366">空间光</text>
  <text x="220" y="170" text-anchor="middle" font-size="11" fill="#003366">调制器</text>
  <text x="220" y="185" text-anchor="middle" font-size="10" fill="#003366">(SLM)</text>
  
  <!-- 光束 -->
  <line x1="260" y1="165" x2="340" y2="165" stroke="#ff4d4d" stroke-width="3" marker-end="url(#arrow)"/>
  
  <!-- 透镜 -->
  <ellipse cx="350" cy="165" rx="15" ry="40" fill="#e6f2ff" stroke="#0066cc" stroke-width="2"/>
  <text x="350" y="220" text-anchor="middle" font-size="11" fill="#003366">透镜</text>
  
  <!-- 光束聚焦 -->
  <line x1="365" y1="165" x2="430" y2="165" stroke="#ff4d4d" stroke-width="3" marker-end="url(#arrow)"/>
  
  <!-- 铁磁薄膜 -->
  <rect x="430" y="110" width="100" height="110" rx="5" fill="#e6ffe6" stroke="#009933" stroke-width="2"/>
  <text x="480" y="140" text-anchor="middle" font-size="11" fill="#004d00">Co/Pt</text>
  <text x="480" y="155" text-anchor="middle" font-size="11" fill="#004d00">铁磁薄膜</text>
  
  <!-- 磁化箭头 -->
  <line x1="460" y1="180" x2="500" y2="180" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="480" y="200" text-anchor="middle" font-size="10" fill="#000">磁化翻转</text>
  
  <!-- CVB 偏振示意 -->
  <circle cx="480" cy="80" r="25" fill="none" stroke="#ff9900" stroke-width="2"/>
  <line x1="480" y1="55" x2="480" y2="105" stroke="#ff9900" stroke-width="1.5"/>
  <line x1="455" y1="80" x2="505" y2="80" stroke="#ff9900" stroke-width="1.5"/>
  <text x="480" y="45" text-anchor="middle" font-size="10" fill="#cc6600">CVB 偏振</text>
  
  <!-- 图例 -->
  <rect x="30" y="280" width="580" height="60" rx="5" fill="#fff" stroke="#ccc" stroke-width="1"/>
  <text x="45" y="300" font-size="11" fill="#333">图例：</text>
  <line x1="90" y1="295" x2="120" y2="295" stroke="#ff4d4d" stroke-width="3"/>
  <text x="125" y="300" font-size="10" fill="#333">飞秒激光</text>
  <rect x="200" y="288" width="20" height="15" fill="#cce5ff" stroke="#0066cc"/>
  <text x="225" y="300" font-size="10" fill="#333">SLM</text>
  <rect x="280" y="288" width="20" height="15" fill="#e6ffe6" stroke="#009933"/>
  <text x="305" y="300" font-size="10" fill="#333">铁磁薄膜</text>
  <line x1="400" y1="295" x2="430" y2="295" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="435" y="300" font-size="10" fill="#333">磁化方向</text>
  <circle cx="520" cy="295" r="8" fill="none" stroke="#ff9900" stroke-width="2"/>
  <text x="535" y="300" font-size="10" fill="#333">CVB</text>
</svg>