<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360"><rect width="640" height="360" fill="#f8f9fa"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2c3e50">时间斐波那契准晶中的损耗效应</text><rect x="50" y="60" width="240" height="200" fill="#ffffff" stroke="#3498db" stroke-width="2"/><text x="170" y="85" text-anchor="middle" font-size="14" fill="#3498db">无损耗</text><line x1="70" y1="240" x2="270" y2="240" stroke="#333" stroke-width="1"/><line x1="70" y1="100" x2="70" y2="240" stroke="#333" stroke-width="1"/><text x="170" y="260" text-anchor="middle" font-size="12">频率</text><text x="40" y="170" text-anchor="middle" font-size="12" transform="rotate(-90,40,170)">透射率</text><path d="M70,240 L80,240 L85,110 L90,240 L100,240 L105,110 L110,240 L120,240 L125,110 L130,240 L140,240 L145,110 L150,240 L160,240 L165,110 L170,240 L180,240 L185,110 L190,240 L200,240 L205,110 L210,240 L220,240 L225,110 L230,240 L240,240 L245,110 L250,240 L260,240 L265,110 L270,240" fill="none" stroke="#e74c3c" stroke-width="2"/><text x="170" y="290" text-anchor="middle" font-size="12" fill="#e74c3c">分形结构：稀疏频率点透射率为1</text><rect x="350" y="60" width="240" height="200" fill="#ffffff" stroke="#2ecc71" stroke-width="2"/><text x="470" y="85" text-anchor="middle" font-size="14" fill="#2ecc71">有微弱损耗</text><line x1="370" y1="240" x2="570" y2="240" stroke="#333" stroke-width="1"/><line x1="370" y1="100" x2="370" y2="240" stroke="#333" stroke-width="1"/><text x="470" y="260" text-anchor="middle" font-size="12">频率</text><text x="340" y="170" text-anchor="middle" font-size="12" transform="rotate(-90,340,170)">透射率</text><path d="M370,240 Q420,230 470,200 Q520,170 570,150" fill="none" stroke="#e67e22" stroke-width="2"/><text x="470" y="290" text-anchor="middle" font-size="12" fill="#e67e22">所有频率透射率指数衰减</text><defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#333"/></marker></defs><line x1="290" y1="160" x2="340" y2="160" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/><text x="315" y="150" text-anchor="middle" font-size="12" fill="#333">引入损耗</text><rect x="50" y="320" width="12" height="12" fill="#e74c3c"/><text x="70" y="330" font-size="12">无损耗透射谱</text><rect x="200" y="320" width="12" height="12" fill="#e67e22"/><text x="220" y="330" font-size="12">有损耗透射谱</text></svg>