<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>
  <rect x="40" y="60" width="100" height="40" rx="8" fill="#a8d8ea" stroke="#333"/>
  <text x="90" y="85" text-anchor="middle" font-size="14">浸润层 (WL)</text>
  <rect x="200" y="60" width="100" height="40" rx="8" fill="#f9d56e" stroke="#333"/>
  <text x="250" y="85" text-anchor="middle" font-size="14">激发态 (ES)</text>
  <rect x="360" y="60" width="100" height="40" rx="8" fill="#f8a978" stroke="#333"/>
  <text x="410" y="85" text-anchor="middle" font-size="14">基态 (GS)</text>
  <rect x="520" y="60" width="80" height="40" rx="8" fill="#b5e6b5" stroke="#333"/>
  <text x="560" y="85" text-anchor="middle" font-size="14">光子输出</text>
  <line x1="140" y1="80" x2="195" y2="80" stroke="#333" marker-end="url(#arrow)"/>
  <text x="167" y="70" text-anchor="middle" font-size="10">俘获</text>
  <line x1="300" y1="80" x2="355" y2="80" stroke="#333" marker-end="url(#arrow)"/>
  <text x="327" y="70" text-anchor="middle" font-size="10">弛豫</text>
  <line x1="460" y1="80" x2="515" y2="80" stroke="#333" marker-end="url(#arrow)"/>
  <text x="487" y="70" text-anchor="middle" font-size="10">受激辐射</text>
  <rect x="40" y="160" width="560" height="30" rx="8" fill="#e0e0e0" stroke="#333"/>
  <text x="320" y="180" text-anchor="middle" font-size="14">电流注入 → 载流子输运 → 能级填充 → 光增益 → 激光输出</text>
  <text x="320" y="230" text-anchor="middle" font-size="12" fill="#555">泡利阻塞：每个量子点基态最多容纳 2 个电子</text>
  <text x="320" y="260" text-anchor="middle" font-size="12" fill="#555">增益条件：f &gt; 0.5（基态填充因子）</text>
  <rect x="40" y="290" width="560" height="50" rx="8" fill="#f0f0f0" stroke="#ccc"/>
  <text x="60" y="310" font-size="12">图例：</text>
  <rect x="110" y="300" width="20" height="12" fill="#a8d8ea"/><text x="135" y="312" font-size="12">浸润层</text>
  <rect x="190" y="300" width="20" height="12" fill="#f9d56e"/><text x="215" y="312" font-size="12">激发态</text>
  <rect x="270" y="300" width="20" height="12" fill="#f8a978"/><text x="295" y="312" font-size="12">基态</text>
  <rect x="350" y="300" width="20" height="12" fill="#b5e6b5"/><text x="375" y="312" font-size="12">光子</text>
</svg>