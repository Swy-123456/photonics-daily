<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg"><rect width="640" height="360" fill="#f8f9fa"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">原位光碳化聚合物点上转换发光机制</text><circle cx="150" cy="180" r="50" fill="#e0e0e0" stroke="#666" stroke-width="2"/><text x="150" y="185" text-anchor="middle" font-size="14" fill="#333">聚合物点</text><circle cx="140" cy="170" r="5" fill="#333"/><circle cx="160" cy="190" r="5" fill="#333"/><circle cx="155" cy="165" r="5" fill="#333"/><path d="M60 180 Q100 160 130 180" stroke="red" stroke-width="2" fill="none" marker-end="url(#arrowRed)"/><text x="80" y="150" font-size="12" fill="red">激发光</text><line x1="250" y1="280" x2="550" y2="280" stroke="#333" stroke-width="2"/><text x="400" y="300" text-anchor="middle" font-size="12" fill="#333">基态</text><line x1="250" y1="200" x2="550" y2="200" stroke="#333" stroke-width="2"/><text x="400" y="220" text-anchor="middle" font-size="12" fill="#333">低能态</text><line x1="250" y1="120" x2="550" y2="120" stroke="#333" stroke-width="2"/><text x="400" y="140" text-anchor="middle" font-size="12" fill="#333">高能态</text><line x1="300" y1="280" x2="300" y2="200" stroke="blue" stroke-width="2" stroke-dasharray="5,5"/><text x="310" y="240" font-size="12" fill="blue">激发</text><line x1="300" y1="200" x2="300" y2="120" stroke="green" stroke-width="2" stroke-dasharray="5,5"/><text x="310" y="160" font-size="12" fill="green">声子辅助</text><line x1="300" y1="120" x2="300" y2="280" stroke="#ff6600" stroke-width="2" stroke-dasharray="5,5"/><text x="310" y="80" font-size="12" fill="#ff6600">辐射复合</text><path d="M350 120 Q400 100 450 120" stroke="#ff6600" stroke-width="2" fill="none" marker-end="url(#arrowOrange)"/><text x="400" y="100" font-size="12" fill="#ff6600">发射光</text><defs><marker id="arrowRed" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="red"/></marker><marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#ff6600"/></marker></defs><rect x="20" y="320" width="600" height="30" fill="#fff" stroke="#ccc"/><text x="30" y="340" font-size="12" fill="#333">图例：</text><line x1="80" y1="335" x2="110" y2="335" stroke="red" stroke-width="2"/><text x="115" y="340" font-size="12" fill="#333">激发光</text><line x1="170" y1="335" x2="200" y2="335" stroke="#ff6600" stroke-width="2"/><text x="205" y="340" font-size="12" fill="#333">发射光</text><line x1="260" y1="335" x2="290" y2="335" stroke="green" stroke-width="2" stroke-dasharray="5,5"/><text x="295" y="340" font-size="12" fill="#333">声子</text><circle cx="360" cy="335" r="5" fill="#333"/><text x="370" y="340" font-size="12" fill="#333">碳簇</text></svg>