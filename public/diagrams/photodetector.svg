<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" font-family="system-ui, sans-serif">
  <title>锗硅波导光电探测器截面结构与倏逝波耦合</title>
  <rect width="640" height="360" fill="#f8fafc" rx="10"/>

  <!-- 硅衬底 -->
  <rect x="60" y="240" width="520" height="70" fill="#cbd5e1" rx="4"/>
  <text x="320" y="280" text-anchor="middle" font-size="14" fill="#334155">Si 衬底</text>

  <!-- 埋氧层 BOX -->
  <rect x="60" y="200" width="520" height="40" fill="#e2e8f0" rx="4"/>
  <text x="320" y="225" text-anchor="middle" font-size="13" fill="#64748b">SiO₂ 埋氧层（BOX）</text>

  <!-- 硅波导 -->
  <rect x="180" y="150" width="200" height="50" fill="#60a5fa" rx="3"/>
  <text x="280" y="180" text-anchor="middle" font-size="14" fill="#1e3a8a">Si 波导</text>

  <!-- 锗吸收层 -->
  <rect x="230" y="80" width="130" height="70" fill="#dc2626" rx="3"/>
  <text x="295" y="122" text-anchor="middle" font-size="14" fill="#fff">Ge 吸收层</text>

  <!-- 金属电极 -->
  <rect x="150" y="90" width="48" height="20" fill="#f59e0b" rx="3"/>
  <rect x="370" y="90" width="48" height="20" fill="#f59e0b" rx="3"/>
  <text x="174" y="104" text-anchor="middle" font-size="11" fill="#7c2d12">电极</text>
  <text x="394" y="104" text-anchor="middle" font-size="11" fill="#7c2d12">电极</text>

  <!-- 入射光箭头 -->
  <line x1="60" y1="175" x2="170" y2="175" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
  <path d="M156 166 L172 175 L156 184 Z" fill="#ef4444"/>
  <text x="90" y="150" text-anchor="middle" font-size="14" fill="#b91c1c">入射光 1550 nm</text>

  <!-- 光生载流子标注 -->
  <text x="500" y="110" text-anchor="middle" font-size="13" fill="#334155">光生电子-空穴对</text>
  <circle cx="500" cy="130" r="5" fill="#2563eb"/>
  <circle cx="520" cy="135" r="5" fill="#dc2626"/>
  <text x="500" y="152" text-anchor="middle" font-size="11" fill="#64748b">e⁻ / h⁺</text>

  <!-- 载流子漂移箭头 -->
  <line x1="470" y1="128" x2="430" y2="128" stroke="#64748b" stroke-width="2" stroke-dasharray="4 3"/>
  <path d="M436 123 L426 128 L436 133 Z" fill="#64748b"/>
</svg>
