<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff6b6b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffd93d" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="spec" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4d96ff"/>
      <stop offset="50%" stop-color="#6bcb77"/>
      <stop offset="100%" stop-color="#ff6b6b"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="640" height="360" fill="#f7f9fc"/>
  <text x="320" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a2b4a">Cobra-D 800 OCT 光谱仪工作链路与深度-分辨率权衡</text>
  <!-- 光源 -->
  <rect x="20" y="60" width="70" height="36" rx="6" fill="#4d96ff"/>
  <text x="55" y="83" text-anchor="middle" font-size="11" fill="#fff">宽带光源</text>
  <!-- 分束器 -->
  <polygon points="130,78 150,58 170,78 150,98" fill="#ffd93d" stroke="#b8860b" stroke-width="1.5"/>
  <text x="150" y="118" text-anchor="middle" font-size="10" fill="#333">分束器</text>
  <!-- 参考臂 -->
  <line x1="170" y1="78" x2="230" y2="78" stroke="#ff6b6b" stroke-width="2"/>
  <rect x="230" y="60" width="50" height="36" rx="4" fill="#ff6b6b"/>
  <text x="255" y="83" text-anchor="middle" font-size="10" fill="#fff">参考镜</text>
  <!-- 样品臂 -->
  <line x1="150" y1="98" x2="150" y2="160" stroke="#6bcb77" stroke-width="2"/>
  <rect x="120" y="160" width="60" height="50" rx="4" fill="#6bcb77" opacity="0.8"/>
  <text x="150" y="190" text-anchor="middle" font-size="10" fill="#fff">深层组织</text>
  <!-- 干涉光到光谱仪 -->
  <line x1="170" y1="78" x2="300" y2="78" stroke="url(#beam)" stroke-width="3"/>
  <text x="235" y="70" text-anchor="middle" font-size="9" fill="#555">干涉光</text>
  <!-- 光谱仪 -->
  <rect x="300" y="50" width="310" height="120" rx="8" fill="#ffffff" stroke="#1a2b4a" stroke-width="1.5"/>
  <text x="455" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a2b4a">光谱仪</text>
  <!-- 光栅 -->
  <rect x="320" y="90" width="40" height="50" rx="3" fill="#9b5de5"/>
  <text x="340" y="120" text-anchor="middle" font-size="9" fill="#fff">光栅</text>
  <!-- 透镜 -->
  <ellipse cx="410" cy="115" rx="12" ry="28" fill="#00bbf9" opacity="0.7"/>
  <text x="410" y="155" text-anchor="middle" font-size="9" fill="#333">透镜</text>
  <!-- 相机 -->
  <rect x="460" y="90" width="120" height="50" rx="4" fill="#1a2b4a"/>
  <rect x="470" y="100" width="100" height="30" fill="url(#spec)"/>
  <text x="520" y="155" text-anchor="middle" font-size="9" fill="#333">线阵相机</text>
  <!-- 光谱色散线 -->
  <line x1="360" y1="95" x2="395" y2="105" stroke="#4d96ff" stroke-width="2"/>
  <line x1="360" y1="110" x2="395" y2="115" stroke="#6bcb77" stroke-width="2"/>
  <line x1="360" y1="125" x2="395" y2="125" stroke="#ff6b6b" stroke-width="2"/>
  <!-- 下方曲线 -->
  <text x="320" y="210" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a2b4a">深度-分辨率权衡</text>
  <!-- 带宽曲线 -->
  <path d="M60,250 Q160,210 260,250" fill="none" stroke="#ff6b6b" stroke-width="2.5"/>
  <text x="160" y="205" text-anchor="middle" font-size="10" fill="#ff6b6b">23 nm 带宽 → 轴向分辨率 ≈ 10 μm</text>
  <!-- 分辨率曲线 -->
  <path d="M60,320 Q160,290 260,320" fill="none" stroke="#4d96ff" stroke-width="2.5"/>
  <text x="160" y="285" text-anchor="middle" font-size="10" fill="#4d96ff">0.01 nm 采样 → 成像深度 15.5 mm</text>
  <!-- 中心波长标注 -->
  <text x="520" y="230" text-anchor="middle" font-size="11" fill="#333">中心波长 842 nm</text>
  <!-- 图例 -->
  <rect x="420" y="250" width="12" height="12" fill="#ff6b6b"/>
  <text x="438" y="260" font-size="10" fill="#333">带宽决定分辨率</text>
  <rect x="420" y="275" width="12" height="12" fill="#4d96ff"/>
  <text x="438" y="285" font-size="10" fill="#333">采样决定深度</text>
  <rect x="420" y="300" width="12" height="12" fill="#9b5de5"/>
  <text x="438" y="310" font-size="10" fill="#333">光栅分光</text>
</svg>