<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="sans-serif">
  <rect width="640" height="360" fill="#f8f9fa" stroke="#ccc" stroke-width="1"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2c3e50">Dirac-3S 光子量子优化机原理</text>
  <!-- Pump Laser -->
  <rect x="30" y="140" width="80" height="50" rx="8" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <text x="70" y="170" text-anchor="middle" font-size="12" fill="white">泵浦激光</text>
  <!-- Beam Splitter -->
  <polygon points="150,140 180,165 150,190" fill="#e67e22" stroke="#d35400" stroke-width="2"/>
  <text x="165" y="215" text-anchor="middle" font-size="10" fill="#d35400">分束器</text>
  <!-- OPO Array -->
  <rect x="230" y="60" width="180" height="240" rx="10" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2"/>
  <text x="320" y="85" text-anchor="middle" font-size="13" fill="#2c3e50">OPO 腔阵列</text>
  <!-- OPO circles -->
  <circle cx="270" cy="120" r="18" fill="#9b59b6" stroke="#8e44ad" stroke-width="2"/>
  <text x="270" y="125" text-anchor="middle" font-size="10" fill="white">OPO</text>
  <circle cx="320" cy="120" r="18" fill="#9b59b6" stroke="#8e44ad" stroke-width="2"/>
  <text x="320" y="125" text-anchor="middle" font-size="10" fill="white">OPO</text>
  <circle cx="370" cy="120" r="18" fill="#9b59b6" stroke="#8e44ad" stroke-width="2"/>
  <text x="370" y="125" text-anchor="middle" font-size="10" fill="white">OPO</text>
  <circle cx="270" cy="200" r="18" fill="#9b59b6" stroke="#8e44ad" stroke-width="2"/>
  <text x="270" y="205" text-anchor="middle" font-size="10" fill="white">OPO</text>
  <circle cx="320" cy="200" r="18" fill="#9b59b6" stroke="#8e44ad" stroke-width="2"/>
  <text x="320" y="205" text-anchor="middle" font-size="10" fill="white">OPO</text>
  <circle cx="370" cy="200" r="18" fill="#9b59b6" stroke="#8e44ad" stroke-width="2"/>
  <text x="370" y="205" text-anchor="middle" font-size="10" fill="white">OPO</text>
  <!-- Coupling lines -->
  <line x1="288" y1="120" x2="302" y2="120" stroke="#e74c3c" stroke-width="2"/>
  <line x1="338" y1="120" x2="352" y2="120" stroke="#e74c3c" stroke-width="2"/>
  <line x1="270" y1="138" x2="270" y2="182" stroke="#e74c3c" stroke-width="2"/>
  <line x1="320" y1="138" x2="320" y2="182" stroke="#e74c3c" stroke-width="2"/>
  <line x1="370" y1="138" x2="370" y2="182" stroke="#e74c3c" stroke-width="2"/>
  <text x="320" y="245" text-anchor="middle" font-size="10" fill="#e74c3c">可编程耦合网络 J_ij</text>
  <!-- Detector -->
  <rect x="460" y="140" width="80" height="50" rx="8" fill="#27ae60" stroke="#229954" stroke-width="2"/>
  <text x="500" y="170" text-anchor="middle" font-size="12" fill="white">探测器</text>
  <!-- Arrows -->
  <line x1="110" y1="165" x2="145" y2="165" stroke="#7f8c8d" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="180" y1="165" x2="225" y2="165" stroke="#7f8c8d" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="410" y1="165" x2="455" y2="165" stroke="#7f8c8d" stroke-width="2" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="#7f8c8d"/>
    </marker>
  </defs>
  <!-- Legend -->
  <rect x="30" y="280" width="580" height="60" rx="6" fill="#ffffff" stroke="#ddd" stroke-width="1"/>
  <text x="40" y="300" font-size="11" fill="#2c3e50">图例：</text>
  <rect x="90" y="290" width="12" height="12" fill="#3498db"/><text x="108" y="300" font-size="10" fill="#2c3e50">泵浦源</text>
  <rect x="170" y="290" width="12" height="12" fill="#9b59b6"/><text x="188" y="300" font-size="10" fill="#2c3e50">OPO 腔</text>
  <rect x="250" y="290" width="12" height="12" fill="#e74c3c"/><text x="268" y="300" font-size="10" fill="#2c3e50">耦合</text>
  <rect x="320" y="290" width="12" height="12" fill="#27ae60"/><text x="338" y="300" font-size="10" fill="#2c3e50">探测器</text>
  <text x="40" y="325" font-size="10" fill="#7f8c8d">光路：泵浦 → 分束 → OPO 网络 → 探测输出</text>
</svg>