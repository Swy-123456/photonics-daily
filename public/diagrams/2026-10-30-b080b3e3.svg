<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#333"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#e74c3c"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#2ecc71"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#9b59b6"/>
    </marker>
  </defs>
  
  <!-- 价带和导带 -->
  <rect x="50" y="200" width="540" height="80" fill="#3498db" opacity="0.2" stroke="#2980b9" stroke-width="2"/>
  <text x="320" y="245" text-anchor="middle" font-size="16" fill="#2c3e50">价带</text>
  
  <rect x="50" y="80" width="540" height="80" fill="#e74c3c" opacity="0.2" stroke="#c0392b" stroke-width="2"/>
  <text x="320" y="125" text-anchor="middle" font-size="16" fill="#2c3e50">导带</text>
  
  <!-- 带隙标注 -->
  <line x1="30" y1="160" x2="610" y2="160" stroke="#333" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="320" y="155" text-anchor="middle" font-size="14" fill="#333">带隙</text>
  
  <!-- 激光激发 -->
  <path d="M80,280 Q100,260 120,280 Q140,300 160,280 Q180,260 200,280" stroke="#e74c3c" stroke-width="3" fill="none" marker-end="url(#arrowRed)"/>
  <text x="140" y="310" text-anchor="middle" font-size="14" fill="#e74c3c">强激光</text>
  
  <!-- 电子跃迁 -->
  <line x1="200" y1="240" x2="200" y2="120" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="200" cy="120" r="8" fill="#3498db"/>
  <text x="215" y="115" font-size="12" fill="#2c3e50">电子</text>
  
  <!-- 空穴 -->
  <circle cx="200" cy="240" r="8" fill="#e67e22"/>
  <text x="215" y="245" font-size="12" fill="#2c3e50">空穴</text>
  
  <!-- 电子在导带中加速 -->
  <path d="M220,120 Q300,60 380,120" stroke="#3498db" stroke-width="2" fill="none" stroke-dasharray="4,2"/>
  <text x="300" y="70" text-anchor="middle" font-size="12" fill="#3498db">加速</text>
  
  <!-- 声子散射 -->
  <path d="M400,120 Q420,80 440,120 Q460,160 480,120" stroke="#2ecc71" stroke-width="3" fill="none" marker-end="url(#arrowGreen)"/>
  <text x="440" y="75" text-anchor="middle" font-size="14" fill="#2ecc71">声子</text>
  
  <!-- 散射后电子 -->
  <circle cx="480" cy="120" r="8" fill="#3498db" opacity="0.6"/>
  <text x="495" y="115" font-size="12" fill="#2c3e50">散射后</text>
  
  <!-- 复合辐射 -->
  <line x1="480" y1="120" x2="480" y2="240" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M480,240 Q520,200 560,240" stroke="#9b59b6" stroke-width="3" fill="none" marker-end="url(#arrowPurple)"/>
  <text x="540" y="210" text-anchor="middle" font-size="14" fill="#9b59b6">谐波光子</text>
  
  <!-- 图例 -->
  <rect x="450" y="280" width="150" height="70" fill="white" stroke="#333" stroke-width="1"/>
  <text x="460" y="300" font-size="12" fill="#333">图例</text>
  <line x1="460" y1="315" x2="480" y2="315" stroke="#e74c3c" stroke-width="2"/>
  <text x="490" y="320" font-size="12" fill="#333">激光</text>
  <line x1="460" y1="335" x2="480" y2="335" stroke="#2ecc71" stroke-width="2"/>
  <text x="490" y="340" font-size="12" fill="#333">声子</text>
  <circle cx="470" cy="355" r="5" fill="#3498db"/>
  <text x="490" y="360" font-size="12" fill="#333">电子</text>
</svg>