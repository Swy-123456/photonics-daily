<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>
  <rect width="640" height="360" fill="#f8f9fa"/>
  <!-- 子图 (a) -->
  <g transform="translate(20,20)">
    <text x="0" y="15" font-size="14" font-weight="bold">(a) 纵向踢：自由运动</text>
    <rect x="0" y="25" width="280" height="120" fill="#e9ecef" stroke="#adb5bd"/>
    <!-- 周期势场竖条纹 -->
    <line x1="40" y1="25" x2="40" y2="145" stroke="#6c757d" stroke-width="2"/>
    <line x1="80" y1="25" x2="80" y2="145" stroke="#6c757d" stroke-width="2"/>
    <line x1="120" y1="25" x2="120" y2="145" stroke="#6c757d" stroke-width="2"/>
    <line x1="160" y1="25" x2="160" y2="145" stroke="#6c757d" stroke-width="2"/>
    <line x1="200" y1="25" x2="200" y2="145" stroke="#6c757d" stroke-width="2"/>
    <line x1="240" y1="25" x2="240" y2="145" stroke="#6c757d" stroke-width="2"/>
    <!-- 孤子 -->
    <circle cx="100" cy="85" r="8" fill="#e63946"/>
    <!-- 运动箭头 -->
    <line x1="100" y1="85" x2="100" y2="40" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="110" y="50" font-size="12" fill="#333">v</text>
    <text x="0" y="165" font-size="12" fill="#555">势场方向：x</text>
  </g>
  <!-- 子图 (b) -->
  <g transform="translate(320,20)">
    <text x="0" y="15" font-size="14" font-weight="bold">(b) 横向强踢：孤子倍增</text>
    <rect x="0" y="25" width="280" height="120" fill="#e9ecef" stroke="#adb5bd"/>
    <line x1="40" y1="25" x2="40" y2="145" stroke="#6c757d" stroke-width="2"/>
    <line x1="80" y1="25" x2="80" y2="145" stroke="#6c757d" stroke-width="2"/>
    <line x1="120" y1="25" x2="120" y2="145" stroke="#6c757d" stroke-width="2"/>
    <line x1="160" y1="25" x2="160" y2="145" stroke="#6c757d" stroke-width="2"/>
    <line x1="200" y1="25" x2="200" y2="145" stroke="#6c757d" stroke-width="2"/>
    <line x1="240" y1="25" x2="240" y2="145" stroke="#6c757d" stroke-width="2"/>
    <!-- 两个孤子 -->
    <circle cx="90" cy="85" r="8" fill="#e63946"/>
    <circle cx="150" cy="85" r="8" fill="#e63946"/>
    <!-- 运动箭头 -->
    <line x1="90" y1="85" x2="60" y2="85" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="150" y1="85" x2="180" y2="85" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="0" y="165" font-size="12" fill="#555">势场方向：x</text>
  </g>
  <!-- 子图 (c) -->
  <g transform="translate(20,190)">
    <text x="0" y="15" font-size="14" font-weight="bold">(c) 斜向踢：叠加运动</text>
    <rect x="0" y="25" width="280" height="120" fill="#e9ecef" stroke="#adb5bd"/>
    <line x1="40" y1="25" x2="40" y2="145" stroke="#6c757d" stroke-width="2"/>
    <line x1="80" y1="25" x2="80" y2="145" stroke="#6c757d" stroke-width="2"/>
    <line x1="120" y1="25" x2="120" y2="145" stroke="#6c757d" stroke-width="2"/>
    <line x1="160" y1="25" x2="160" y2="145" stroke="#6c757d" stroke-width="2"/>
    <line x1="200" y1="25" x2="200" y2="145" stroke="#6c757d" stroke-width="2"/>
    <line x1="240" y1="25" x2="240" y2="145" stroke="#6c757d" stroke-width="2"/>
    <circle cx="100" cy="85" r="8" fill="#e63946"/>
    <line x1="100" y1="85" x2="140" y2="45" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="0" y="165" font-size="12" fill="#555">势场方向：x</text>
  </g>
  <!-- 子图 (d) -->
  <g transform="translate(320,190)">
    <text x="0" y="15" font-size="14" font-weight="bold">(d) 径向势场：反弹与分裂</text>
    <rect x="0" y="25" width="280" height="120" fill="#e9ecef" stroke="#adb5bd"/>
    <!-- 径向势场同心圆 -->
    <circle cx="140" cy="85" r="20" fill="none" stroke="#6c757d" stroke-width="2"/>
    <circle cx="140" cy="85" r="40" fill="none" stroke="#6c757d" stroke-width="2"/>
    <circle cx="140" cy="85" r="60" fill="none" stroke="#6c757d" stroke-width="2"/>
    <!-- 孤子轨迹 -->
    <circle cx="60" cy="85" r="8" fill="#e63946"/>
    <path d="M60,85 Q100,85 120,85" stroke="#333" stroke-width="2" fill="none" stroke-dasharray="4,2"/>
    <line x1="120" y1="85" x2="110" y2="65" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="0" y="165" font-size="12" fill="#555">中心势垒</text>
  </g>
  <!-- 图例 -->
  <g transform="translate(500,300)">
    <text x="0" y="0" font-size="12" font-weight="bold">图例</text>
    <circle cx="10" cy="15" r="5" fill="#e63946"/>
    <text x="20" y="19" font-size="11">孤子</text>
    <line x1="10" y1="30" x2="30" y2="30" stroke="#6c757d" stroke-width="2"/>
    <text x="35" y="34" font-size="11">势场</text>
    <line x1="10" y1="45" x2="30" y2="45" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="35" y="49" font-size="11">运动方向</text>
  </g>
</svg>