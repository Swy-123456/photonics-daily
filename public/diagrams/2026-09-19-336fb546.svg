<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="sans-serif">
  <rect width="640" height="360" fill="#f8f9fa"/>
  <text x="320" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a2e">1.6T 光模块测试链路</text>
  <!-- Blocks -->
  <rect x="30" y="70" width="100" height="60" rx="8" fill="#4a90d9" stroke="#2c5f8a" stroke-width="2"/>
  <text x="80" y="95" text-anchor="middle" font-size="12" fill="#fff">码型发生器</text>
  <text x="80" y="115" text-anchor="middle" font-size="10" fill="#dce6f0">PRBS</text>

  <rect x="170" y="70" width="100" height="60" rx="8" fill="#e67e22" stroke="#b35c0e" stroke-width="2"/>
  <text x="220" y="95" text-anchor="middle" font-size="12" fill="#fff">PAM4 发射机</text>
  <text x="220" y="115" text-anchor="middle" font-size="10" fill="#fdebd0">200G/lane</text>

  <rect x="310" y="70" width="100" height="60" rx="8" fill="#27ae60" stroke="#1a7a42" stroke-width="2"/>
  <text x="360" y="95" text-anchor="middle" font-size="12" fill="#fff">光通道</text>
  <text x="360" y="115" text-anchor="middle" font-size="10" fill="#d5f5e3">光纤/损伤</text>

  <rect x="450" y="70" width="100" height="60" rx="8" fill="#8e44ad" stroke="#5e2d7a" stroke-width="2"/>
  <text x="500" y="95" text-anchor="middle" font-size="12" fill="#fff">接收机</text>
  <text x="500" y="115" text-anchor="middle" font-size="10" fill="#e8daef">均衡/FEC</text>

  <rect x="450" y="200" width="100" height="60" rx="8" fill="#c0392b" stroke="#7d2318" stroke-width="2"/>
  <text x="500" y="225" text-anchor="middle" font-size="12" fill="#fff">误码分析仪</text>
  <text x="500" y="245" text-anchor="middle" font-size="10" fill="#fadbd8">BER/TDECQ</text>

  <!-- Arrows -->
  <defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#555"/></marker></defs>
  <line x1="130" y1="100" x2="165" y2="100" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="270" y1="100" x2="305" y2="100" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="410" y1="100" x2="445" y2="100" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="500" y1="130" x2="500" y2="195" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Measurement annotations -->
  <line x1="220" y1="130" x2="220" y2="160" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="220" y="175" text-anchor="middle" font-size="10" fill="#e74c3c">TDECQ 测量点</text>

  <line x1="500" y1="130" x2="500" y2="160" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="500" y="175" text-anchor="middle" font-size="10" fill="#e74c3c">pre/post-FEC BER</text>

  <!-- Legend -->
  <rect x="30" y="280" width="580" height="60" rx="6" fill="#fff" stroke="#ccc" stroke-width="1"/>
  <text x="50" y="302" font-size="11" font-weight="bold" fill="#333">图例：</text>
  <rect x="100" y="292" width="16" height="12" fill="#4a90d9"/><text x="122" y="302" font-size="10" fill="#555">信号源</text>
  <rect x="180" y="292" width="16" height="12" fill="#e67e22"/><text x="202" y="302" font-size="10" fill="#555">发射端</text>
  <rect x="260" y="292" width="16" height="12" fill="#27ae60"/><text x="282" y="302" font-size="10" fill="#555">传输通道</text>
  <rect x="350" y="292" width="16" height="12" fill="#8e44ad"/><text x="372" y="302" font-size="10" fill="#555">接收端</text>
  <rect x="440" y="292" width="16" height="12" fill="#c0392b"/><text x="462" y="302" font-size="10" fill="#555">分析仪</text>
  <line x1="530" y1="298" x2="560" y2="298" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="4,3"/><text x="565" y="302" font-size="10" fill="#555">测量点</text>
</svg>