<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#e74c3c"/>
    </marker>
  </defs>
  <rect width="640" height="360" fill="#f8f9fa"/>
  <text x="320" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c3e50">硅基拓扑光子芯片示意图</text>
  <!-- 微环阵列 -->
  <g stroke="#3498db" stroke-width="2" fill="none">
    <circle cx="100" cy="120" r="25"/>
    <circle cx="180" cy="120" r="25"/>
    <circle cx="260" cy="120" r="25"/>
    <circle cx="100" cy="220" r="25"/>
    <circle cx="180" cy="220" r="25"/>
    <circle cx="260" cy="220" r="25"/>
  </g>
  <!-- 耦合波导 -->
  <g stroke="#95a5a6" stroke-width="1.5">
    <line x1="125" y1="120" x2="155" y2="120"/>
    <line x1="205" y1="120" x2="235" y2="120"/>
    <line x1="125" y1="220" x2="155" y2="220"/>
    <line x1="205" y1="220" x2="235" y2="220"/>
    <line x1="100" y1="145" x2="100" y2="195"/>
    <line x1="180" y1="145" x2="180" y2="195"/>
    <line x1="260" y1="145" x2="260" y2="195"/>
  </g>
  <!-- 拓扑边界态 -->
  <path d="M60,170 L300,170" stroke="#e74c3c" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="180" y="160" text-anchor="middle" font-size="12" fill="#e74c3c">拓扑边界态（单向）</text>
  <!-- 缺陷 -->
  <rect x="170" y="165" width="20" height="10" fill="#7f8c8d"/>
  <text x="180" y="190" text-anchor="middle" font-size="10" fill="#7f8c8d">缺陷</text>
  <!-- 图例 -->
  <g transform="translate(420,80)">
    <rect x="0" y="0" width="180" height="160" fill="#ffffff" stroke="#bdc3c7" rx="5"/>
    <text x="90" y="25" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3e50">图例</text>
    <circle cx="20" cy="50" r="8" stroke="#3498db" stroke-width="2" fill="none"/>
    <text x="40" y="54" font-size="11" fill="#2c3e50">微环谐振器</text>
    <line x1="12" y1="80" x2="28" y2="80" stroke="#95a5a6" stroke-width="2"/>
    <text x="40" y="84" font-size="11" fill="#2c3e50">耦合波导</text>
    <line x1="12" y1="110" x2="28" y2="110" stroke="#e74c3c" stroke-width="3"/>
    <text x="40" y="114" font-size="11" fill="#2c3e50">拓扑边界态</text>
    <rect x="12" y="130" width="16" height="10" fill="#7f8c8d"/>
    <text x="40" y="140" font-size="11" fill="#2c3e50">缺陷</text>
  </g>
  <!-- 说明文字 -->
  <text x="320" y="320" text-anchor="middle" font-size="11" fill="#7f8c8d">光沿边界单向传输，遇到缺陷自动绕行，无背散射</text>
</svg>