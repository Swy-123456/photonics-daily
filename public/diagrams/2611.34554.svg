<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#333"/>
    </marker>
    <linearGradient id="beam1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4A90D9" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#4A90D9" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="beam2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D94A4A" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#D94A4A" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="640" height="360" fill="#FAFAFA" stroke="#CCC"/>
  <!-- 单光子源 -->
  <circle cx="60" cy="180" r="20" fill="#FFD700" stroke="#333" stroke-width="2"/>
  <text x="60" y="185" text-anchor="middle" font-size="12" fill="#333">源</text>
  <text x="60" y="220" text-anchor="middle" font-size="11" fill="#666">态相位随机</text>
  <!-- 双缝 -->
  <rect x="200" y="120" width="10" height="40" fill="#555"/>
  <rect x="200" y="200" width="10" height="40" fill="#555"/>
  <text x="205" y="110" text-anchor="middle" font-size="12" fill="#333">双缝</text>
  <!-- 模式1路径（上） -->
  <path d="M80,180 Q140,140 200,140 L500,140" stroke="#4A90D9" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <!-- 模式2路径（下） -->
  <path d="M80,180 Q140,220 200,220 L500,220" stroke="#D94A4A" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <!-- 屏幕 -->
  <rect x="500" y="80" width="20" height="200" fill="#333" rx="3"/>
  <text x="510" y="70" text-anchor="middle" font-size="12" fill="#333">屏幕</text>
  <!-- 干涉条纹 -->
  <g transform="translate(530,80)">
    <rect x="0" y="0" width="80" height="200" fill="#222" rx="2"/>
    <rect x="10" y="10" width="60" height="8" fill="#FFD700" opacity="0.8"/>
    <rect x="10" y="40" width="60" height="8" fill="#FFD700" opacity="0.8"/>
    <rect x="10" y="70" width="60" height="8" fill="#FFD700" opacity="0.8"/>
    <rect x="10" y="100" width="60" height="8" fill="#FFD700" opacity="0.8"/>
    <rect x="10" y="130" width="60" height="8" fill="#FFD700" opacity="0.8"/>
    <rect x="10" y="160" width="60" height="8" fill="#FFD700" opacity="0.8"/>
    <rect x="10" y="190" width="60" height="8" fill="#FFD700" opacity="0.8"/>
  </g>
  <text x="570" y="300" text-anchor="middle" font-size="11" fill="#666">明暗条纹</text>
  <!-- 标注 -->
  <text x="350" y="130" text-anchor="middle" font-size="11" fill="#4A90D9">模式1（相位φ₁）</text>
  <text x="350" y="240" text-anchor="middle" font-size="11" fill="#D94A4A">模式2（相位φ₂）</text>
  <text x="350" y="180" text-anchor="middle" font-size="11" fill="#666">相位差Δφ=φ₁-φ₂</text>
  <!-- 图例 -->
  <g transform="translate(20,300)">
    <rect x="0" y="0" width="12" height="12" fill="#4A90D9"/>
    <text x="18" y="10" font-size="11" fill="#333">模式1</text>
    <rect x="80" y="0" width="12" height="12" fill="#D94A4A"/>
    <text x="98" y="10" font-size="11" fill="#333">模式2</text>
    <rect x="160" y="0" width="12" height="12" fill="#FFD700"/>
    <text x="178" y="10" font-size="11" fill="#333">条纹亮纹</text>
  </g>
</svg>