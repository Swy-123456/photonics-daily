<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>
  <!-- 背景 -->
  <rect width="640" height="360" fill="#f9f9f9" stroke="#ccc" stroke-width="1"/>
  <!-- 入射波 -->
  <line x1="20" y1="160" x2="80" y2="160" stroke="#d32f2f" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="20" y="150" font-size="12" fill="#d32f2f">入射太赫兹波</text>
  <!-- 第一腔镜 -->
  <rect x="80" y="100" width="20" height="120" fill="#90caf9" stroke="#1565c0" stroke-width="2"/>
  <text x="70" y="90" font-size="12" fill="#1565c0">腔镜1</text>
  <!-- 腔内波片 -->
  <rect x="200" y="120" width="40" height="80" fill="#fff9c4" stroke="#f9a825" stroke-width="2" rx="5"/>
  <text x="205" y="110" font-size="12" fill="#f9a825">波片 θ</text>
  <!-- 旋转箭头 -->
  <path d="M240,130 Q260,160 240,190" fill="none" stroke="#f9a825" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="255" y="165" font-size="10" fill="#f9a825">旋转</text>
  <!-- 第二腔镜 -->
  <rect x="400" y="100" width="20" height="120" fill="#90caf9" stroke="#1565c0" stroke-width="2"/>
  <text x="390" y="90" font-size="12" fill="#1565c0">腔镜2</text>
  <!-- 透射波 -->
  <line x1="420" y1="160" x2="480" y2="160" stroke="#388e3c" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="430" y="150" font-size="12" fill="#388e3c">透射输出</text>
  <!-- 谐振腔示意 -->
  <text x="200" y="250" font-size="12" fill="#555">FP腔：几何相位调谐</text>
  <!-- 透射谱小图 -->
  <rect x="500" y="80" width="120" height="100" fill="#fff" stroke="#999" stroke-width="1"/>
  <text x="510" y="75" font-size="11" fill="#333">透射谱</text>
  <!-- 坐标轴 -->
  <line x1="510" y1="170" x2="610" y2="170" stroke="#333" stroke-width="1"/>
  <line x1="510" y1="170" x2="510" y2="90" stroke="#333" stroke-width="1"/>
  <text x="580" y="185" font-size="9" fill="#333">频率</text>
  <text x="480" y="100" font-size="9" fill="#333" transform="rotate(-90,480,100)">透射率</text>
  <!-- 谐振峰1（实线） -->
  <path d="M520,170 Q540,100 560,170" fill="none" stroke="#d32f2f" stroke-width="2"/>
  <!-- 谐振峰2（虚线，偏移） -->
  <path d="M540,170 Q560,100 580,170" fill="none" stroke="#1976d2" stroke-width="2" stroke-dasharray="4"/>
  <!-- 图例 -->
  <line x1="520" y1="200" x2="540" y2="200" stroke="#d32f2f" stroke-width="2"/>
  <text x="545" y="204" font-size="10" fill="#333">θ=0</text>
  <line x1="520" y1="215" x2="540" y2="215" stroke="#1976d2" stroke-width="2" stroke-dasharray="4"/>
  <text x="545" y="219" font-size="10" fill="#333">θ=Δθ</text>
  <!-- 标注几何相位公式 -->
  <text x="150" y="300" font-size="14" fill="#333" font-style="italic">Φ<tspan baseline-shift="sub" font-size="10">PB</tspan> = 2θ</text>
  <text x="150" y="320" font-size="12" fill="#666">几何相位调谐</text>
</svg>