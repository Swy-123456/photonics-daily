<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="sans-serif"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#333"/></marker></defs><rect x="10" y="10" width="620" height="340" fill="#f9f9f9" stroke="#ccc"/><text x="320" y="35" text-anchor="middle" font-size="16" font-weight="bold">四态可重构折射率传感器</text><rect x="50" y="150" width="540" height="40" fill="#d0e6f7" stroke="#333"/><text x="320" y="175" text-anchor="middle" font-size="14">硅波导</text><rect x="150" y="140" width="100" height="10" fill="#4a90d9" stroke="#333"/><text x="200" y="135" text-anchor="middle" font-size="12">VO₂</text><rect x="350" y="140" width="100" height="10" fill="#999" stroke="#333"/><text x="400" y="135" text-anchor="middle" font-size="12">Pd</text><line x1="200" y1="110" x2="200" y2="140" stroke="#d9534f" stroke-width="2" marker-end="url(#arrow)"/><text x="200" y="105" text-anchor="middle" font-size="12" fill="#d9534f">温度</text><line x1="400" y1="110" x2="400" y2="140" stroke="#5cb85c" stroke-width="2" marker-end="url(#arrow)"/><text x="400" y="105" text-anchor="middle" font-size="12" fill="#5cb85c">氢气</text><text x="50" y="230" font-size="12">态(i): α-Pd / 低T VO₂</text><text x="50" y="250" font-size="12">态(ii): β-PdHₓ / 低T VO₂</text><text x="50" y="270" font-size="12">态(iii): α-Pd / 高T VO₂</text><text x="50" y="290" font-size="12">态(iv): β-PdHₓ / 高T VO₂</text><rect x="400" y="220" width="150" height="80" fill="#fff" stroke="#333"/><text x="475" y="240" text-anchor="middle" font-size="12">输出光谱</text><line x1="410" y1="280" x2="540" y2="280" stroke="#333"/><line x1="410" y1="280" x2="410" y2="250" stroke="#333"/><path d="M410,280 Q450,250 475,280 T540,280" fill="none" stroke="#d9534f" stroke-width="2"/><path d="M410,280 Q470,270 500,280 T540,280" fill="none" stroke="#5cb85c" stroke-width="2"/><text x="430" y="300" font-size="10" fill="#d9534f">态A</text><text x="500" y="300" font-size="10" fill="#5cb85c">态B</text><text x="320" y="340" text-anchor="middle" font-size="10">图例：红色箭头=温度刺激，绿色箭头=氢气刺激</text></svg>