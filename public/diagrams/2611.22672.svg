<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="sans-serif">
  <rect width="640" height="360" fill="#f8f9fa"/>
  <text x="320" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c3e50">里德堡非局域非线性增强光自旋霍尔效应</text>
  <!-- 入射光 -->
  <line x1="40" y1="120" x2="160" y2="120" stroke="#e74c3c" stroke-width="3" marker-end="url(#arrowRed)"/>
  <line x1="40" y1="140" x2="160" y2="140" stroke="#3498db" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text x="100" y="110" text-anchor="middle" font-size="12" fill="#e74c3c">x偏振</text>
  <text x="100" y="160" text-anchor="middle" font-size="12" fill="#3498db">y偏振</text>
  <!-- 原子云 -->
  <ellipse cx="320" cy="130" rx="100" ry="60" fill="#ecf0f1" stroke="#7f8c8d" stroke-width="2"/>
  <text x="320" y="135" text-anchor="middle" font-size="14" fill="#2c3e50">冷原子云</text>
  <!-- 里德堡原子与相互作用范围 -->
  <circle cx="290" cy="110" r="8" fill="#e67e22" stroke="#d35400" stroke-width="2"/>
  <circle cx="350" cy="150" r="8" fill="#e67e22" stroke="#d35400" stroke-width="2"/>
  <circle cx="290" cy="110" r="35" fill="none" stroke="#e67e22" stroke-width="1.5" stroke-dasharray="5,3"/>
  <circle cx="350" cy="150" r="35" fill="none" stroke="#e67e22" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="290" y="85" text-anchor="middle" font-size="10" fill="#e67e22">里德堡原子</text>
  <text x="350" y="195" text-anchor="middle" font-size="10" fill="#e67e22">非局域范围</text>
  <!-- 出射光 -->
  <line x1="480" y1="120" x2="600" y2="120" stroke="#e74c3c" stroke-width="3" marker-end="url(#arrowRed)"/>
  <line x1="480" y1="140" x2="600" y2="170" stroke="#3498db" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text x="540" y="110" text-anchor="middle" font-size="12" fill="#e74c3c">x偏振</text>
  <text x="560" y="190" text-anchor="middle" font-size="12" fill="#3498db">y偏振（位移）</text>
  <!-- 位移标注 -->
  <line x1="600" y1="120" x2="600" y2="170" stroke="#2c3e50" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="615" y="150" text-anchor="middle" font-size="12" fill="#2c3e50">Δy</text>
  <!-- 下方曲线图 -->
  <rect x="80" y="230" width="480" height="100" fill="#ffffff" stroke="#bdc3c7" stroke-width="1"/>
  <text x="320" y="250" text-anchor="middle" font-size="12" fill="#2c3e50">空间位移随主量子数n的变化</text>
  <line x1="100" y1="300" x2="540" y2="300" stroke="#7f8c8d" stroke-width="1" marker-end="url(#arrowGray)"/>
  <line x1="100" y1="280" x2="100" y2="320" stroke="#7f8c8d" stroke-width="1" marker-end="url(#arrowGray)"/>
  <text x="540" y="315" text-anchor="end" font-size="10" fill="#7f8c8d">n</text>
  <text x="90" y="275" text-anchor="end" font-size="10" fill="#7f8c8d">Δy</text>
  <!-- 曲线 -->
  <path d="M120,290 Q200,260 280,300 Q320,320 360,300 Q440,260 520,290" fill="none" stroke="#2980b9" stroke-width="2"/>
  <circle cx="280" cy="300" r="4" fill="#e74c3c"/>
  <text x="280" y="325" text-anchor="middle" font-size="10" fill="#e74c3c">n≈40</text>
  <circle cx="360" cy="300" r="4" fill="#e74c3c"/>
  <text x="360" y="325" text-anchor="middle" font-size="10" fill="#e74c3c">n≈60</text>
  <!-- 图例 -->
  <rect x="80" y="340" width="12" height="12" fill="#e74c3c"/>
  <text x="98" y="350" font-size="10" fill="#2c3e50">x偏振</text>
  <rect x="150" y="340" width="12" height="12" fill="#3498db"/>
  <text x="168" y="350" font-size="10" fill="#2c3e50">y偏振</text>
  <circle cx="220" cy="346" r="6" fill="#e67e22"/>
  <text x="232" y="350" font-size="10" fill="#2c3e50">里德堡原子</text>
  <circle cx="310" cy="346" r="6" fill="none" stroke="#e67e22" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="322" y="350" font-size="10" fill="#2c3e50">非局域范围</text>
  <!-- 箭头定义 -->
  <defs>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#e74c3c"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#3498db"/>
    </marker>
    <marker id="arrowGray" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#7f8c8d"/>
    </marker>
  </defs>
</svg>