<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" font-family="system-ui, sans-serif">
  <title>硅光马赫-曾德尔调制器（MZM）工作原理俯视图</title>
  <rect width="640" height="320" fill="#f8fafc" rx="10"/>

  <!-- 输入 / 输出波导 -->
  <line x1="24" y1="160" x2="200" y2="160" stroke="#2563eb" stroke-width="8" stroke-linecap="round"/>
  <line x1="560" y1="160" x2="616" y2="160" stroke="#2563eb" stroke-width="8" stroke-linecap="round"/>

  <!-- Y 分支（分束） -->
  <path d="M200 160 C 240 160 262 122 320 96" stroke="#2563eb" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M200 160 C 240 160 262 198 320 224" stroke="#2563eb" stroke-width="8" fill="none" stroke-linecap="round"/>

  <!-- 上下两臂 -->
  <line x1="320" y1="96" x2="480" y2="96" stroke="#2563eb" stroke-width="8" stroke-linecap="round"/>
  <line x1="320" y1="224" x2="480" y2="224" stroke="#2563eb" stroke-width="8" stroke-linecap="round"/>

  <!-- Y 分支（合束） -->
  <path d="M480 96 C 502 118 538 160 560 160" stroke="#2563eb" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M480 224 C 502 202 538 160 560 160" stroke="#2563eb" stroke-width="8" fill="none" stroke-linecap="round"/>

  <!-- 行波电极 -->
  <rect x="330" y="80" width="130" height="32" fill="#f59e0b" rx="5"/>
  <rect x="330" y="208" width="130" height="32" fill="#f59e0b" rx="5"/>

  <!-- 射频驱动 -->
  <line x1="395" y1="80" x2="395" y2="44" stroke="#b45309" stroke-width="2"/>
  <text x="395" y="32" text-anchor="middle" font-size="14" fill="#92400e">RF 射频信号（反相驱动两臂）</text>

  <!-- 标注 -->
  <text x="118" y="190" text-anchor="middle" font-size="14" fill="#334155">输入光</text>
  <text x="588" y="190" text-anchor="middle" font-size="14" fill="#334155">输出光</text>
  <text x="400" y="138" text-anchor="middle" font-size="13" fill="#334155">相位臂 1</text>
  <text x="400" y="284" text-anchor="middle" font-size="13" fill="#334155">相位臂 2</text>

  <!-- 图例 -->
  <g font-size="12" fill="#334155">
    <rect x="24" y="20" width="18" height="8" fill="#2563eb" rx="2"/>
    <text x="48" y="28">硅波导</text>
    <rect x="120" y="20" width="18" height="8" fill="#f59e0b" rx="2"/>
    <text x="144" y="28">金属电极</text>
  </g>
</svg>
