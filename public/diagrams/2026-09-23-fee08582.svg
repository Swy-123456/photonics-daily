<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="sans-serif">
  <rect width="640" height="360" fill="#f7f9fc"/>
  <text x="320" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a2b4a">可编程硅光 AI 互连示意</text>
  <!-- GPU nodes -->
  <g>
    <rect x="20" y="60" width="90" height="40" rx="6" fill="#4f8cff"/>
    <text x="65" y="84" text-anchor="middle" font-size="12" fill="#fff">GPU 0</text>
    <rect x="20" y="120" width="90" height="40" rx="6" fill="#4f8cff"/>
    <text x="65" y="144" text-anchor="middle" font-size="12" fill="#fff">GPU 1</text>
    <rect x="20" y="180" width="90" height="40" rx="6" fill="#4f8cff"/>
    <text x="65" y="204" text-anchor="middle" font-size="12" fill="#fff">GPU 2</text>
    <rect x="20" y="240" width="90" height="40" rx="6" fill="#4f8cff"/>
    <text x="65" y="264" text-anchor="middle" font-size="12" fill="#fff">GPU 3</text>
  </g>
  <!-- E-O interface -->
  <rect x="130" y="80" width="60" height="200" rx="8" fill="#9ad0ff" stroke="#4f8cff"/>
  <text x="160" y="175" text-anchor="middle" font-size="11" fill="#1a2b4a" transform="rotate(-90 160 175)">电光接口</text>
  <!-- MZI mesh -->
  <rect x="210" y="70" width="180" height="220" rx="10" fill="#e8f0ff" stroke="#4f8cff" stroke-width="2"/>
  <text x="300" y="92" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a2b4a">MZI 光开关网格</text>
  <g stroke="#4f8cff" stroke-width="1.5">
    <line x1="230" y1="110" x2="370" y2="110"/>
    <line x1="230" y1="150" x2="370" y2="150"/>
    <line x1="230" y1="190" x2="370" y2="190"/>
    <line x1="230" y1="230" x2="370" y2="230"/>
    <line x1="230" y1="270" x2="370" y2="270"/>
  </g>
  <g fill="#ff9f43">
    <circle cx="260" cy="110" r="5"/><circle cx="300" cy="110" r="5"/><circle cx="340" cy="110" r="5"/>
    <circle cx="260" cy="150" r="5"/><circle cx="300" cy="150" r="5"/><circle cx="340" cy="150" r="5"/>
    <circle cx="260" cy="190" r="5"/><circle cx="300" cy="190" r="5"/><circle cx="340" cy="190" r="5"/>
    <circle cx="260" cy="230" r="5"/><circle cx="300" cy="230" r="5"/><circle cx="340" cy="230" r="5"/>
    <circle cx="260" cy="270" r="5"/><circle cx="300" cy="270" r="5"/><circle cx="340" cy="270" r="5"/>
  </g>
  <text x="300" y="310" text-anchor="middle" font-size="10" fill="#ff9f43">● 可调相位 φ</text>
  <!-- Micro-ring -->
  <rect x="420" y="80" width="90" height="200" rx="10" fill="#e8fff0" stroke="#2ecc71" stroke-width="2"/>
  <text x="465" y="102" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a2b4a">微环阵列</text>
  <g fill="none" stroke="#2ecc71" stroke-width="1.5">
    <circle cx="465" cy="140" r="14"/><circle cx="465" cy="180" r="14"/><circle cx="465" cy="220" r="14"/>
  </g>
  <text x="465" y="270" text-anchor="middle" font-size="10" fill="#2ecc71">λ 上下路</text>
  <!-- Output -->
  <rect x="540" y="120" width="80" height="120" rx="8" fill="#ffe8e8" stroke="#ff6b6b"/>
  <text x="580" y="175" text-anchor="middle" font-size="12" fill="#1a2b4a">光交换/</text>
  <text x="580" y="192" text-anchor="middle" font-size="12" fill="#1a2b4a">存储</text>
  <!-- Arrows -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#4f8cff"/>
    </marker>
  </defs>
  <line x1="110" y1="160" x2="130" y2="160" stroke="#4f8cff" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="190" y1="160" x2="210" y2="160" stroke="#4f8cff" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="390" y1="160" x2="420" y2="160" stroke="#4f8cff" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="510" y1="160" x2="540" y2="160" stroke="#4f8cff" stroke-width="2" marker-end="url(#arr)"/>
  <!-- Control plane -->
  <rect x="180" y="320" width="280" height="30" rx="6" fill="#fff3cd" stroke="#f0ad4e"/>
  <text x="320" y="340" text-anchor="middle" font-size="11" fill="#1a2b4a">控制平面：读取 AI 负载 → 配置相位</text>
  <line x1="320" y1="320" x2="320" y2="290" stroke="#f0ad4e" stroke-width="1.5" stroke-dasharray="4,3"/>
</svg>