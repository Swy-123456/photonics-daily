<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" font-family="system-ui, sans-serif">
  <title>硅基微环自发四波混频量子光源与能量守恒</title>
  <rect width="640" height="380" fill="#f8fafc" rx="10"/>

  <!-- 输入波导 -->
  <line x1="24" y1="150" x2="190" y2="150" stroke="#2563eb" stroke-width="8" stroke-linecap="round"/>
  <!-- 微环谐振器 -->
  <circle cx="270" cy="150" r="60" fill="none" stroke="#2563eb" stroke-width="8"/>

  <!-- 输出波导 -->
  <line x1="350" y1="150" x2="430" y2="150" stroke="#2563eb" stroke-width="8" stroke-linecap="round"/>

  <!-- 泵浦光输入 -->
  <line x1="24" y1="150" x2="80" y2="150" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
  <path d="M68 141 L82 150 L68 159 Z" fill="#10b981"/>
  <text x="40" y="128" text-anchor="middle" font-size="13" fill="#047857">泵浦光 ωp</text>

  <!-- 信号 / 闲频输出 -->
  <line x1="430" y1="150" x2="470" y2="150" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
  <path d="M462 141 L474 150 L462 159 Z" fill="#ef4444"/>
  <line x1="430" y1="158" x2="470" y2="158" stroke="#f97316" stroke-width="4" stroke-linecap="round"/>
  <path d="M462 149 L474 158 L462 167 Z" fill="#f97316"/>

  <text x="530" y="146" text-anchor="middle" font-size="13" fill="#dc2626">信号光子 ωs</text>
  <text x="530" y="170" text-anchor="middle" font-size="13" fill="#ea580c">闲频光子 ωi</text>

  <text x="270" y="150" text-anchor="middle" font-size="12" fill="#1e3a8a">硅微环</text>
  <text x="270" y="238" text-anchor="middle" font-size="12" fill="#334155">自发四波混频（SFWM）</text>

  <!-- 能量守恒小图 -->
  <g transform="translate(0, 260)">
    <rect x="180" y="0" width="280" height="100" fill="#ffffff" stroke="#cbd5e1" rx="6"/>
    <text x="320" y="-10" text-anchor="middle" font-size="12" fill="#64748b">能量守恒：2ωp = ωs + ωi</text>

    <!-- 两个泵浦光子 -->
    <line x1="220" y1="80" x2="220" y2="40" stroke="#10b981" stroke-width="4"/>
    <path d="M214 46 L220 32 L226 46 Z" fill="#10b981"/>
    <line x1="260" y1="80" x2="260" y2="40" stroke="#10b981" stroke-width="4"/>
    <path d="M254 46 L260 32 L266 46 Z" fill="#10b981"/>
    <text x="240" y="88" text-anchor="middle" font-size="11" fill="#047857">2 × 泵浦光子</text>

    <!-- 信号 + 闲频 -->
    <line x1="380" y1="80" x2="380" y2="52" stroke="#ef4444" stroke-width="4"/>
    <path d="M374 58 L380 44 L386 58 Z" fill="#ef4444"/>
    <line x1="420" y1="80" x2="420" y2="52" stroke="#f97316" stroke-width="4"/>
    <path d="M414 58 L420 44 L426 58 Z" fill="#f97316"/>
    <text x="400" y="88" text-anchor="middle" font-size="11" fill="#334155">信号 + 闲频光子</text>
  </g>
</svg>
