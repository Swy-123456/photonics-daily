<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 360' font-family='sans-serif'>
  <rect width='640' height='360' fill='#f8fafc'/>
  <text x='320' y='28' text-anchor='middle' font-size='16' font-weight='bold' fill='#0f172a'>硅基磁光隔离器集成结构示意</text>
  <rect x='30' y='120' width='70' height='60' rx='6' fill='#dbeafe' stroke='#2563eb'/>
  <text x='65' y='145' text-anchor='middle' font-size='12' fill='#1e3a8a'>激光器</text>
  <text x='65' y='162' text-anchor='middle' font-size='10' fill='#1e3a8a'>DFB</text>
  <rect x='120' y='120' width='60' height='60' rx='6' fill='#e0e7ff' stroke='#4f46e5'/>
  <text x='150' y='145' text-anchor='middle' font-size='11' fill='#312e81'>输入</text>
  <text x='150' y='160' text-anchor='middle' font-size='11' fill='#312e81'>偏振器</text>
  <rect x='200' y='105' width='180' height='90' rx='8' fill='#f1f5f9' stroke='#64748b'/>
  <rect x='210' y='115' width='160' height='28' rx='4' fill='#fde68a' stroke='#d97706'/>
  <text x='290' y='133' text-anchor='middle' font-size='11' fill='#92400e'>Ce:YIG 磁光层</text>
  <rect x='210' y='150' width='160' height='28' rx='4' fill='#bae6fd' stroke='#0284c7'/>
  <text x='290' y='168' text-anchor='middle' font-size='11' fill='#075985'>硅波导</text>
  <rect x='200' y='80' width='180' height='18' rx='4' fill='#fecaca' stroke='#dc2626'/>
  <text x='290' y='93' text-anchor='middle' font-size='10' fill='#991b1b'>外加磁铁 B</text>
  <rect x='410' y='120' width='60' height='60' rx='6' fill='#e0e7ff' stroke='#4f46e5'/>
  <text x='440' y='145' text-anchor='middle' font-size='11' fill='#312e81'>输出</text>
  <text x='440' y='160' text-anchor='middle' font-size='11' fill='#312e81'>偏振器</text>
  <rect x='500' y='120' width='70' height='60' rx='6' fill='#dcfce7' stroke='#16a34a'/>
  <text x='535' y='145' text-anchor='middle' font-size='12' fill='#166534'>光纤</text>
  <text x='535' y='162' text-anchor='middle' font-size='10' fill='#166534'>输出</text>
  <line x1='100' y1='150' x2='120' y2='150' stroke='#16a34a' stroke-width='3' marker-end='url(#g)'/>
  <line x1='180' y1='150' x2='210' y2='150' stroke='#16a34a' stroke-width='3' marker-end='url(#g)'/>
  <line x1='370' y1='150' x2='410' y2='150' stroke='#16a34a' stroke-width='3' marker-end='url(#g)'/>
  <line x1='470' y1='150' x2='500' y2='150' stroke='#16a34a' stroke-width='3' marker-end='url(#g)'/>
  <line x1='500' y1='185' x2='440' y2='185' stroke='#dc2626' stroke-width='3' marker-end='url(#r)'/>
  <line x1='410' y1='185' x2='370' y2='185' stroke='#dc2626' stroke-width='3' marker-end='url(#r)'/>
  <line x1='210' y1='185' x2='180' y2='185' stroke='#dc2626' stroke-width='3' marker-end='url(#r)'/>
  <text x='320' y='215' text-anchor='middle' font-size='12' fill='#166534'>正向光：偏振旋转 45°，低损耗通过</text>
  <text x='320' y='235' text-anchor='middle' font-size='12' fill='#b91c1c'>反向光：再旋转 45°，被正交阻挡</text>
  <rect x='120' y='260' width='400' height='70' rx='8' fill='#ffffff' stroke='#cbd5e1'/>
  <text x='140' y='285' font-size='12' fill='#0f172a'>法拉第旋转角：θF = V ∫ B·dl</text>
  <text x='140' y='308' font-size='12' fill='#0f172a'>隔离度：Isolation(dB) = -10 log10(P_back,out / P_back,in)</text>
  <defs>
    <marker id='g' markerWidth='8' markerHeight='8' refX='6' refY='3' orient='auto'><path d='M0,0 L6,3 L0,6 z' fill='#16a34a'/></marker>
    <marker id='r' markerWidth='8' markerHeight='8' refX='6' refY='3' orient='auto'><path d='M0,0 L6,3 L0,6 z' fill='#dc2626'/></marker>
  </defs>
  <rect x='20' y='340' width='12' height='12' fill='#16a34a'/><text x='38' y='350' font-size='11' fill='#334155'>正向光</text>
  <rect x='100' y='340' width='12' height='12' fill='#dc2626'/><text x='118' y='350' font-size='11' fill='#334155'>反向反射光</text>
</svg>