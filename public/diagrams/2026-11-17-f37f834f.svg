<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="sans-serif">
  <rect x="0" y="0" width="640" height="360" fill="#f9f9f9" stroke="#ccc"/>
  <text x="320" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">BTO薄膜MZI电光调制器结构</text>
  <!-- Substrate -->
  <rect x="40" y="250" width="560" height="30" fill="#d0d0d0" stroke="#888"/>
  <text x="320" y="270" text-anchor="middle" font-size="12" fill="#333">硅衬底</text>
  <!-- Input waveguide -->
  <rect x="40" y="170" width="80" height="20" fill="#a0c4ff" stroke="#3a6ea5"/>
  <text x="80" y="165" text-anchor="middle" font-size="11" fill="#3a6ea5">输入光</text>
  <!-- Splitter -->
  <polygon points="120,170 140,150 140,190" fill="#a0c4ff" stroke="#3a6ea5"/>
  <text x="130" y="145" text-anchor="middle" font-size="10" fill="#3a6ea5">分束</text>
  <!-- Upper arm -->
  <rect x="140" y="140" width="200" height="20" fill="#a0c4ff" stroke="#3a6ea5"/>
  <!-- Lower arm -->
  <rect x="140" y="200" width="200" height="20" fill="#a0c4ff" stroke="#3a6ea5"/>
  <!-- BTO overlay on upper arm -->
  <rect x="160" y="130" width="160" height="10" fill="#ffb347" stroke="#b36b00"/>
  <text x="240" y="125" text-anchor="middle" font-size="10" fill="#b36b00">BTO薄膜</text>
  <!-- BTO overlay on lower arm -->
  <rect x="160" y="220" width="160" height="10" fill="#ffb347" stroke="#b36b00"/>
  <!-- Electrodes -->
  <rect x="150" y="110" width="180" height="8" fill="#ffd700" stroke="#b8860b"/>
  <text x="240" y="105" text-anchor="middle" font-size="10" fill="#b8860b">行波电极 (G)</text>
  <rect x="150" y="240" width="180" height="8" fill="#ffd700" stroke="#b8860b"/>
  <text x="240" y="260" text-anchor="middle" font-size="10" fill="#b8860b">行波电极 (S)</text>
  <!-- Combiner -->
  <polygon points="340,150 360,170 340,190" fill="#a0c4ff" stroke="#3a6ea5"/>
  <text x="350" y="145" text-anchor="middle" font-size="10" fill="#3a6ea5">合束</text>
  <!-- Output waveguide -->
  <rect x="360" y="170" width="80" height="20" fill="#a0c4ff" stroke="#3a6ea5"/>
  <text x="400" y="165" text-anchor="middle" font-size="11" fill="#3a6ea5">调制输出</text>
  <!-- RF source -->
  <rect x="480" y="120" width="60" height="40" fill="#fff" stroke="#333"/>
  <text x="510" y="145" text-anchor="middle" font-size="11" fill="#333">RF源</text>
  <line x1="480" y1="140" x2="330" y2="114" stroke="#333" stroke-dasharray="4"/>
  <line x1="480" y1="140" x2="330" y2="244" stroke="#333" stroke-dasharray="4"/>
  <!-- Legend -->
  <rect x="480" y="280" width="120" height="60" fill="#fff" stroke="#ccc"/>
  <text x="490" y="295" font-size="10" fill="#333">图例</text>
  <rect x="490" y="300" width="12" height="8" fill="#a0c4ff" stroke="#3a6ea5"/>
  <text x="508" y="308" font-size="9" fill="#333">硅波导</text>
  <rect x="490" y="315" width="12" height="8" fill="#ffb347" stroke="#b36b00"/>
  <text x="508" y="323" font-size="9" fill="#333">BTO</text>
  <rect x="490" y="330" width="12" height="8" fill="#ffd700" stroke="#b8860b"/>
  <text x="508" y="338" font-size="9" fill="#333">电极</text>
</svg>