<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>
  <!-- 激光器 -->
  <rect x="30" y="150" width="60" height="30" rx="5" fill="#4A90D9" stroke="#2C5F8A"/>
  <text x="60" y="170" text-anchor="middle" fill="white" font-size="12">激光器</text>
  <!-- 激光束 -->
  <line x1="90" y1="165" x2="250" y2="100" stroke="#E74C3C" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="160" y="120" fill="#E74C3C" font-size="11">激光</text>
  <!-- 悬臂梁 -->
  <rect x="250" y="80" width="100" height="12" rx="3" fill="#F5A623" stroke="#B87D1A"/>
  <text x="300" y="75" text-anchor="middle" fill="#B87D1A" font-size="12">悬臂梁</text>
  <!-- 探针 -->
  <polygon points="350,92 355,130 345,130" fill="#555"/>
  <text x="370" y="125" fill="#555" font-size="11">探针</text>
  <!-- 反射激光 -->
  <line x1="250" y1="80" x2="480" y2="50" stroke="#E74C3C" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="380" y="45" fill="#E74C3C" font-size="11">反射光</text>
  <!-- 光电探测器 -->
  <rect x="480" y="30" width="80" height="40" rx="5" fill="#7ED321" stroke="#4A8A1A"/>
  <text x="520" y="55" text-anchor="middle" fill="white" font-size="12">光电探测器</text>
  <!-- 基底 -->
  <rect x="200" y="250" width="300" height="20" rx="3" fill="#BDC3C7" stroke="#7F8C8D"/>
  <text x="350" y="265" text-anchor="middle" fill="#333" font-size="12">基底</text>
  <!-- 可逆固定层 -->
  <rect x="200" y="240" width="300" height="10" fill="#9B59B6" opacity="0.6"/>
  <text x="350" y="235" text-anchor="middle" fill="#9B59B6" font-size="11">可逆固定层</text>
  <!-- 细菌 -->
  <ellipse cx="350" cy="220" rx="40" ry="18" fill="#2ECC71" stroke="#1A8A4A"/>
  <text x="350" y="225" text-anchor="middle" fill="white" font-size="12">细菌</text>
  <!-- 可逆连接 -->
  <line x1="330" y1="238" x2="330" y2="240" stroke="#9B59B6" stroke-width="2"/>
  <line x1="350" y1="238" x2="350" y2="240" stroke="#9B59B6" stroke-width="2"/>
  <line x1="370" y1="238" x2="370" y2="240" stroke="#9B59B6" stroke-width="2"/>
  <!-- 释放箭头 -->
  <path d="M420,200 Q480,180 500,140" fill="none" stroke="#E67E22" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="510" y="135" fill="#E67E22" font-size="11">温和释放</text>
  <!-- 图例 -->
  <rect x="30" y="290" width="580" height="55" rx="5" fill="#F9F9F9" stroke="#CCC"/>
  <rect x="45" y="300" width="12" height="12" fill="#4A90D9"/><text x="62" y="311" font-size="11">激光器</text>
  <rect x="130" y="300" width="12" height="12" fill="#F5A623"/><text x="147" y="311" font-size="11">悬臂梁</text>
  <rect x="215" y="300" width="12" height="12" fill="#2ECC71"/><text x="232" y="311" font-size="11">细菌</text>
  <rect x="295" y="300" width="12" height="12" fill="#9B59B6" opacity="0.6"/><text x="312" y="311" font-size="11">可逆固定层</text>
  <rect x="400" y="300" width="12" height="12" fill="#7ED321"/><text x="417" y="311" font-size="11">光电探测器</text>
  <line x1="500" y1="306" x2="520" y2="306" stroke="#E74C3C" stroke-width="2"/><text x="527" y="311" font-size="11">激光路径</text>
  <line x1="45" y1="330" x2="65" y2="330" stroke="#E67E22" stroke-width="2" stroke-dasharray="5,3"/><text x="72" y="335" font-size="11">释放路径</text>
</svg>