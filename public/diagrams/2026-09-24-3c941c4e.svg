<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="sans-serif">
  <rect width="640" height="360" fill="#0d1117"/>
  <text x="320" y="28" text-anchor="middle" fill="#e6edf3" font-size="16" font-weight="bold">阿秒条纹术测量光电子角动量</text>
  <!-- XUV pulse -->
  <path d="M40 90 Q80 60 120 90 Q160 120 200 90" stroke="#a371f7" stroke-width="3" fill="none"/>
  <text x="60" y="70" fill="#a371f7" font-size="12">XUV 阿秒脉冲</text>
  <!-- NIR pulse -->
  <path d="M40 150 Q80 120 120 150 Q160 180 200 150" stroke="#f85149" stroke-width="3" fill="none"/>
  <text x="60" y="130" fill="#f85149" font-size="12">NIR 条纹场</text>
  <!-- Atom -->
  <circle cx="260" cy="120" r="14" fill="#58a6ff" opacity="0.8"/>
  <circle cx="260" cy="120" r="4" fill="#ffffff"/>
  <text x="240" y="155" fill="#58a6ff" font-size="12">原子</text>
  <!-- Electron -->
  <circle cx="340" cy="100" r="6" fill="#f2cc60"/>
  <circle cx="360" cy="120" r="6" fill="#f2cc60"/>
  <circle cx="380" cy="140" r="6" fill="#f2cc60"/>
  <text x="345" y="85" fill="#f2cc60" font-size="12">光电子</text>
  <!-- Arrow -->
  <path d="M300 120 L400 120" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#8b949e"/></marker></defs>
  <!-- Detector -->
  <rect x="440" y="60" width="160" height="140" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="520" y="80" text-anchor="middle" fill="#e6edf3" font-size="12">二维动量探测器</text>
  <circle cx="520" cy="130" r="40" fill="none" stroke="#30363d"/>
  <path d="M490 130 A30 30 0 0 1 550 130" stroke="#f2cc60" stroke-width="2" fill="none"/>
  <path d="M500 110 A30 30 0 0 1 540 150" stroke="#f2cc60" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M510 150 A30 30 0 0 1 530 110" stroke="#f2cc60" stroke-width="2" fill="none" opacity="0.4"/>
  <text x="520" y="185" text-anchor="middle" fill="#8b949e" font-size="10">角分布条纹</text>
  <!-- Delay curve -->
  <path d="M40 280 Q160 240 280 280 Q400 320 520 280" stroke="#3fb950" stroke-width="2.5" fill="none"/>
  <text x="40" y="270" fill="#3fb950" font-size="12">角动量期望值 ⟨Lz⟩(τ)</text>
  <line x1="40" y1="300" x2="600" y2="300" stroke="#30363d"/>
  <text x="600" y="315" text-anchor="end" fill="#8b949e" font-size="10">延迟 τ</text>
  <!-- Legend -->
  <circle cx="40" cy="335" r="4" fill="#a371f7"/><text x="50" y="339" fill="#8b949e" font-size="10">XUV</text>
  <circle cx="100" cy="335" r="4" fill="#f85149"/><text x="110" y="339" fill="#8b949e" font-size="10">NIR</text>
  <circle cx="160" cy="335" r="4" fill="#f2cc60"/><text x="170" y="339" fill="#8b949e" font-size="10">光电子</text>
  <circle cx="230" cy="335" r="4" fill="#3fb950"/><text x="240" y="339" fill="#8b949e" font-size="10">角动量信号</text>
</svg>