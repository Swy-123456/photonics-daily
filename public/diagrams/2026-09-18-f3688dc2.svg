<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="sans-serif">
  <rect x="0" y="0" width="640" height="360" fill="#f8fafc"/>
  <text x="320" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">硅光封装：光纤-芯片耦合与光电协同</text>
  <!-- 光纤阵列 -->
  <rect x="40" y="90" width="120" height="140" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="100" y="80" text-anchor="middle" font-size="12" fill="#1e40af">光纤阵列 FAU</text>
  <line x1="60" y1="120" x2="140" y2="120" stroke="#2563eb" stroke-width="3"/>
  <line x1="60" y1="160" x2="140" y2="160" stroke="#2563eb" stroke-width="3"/>
  <line x1="60" y1="200" x2="140" y2="200" stroke="#2563eb" stroke-width="3"/>
  <text x="100" y="250" text-anchor="middle" font-size="11" fill="#1e40af">单模光纤</text>
  <!-- 耦合区 -->
  <rect x="180" y="110" width="80" height="100" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="220" y="100" text-anchor="middle" font-size="12" fill="#075985">耦合结构</text>
  <text x="220" y="150" text-anchor="middle" font-size="11" fill="#075985">模斑转换/</text>
  <text x="220" y="168" text-anchor="middle" font-size="11" fill="#075985">光栅耦合</text>
  <!-- 硅光芯片 -->
  <rect x="290" y="70" width="220" height="180" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="400" y="60" text-anchor="middle" font-size="12" fill="#166534">硅光芯片 PIC</text>
  <rect x="320" y="100" width="70" height="40" rx="4" fill="#bbf7d0" stroke="#15803d"/>
  <text x="355" y="125" text-anchor="middle" font-size="10" fill="#14532d">调制器</text>
  <rect x="410" y="100" width="70" height="40" rx="4" fill="#bbf7d0" stroke="#15803d"/>
  <text x="445" y="125" text-anchor="middle" font-size="10" fill="#14532d">探测器</text>
  <rect x="320" y="170" width="160" height="30" rx="4" fill="#bbf7d0" stroke="#15803d"/>
  <text x="400" y="190" text-anchor="middle" font-size="10" fill="#14532d">硅波导</text>
  <!-- 电互连 -->
  <rect x="290" y="270" width="220" height="40" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="400" y="295" text-anchor="middle" font-size="11" fill="#9a3412">封装基板 / 焊球</text>
  <line x1="400" y1="250" x2="400" y2="270" stroke="#ea580c" stroke-width="3"/>
  <!-- 图例 -->
  <rect x="40" y="300" width="12" height="12" fill="#2563eb"/>
  <text x="58" y="310" font-size="11" fill="#334155">光路</text>
  <rect x="120" y="300" width="12" height="12" fill="#ea580c"/>
  <text x="138" y="310" font-size="11" fill="#334155">电路</text>
  <rect x="200" y="300" width="12" height="12" fill="#16a34a"/>
  <text x="218" y="310" font-size="11" fill="#334155">芯片/机械结构</text>
</svg>