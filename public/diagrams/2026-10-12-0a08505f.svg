<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#333"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="638" height="358" fill="#f9f9f9" stroke="#ccc" stroke-width="2"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">深蓝OLED激子利用与效率滚降抑制</text>
  <!-- 阴极 -->
  <rect x="50" y="60" width="120" height="30" fill="#b0c4de" stroke="#333" stroke-width="1.5"/>
  <text x="110" y="80" text-anchor="middle" font-size="14" fill="#222">阴极</text>
  <!-- 阳极 -->
  <rect x="470" y="60" width="120" height="30" fill="#f4a460" stroke="#333" stroke-width="1.5"/>
  <text x="530" y="80" text-anchor="middle" font-size="14" fill="#222">阳极</text>
  <!-- 发射层 -->
  <rect x="200" y="60" width="240" height="180" fill="#e6e6fa" stroke="#333" stroke-width="1.5" rx="5"/>
  <text x="320" y="90" text-anchor="middle" font-size="16" fill="#222">发射层</text>
  <!-- 电子和空穴 -->
  <circle cx="150" cy="120" r="8" fill="#1e90ff"/>
  <text x="150" y="145" text-anchor="middle" font-size="12" fill="#1e90ff">电子</text>
  <circle cx="490" cy="120" r="8" fill="#ff4500"/>
  <text x="490" y="145" text-anchor="middle" font-size="12" fill="#ff4500">空穴</text>
  <line x1="160" y1="120" x2="200" y2="120" stroke="#1e90ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="480" y1="120" x2="440" y2="120" stroke="#ff4500" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- 激子生成 -->
  <circle cx="320" cy="150" r="12" fill="#ffd700" stroke="#333" stroke-width="1"/>
  <text x="320" y="180" text-anchor="middle" font-size="14" fill="#222">激子</text>
  <!-- 单线态 -->
  <rect x="220" y="200" width="80" height="30" fill="#87ceeb" stroke="#333" stroke-width="1" rx="5"/>
  <text x="260" y="220" text-anchor="middle" font-size="13" fill="#222">单线态 S₁</text>
  <!-- 三线态 -->
  <rect x="340" y="200" width="80" height="30" fill="#dda0dd" stroke="#333" stroke-width="1" rx="5"/>
  <text x="380" y="220" text-anchor="middle" font-size="13" fill="#222">三线态 T₁</text>
  <!-- RISC箭头 -->
  <path d="M380,200 Q360,180 300,200" fill="none" stroke="#ff1493" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5,3"/>
  <text x="340" y="185" text-anchor="middle" font-size="12" fill="#ff1493">快速RISC</text>
  <!-- 辐射发光 -->
  <line x1="260" y1="200" x2="260" y2="260" stroke="#0000ff" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="260" y="280" text-anchor="middle" font-size="14" fill="#0000ff">深蓝光</text>
  <!-- TTA抑制 -->
  <circle cx="450" cy="240" r="15" fill="#dda0dd" stroke="#333" stroke-width="1"/>
  <circle cx="480" cy="240" r="15" fill="#dda0dd" stroke="#333" stroke-width="1"/>
  <line x1="465" y1="225" x2="465" y2="255" stroke="#ff0000" stroke-width="3"/>
  <line x1="455" y1="235" x2="475" y2="245" stroke="#ff0000" stroke-width="3"/>
  <text x="465" y="280" text-anchor="middle" font-size="12" fill="#ff0000">TTA抑制</text>
  <!-- 图例 -->
  <rect x="20" y="300" width="600" height="50" fill="#fff" stroke="#ccc" stroke-width="1"/>
  <circle cx="40" cy="325" r="6" fill="#1e90ff"/>
  <text x="55" y="330" font-size="12" fill="#222">电子</text>
  <circle cx="120" cy="325" r="6" fill="#ff4500"/>
  <text x="135" y="330" font-size="12" fill="#222">空穴</text>
  <circle cx="200" cy="325" r="6" fill="#ffd700"/>
  <text x="215" y="330" font-size="12" fill="#222">激子</text>
  <line x1="280" y1="325" x2="320" y2="325" stroke="#ff1493" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="330" y="330" font-size="12" fill="#222">RISC</text>
  <line x1="390" y1="325" x2="430" y2="325" stroke="#0000ff" stroke-width="3"/>
  <text x="440" y="330" font-size="12" fill="#222">辐射发光</text>
  <line x1="510" y1="325" x2="550" y2="325" stroke="#ff0000" stroke-width="3"/>
  <text x="560" y="330" font-size="12" fill="#222">抑制路径</text>
</svg>