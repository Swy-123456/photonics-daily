<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="sans-serif">
  <rect width="640" height="360" fill="#f8fafc"/>
  <text x="320" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">叠层衍射成像随机优化重建流程</text>
  <!-- Left: scanning -->
  <rect x="20" y="50" width="170" height="260" rx="10" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="105" y="72" text-anchor="middle" font-size="13" fill="#0c4a6e">重叠扫描采集</text>
  <circle cx="70" cy="120" r="18" fill="#7dd3fc" stroke="#0369a1"/>
  <circle cx="105" cy="120" r="18" fill="#7dd3fc" stroke="#0369a1" opacity="0.7"/>
  <circle cx="140" cy="120" r="18" fill="#7dd3fc" stroke="#0369a1" opacity="0.5"/>
  <text x="105" y="160" text-anchor="middle" font-size="11" fill="#0c4a6e">探针重叠扫描</text>
  <rect x="45" y="180" width="110" height="60" rx="6" fill="#bae6fd" stroke="#0284c7"/>
  <text x="100" y="205" text-anchor="middle" font-size="11" fill="#0c4a6e">远场衍射图样</text>
  <text x="100" y="222" text-anchor="middle" font-size="11" fill="#0c4a6e">× 200,000 帧</text>
  <!-- Arrow 1 -->
  <line x1="190" y1="180" x2="230" y2="180" stroke="#64748b" stroke-width="2" marker-end="url(#a1)"/>
  <defs><marker id="a1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#64748b"/></marker></defs>
  <!-- Middle: stochastic -->
  <rect x="235" y="50" width="170" height="260" rx="10" fill="#fef3c7" stroke="#d97706"/>
  <text x="320" y="72" text-anchor="middle" font-size="13" fill="#78350f">随机小批量采样</text>
  <rect x="255" y="90" width="130" height="40" rx="6" fill="#fde68a" stroke="#d97706"/>
  <text x="320" y="115" text-anchor="middle" font-size="11" fill="#78350f">随机抽取 mini-batch</text>
  <rect x="255" y="145" width="130" height="40" rx="6" fill="#fde68a" stroke="#d97706"/>
  <text x="320" y="170" text-anchor="middle" font-size="11" fill="#78350f">泊松似然损失</text>
  <rect x="255" y="200" width="130" height="40" rx="6" fill="#fde68a" stroke="#d97706"/>
  <text x="320" y="225" text-anchor="middle" font-size="11" fill="#78350f">无偏梯度估计</text>
  <text x="320" y="275" text-anchor="middle" font-size="11" fill="#78350f">自动微分反向传播</text>
  <!-- Arrow 2 -->
  <line x1="405" y1="180" x2="445" y2="180" stroke="#64748b" stroke-width="2" marker-end="url(#a1)"/>
  <!-- Right: update -->
  <rect x="450" y="50" width="170" height="260" rx="10" fill="#dcfce7" stroke="#16a34a"/>
  <text x="535" y="72" text-anchor="middle" font-size="13" fill="#14532d">衰减步长更新</text>
  <rect x="470" y="95" width="130" height="40" rx="6" fill="#bbf7d0" stroke="#16a34a"/>
  <text x="535" y="120" text-anchor="middle" font-size="11" fill="#14532d">样品复振幅 O</text>
  <rect x="470" y="150" width="130" height="40" rx="6" fill="#bbf7d0" stroke="#16a34a"/>
  <text x="535" y="175" text-anchor="middle" font-size="11" fill="#14532d">探针函数 P</text>
  <rect x="470" y="205" width="130" height="40" rx="6" fill="#bbf7d0" stroke="#16a34a"/>
  <text x="535" y="230" text-anchor="middle" font-size="11" fill="#14532d">部分相干模态</text>
  <text x="535" y="275" text-anchor="middle" font-size="11" fill="#14532d">迭代收敛输出</text>
  <!-- Bottom legend -->
  <rect x="60" y="325" width="14" height="14" fill="#7dd3fc" stroke="#0284c7"/>
  <text x="80" y="337" font-size="11" fill="#334155">采集</text>
  <rect x="140" y="325" width="14" height="14" fill="#fde68a" stroke="#d97706"/>
  <text x="160" y="337" font-size="11" fill="#334155">随机梯度</text>
  <rect x="240" y="325" width="14" height="14" fill="#bbf7d0" stroke="#16a34a"/>
  <text x="260" y="337" font-size="11" fill="#334155">参数更新</text>
  <text x="400" y="337" font-size="11" fill="#334155">收益：65% 显存 · 22% 时间</text>
</svg>