<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 360' font-family='sans-serif'>
  <defs>
    <linearGradient id='diamond' x1='0' y1='0' x2='1' y2='1'>
      <stop offset='0%' stop-color='#c8e6ff'/>
      <stop offset='100%' stop-color='#7fb8e6'/>
    </linearGradient>
    <marker id='arrow' markerWidth='8' markerHeight='8' refX='6' refY='3' orient='auto'>
      <path d='M0,0 L6,3 L0,6 Z' fill='#d32f2f'/>
    </marker>
  </defs>
  <rect x='0' y='0' width='640' height='360' fill='#f7f9fc'/>
  <text x='320' y='26' text-anchor='middle' font-size='16' font-weight='bold' fill='#1a237e'>金刚石纳米柱色心光子接口</text>
  <!-- substrate -->
  <rect x='40' y='230' width='360' height='50' fill='#b0bec5' stroke='#607d8b'/>
  <text x='220' y='260' text-anchor='middle' font-size='12' fill='#37474f'>金刚石薄膜 / 衬底</text>
  <!-- nanopillars -->
  <rect x='100' y='110' width='60' height='120' fill='url(#diamond)' stroke='#1565c0'/>
  <rect x='200' y='90' width='60' height='140' fill='url(#diamond)' stroke='#1565c0'/>
  <rect x='300' y='110' width='60' height='120' fill='url(#diamond)' stroke='#1565c0'/>
  <!-- tapered tops -->
  <polygon points='100,110 160,110 150,90 110,90' fill='#bbdefb' stroke='#1565c0'/>
  <polygon points='200,90 260,90 250,70 210,70' fill='#bbdefb' stroke='#1565c0'/>
  <polygon points='300,110 360,110 350,90 310,90' fill='#bbdefb' stroke='#1565c0'/>
  <!-- color centers -->
  <circle cx='130' cy='170' r='6' fill='#d32f2f'/>
  <circle cx='230' cy='150' r='6' fill='#d32f2f'/>
  <circle cx='330' cy='170' r='6' fill='#d32f2f'/>
  <!-- photon emission -->
  <line x1='130' y1='90' x2='130' y2='40' stroke='#d32f2f' stroke-width='2' marker-end='url(#arrow)'/>
  <line x1='230' y1='70' x2='230' y2='30' stroke='#d32f2f' stroke-width='2' marker-end='url(#arrow)'/>
  <line x1='330' y1='90' x2='330' y2='40' stroke='#d32f2f' stroke-width='2' marker-end='url(#arrow)'/>
  <text x='130' y='35' text-anchor='middle' font-size='10' fill='#d32f2f'>单光子</text>
  <text x='230' y='25' text-anchor='middle' font-size='10' fill='#d32f2f'>单光子</text>
  <text x='330' y='35' text-anchor='middle' font-size='10' fill='#d32f2f'>单光子</text>
  <!-- energy diagram -->
  <text x='520' y='60' text-anchor='middle' font-size='13' fill='#1a237e'>能级与 Purcell 增强</text>
  <line x1='460' y1='200' x2='580' y2='200' stroke='#333' stroke-width='2'/>
  <line x1='460' y1='110' x2='580' y2='110' stroke='#333' stroke-width='2'/>
  <text x='440' y='205' text-anchor='end' font-size='11' fill='#333'>基态</text>
  <text x='440' y='115' text-anchor='end' font-size='11' fill='#333'>激发态</text>
  <line x1='500' y1='200' x2='500' y2='110' stroke='#d32f2f' stroke-width='2' marker-end='url(#arrow)'/>
  <text x='510' y='160' font-size='10' fill='#d32f2f'>泵浦</text>
  <path d='M530,110 Q560,80 560,130' stroke='#2e7d32' stroke-width='2' fill='none' marker-end='url(#arrow)'/>
  <text x='565' y='100' font-size='10' fill='#2e7d32'>辐射</text>
  <text x='520' y='240' text-anchor='middle' font-size='10' fill='#555'>寿命缩短 → 收集率提升</text>
  <!-- legend -->
  <rect x='40' y='300' width='12' height='12' fill='#c8e6ff' stroke='#1565c0'/>
  <text x='58' y='311' font-size='11' fill='#333'>金刚石纳米柱</text>
  <circle cx='150' cy='306' r='5' fill='#d32f2f'/>
  <text x='162' y='311' font-size='11' fill='#333'>色心</text>
  <line x1='210' y1='306' x2='240' y2='306' stroke='#d32f2f' stroke-width='2' marker-end='url(#arrow)'/>
  <text x='246' y='311' font-size='11' fill='#333'>光子</text>
  <rect x='300' y='300' width='12' height='12' fill='#b0bec5' stroke='#607d8b'/>
  <text x='318' y='311' font-size='11' fill='#333'>衬底</text>
</svg>