<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>
  <rect x="20" y="20" width="180" height="120" fill="#e0f0ff" stroke="#3399ff" stroke-width="2" rx="8"/>
  <text x="110" y="45" text-anchor="middle" font-size="14" fill="#003366">原始高光谱立方体</text>
  <text x="110" y="65" text-anchor="middle" font-size="12" fill="#003366">H×W×C</text>
  <rect x="40" y="80" width="40" height="40" fill="#99ccff" stroke="#3399ff"/>
  <rect x="90" y="80" width="40" height="40" fill="#99ccff" stroke="#3399ff"/>
  <rect x="140" y="80" width="40" height="40" fill="#99ccff" stroke="#3399ff"/>
  <text x="110" y="135" text-anchor="middle" font-size="10" fill="#666">光谱维度C</text>

  <rect x="240" y="20" width="160" height="120" fill="#fff0e0" stroke="#ff9933" stroke-width="2" rx="8"/>
  <text x="320" y="45" text-anchor="middle" font-size="14" fill="#663300">掩码操作</text>
  <rect x="260" y="70" width="40" height="40" fill="#ffcc99" stroke="#ff9933"/>
  <rect x="310" y="70" width="40" height="40" fill="#ffcc99" stroke="#ff9933" stroke-dasharray="4"/>
  <rect x="360" y="70" width="40" height="40" fill="#ffcc99" stroke="#ff9933"/>
  <text x="330" y="130" text-anchor="middle" font-size="10" fill="#663300">随机遮挡75%</text>

  <rect x="440" y="20" width="180" height="120" fill="#e0ffe0" stroke="#33aa33" stroke-width="2" rx="8"/>
  <text x="530" y="45" text-anchor="middle" font-size="14" fill="#003300">混合操作</text>
  <rect x="460" y="70" width="40" height="40" fill="#99ff99" stroke="#33aa33"/>
  <rect x="510" y="70" width="40" height="40" fill="#66ff66" stroke="#33aa33"/>
  <text x="530" y="130" text-anchor="middle" font-size="10" fill="#003300">线性插值 λ</text>

  <rect x="200" y="200" width="240" height="60" fill="#f0f0f0" stroke="#666" stroke-width="2" rx="8"/>
  <text x="320" y="225" text-anchor="middle" font-size="14" fill="#333">编码器 fθ</text>
  <text x="320" y="245" text-anchor="middle" font-size="12" fill="#666">Transformer / CNN</text>

  <rect x="200" y="290" width="240" height="50" fill="#f0f0f0" stroke="#666" stroke-width="2" rx="8"/>
  <text x="320" y="315" text-anchor="middle" font-size="14" fill="#333">解码器 gφ</text>
  <text x="320" y="335" text-anchor="middle" font-size="12" fill="#666">重建掩码区域</text>

  <line x1="110" y1="140" x2="110" y2="180" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="110" y1="180" x2="200" y2="220" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="320" y1="140" x2="320" y2="200" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="530" y1="140" x2="530" y2="180" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="530" y1="180" x2="440" y2="220" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="320" y1="260" x2="320" y2="290" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="480" y="200" width="140" height="60" fill="#ffe0e0" stroke="#cc3333" stroke-width="2" rx="8"/>
  <text x="550" y="225" text-anchor="middle" font-size="12" fill="#660000">损失函数</text>
  <text x="550" y="245" text-anchor="middle" font-size="11" fill="#660000">L_MIM + L_NCE</text>
  <line x1="440" y1="230" x2="480" y2="230" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="320" y1="340" x2="320" y2="360" stroke="none"/>
  <line x1="440" y1="315" x2="480" y2="315" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="480" y1="315" x2="480" y2="260" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="20" y="300" width="120" height="40" fill="#ffffff" stroke="#999"/>
  <text x="80" y="315" text-anchor="middle" font-size="10" fill="#333">图例：</text>
  <rect x="30" y="325" width="15" height="10" fill="#99ccff"/>
  <text x="50" y="333" font-size="9">原始数据</text>
  <rect x="90" y="325" width="15" height="10" fill="#ffcc99"/>
  <text x="110" y="333" font-size="9">增强视图</text>
</svg>