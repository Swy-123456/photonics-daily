<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>
  <rect width="640" height="360" fill="#f8f9fa" rx="8"/>
  <!-- 激光脉冲 -->
  <g>
    <rect x="30" y="60" width="80" height="20" fill="#e74c3c" rx="4"/>
    <text x="70" y="74" text-anchor="middle" fill="white" font-size="11">脉冲1</text>
    <rect x="30" y="100" width="80" height="20" fill="#2ecc71" rx="4"/>
    <text x="70" y="114" text-anchor="middle" fill="white" font-size="11">脉冲2</text>
    <rect x="30" y="140" width="80" height="20" fill="#3498db" rx="4"/>
    <text x="70" y="154" text-anchor="middle" fill="white" font-size="11">脉冲3</text>
  </g>
  <!-- 入射箭头 -->
  <line x1="110" y1="70" x2="200" y2="120" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="110" y1="110" x2="200" y2="140" stroke="#2ecc71" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="110" y1="150" x2="200" y2="160" stroke="#3498db" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- 样品 -->
  <rect x="200" y="120" width="100" height="60" fill="#f1c40f" rx="6" stroke="#f39c12" stroke-width="2"/>
  <text x="250" y="155" text-anchor="middle" fill="#333" font-size="13" font-weight="bold">样品</text>
  <!-- 信号光 -->
  <line x1="300" y1="150" x2="400" y2="150" stroke="#9b59b6" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="350" y="140" text-anchor="middle" fill="#9b59b6" font-size="12">FWM信号</text>
  <!-- 物镜 -->
  <ellipse cx="420" cy="150" rx="25" ry="40" fill="none" stroke="#555" stroke-width="2"/>
  <text x="420" y="200" text-anchor="middle" fill="#555" font-size="11">物镜</text>
  <!-- 相机 -->
  <rect x="480" y="100" width="120" height="100" fill="#ecf0f1" rx="6" stroke="#7f8c8d" stroke-width="2"/>
  <text x="540" y="120" text-anchor="middle" fill="#333" font-size="12" font-weight="bold">相机</text>
  <!-- 像素阵列 -->
  <g>
    <rect x="495" y="130" width="15" height="15" fill="#e74c3c" opacity="0.8"/>
    <rect x="515" y="130" width="15" height="15" fill="#2ecc71" opacity="0.8"/>
    <rect x="535" y="130" width="15" height="15" fill="#3498db" opacity="0.8"/>
    <rect x="555" y="130" width="15" height="15" fill="#f1c40f" opacity="0.8"/>
    <rect x="495" y="150" width="15" height="15" fill="#9b59b6" opacity="0.8"/>
    <rect x="515" y="150" width="15" height="15" fill="#e67e22" opacity="0.8"/>
    <rect x="535" y="150" width="15" height="15" fill="#1abc9c" opacity="0.8"/>
    <rect x="555" y="150" width="15" height="15" fill="#e74c3c" opacity="0.8"/>
  </g>
  <text x="540" y="185" text-anchor="middle" fill="#555" font-size="10">像素阵列</text>
  <!-- 图例 -->
  <g transform="translate(30,260)">
    <text x="0" y="0" font-size="12" font-weight="bold" fill="#333">图例</text>
    <rect x="0" y="10" width="12" height="12" fill="#e74c3c"/><text x="18" y="21" font-size="11" fill="#333">脉冲1</text>
    <rect x="80" y="10" width="12" height="12" fill="#2ecc71"/><text x="98" y="21" font-size="11" fill="#333">脉冲2</text>
    <rect x="160" y="10" width="12" height="12" fill="#3498db"/><text x="178" y="21" font-size="11" fill="#333">脉冲3</text>
    <rect x="240" y="10" width="12" height="12" fill="#9b59b6"/><text x="258" y="21" font-size="11" fill="#333">FWM信号</text>
    <rect x="340" y="10" width="12" height="12" fill="#f1c40f"/><text x="358" y="21" font-size="11" fill="#333">样品</text>
  </g>
</svg>