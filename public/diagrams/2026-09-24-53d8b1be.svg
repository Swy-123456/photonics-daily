<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 360' font-family='sans-serif'>
  <rect width='640' height='360' fill='#f8f9fa'/>
  <text x='320' y='24' text-anchor='middle' font-size='16' font-weight='bold' fill='#1a1a2e'>CPO 光纤—硅光芯片主动对准流程</text>
  <!-- 光纤阵列 -->
  <rect x='40' y='60' width='120' height='40' rx='6' fill='#4a90d9' stroke='#2c5f8a' stroke-width='2'/>
  <text x='100' y='85' text-anchor='middle' font-size='12' fill='#fff'>单模光纤阵列</text>
  <!-- 位移台 -->
  <rect x='40' y='120' width='120' height='30' rx='4' fill='#e8a838' stroke='#b07d20' stroke-width='2'/>
  <text x='100' y='140' text-anchor='middle' font-size='11' fill='#fff'>六轴位移台</text>
  <!-- 箭头 -->
  <line x1='160' y1='80' x2='240' y2='80' stroke='#333' stroke-width='2' marker-end='url(#arrow)'/>
  <defs><marker id='arrow' markerWidth='8' markerHeight='8' refX='6' refY='3' orient='auto'><path d='M0,0 L6,3 L0,6 Z' fill='#333'/></marker></defs>
  <!-- 硅光芯片 -->
  <rect x='250' y='50' width='180' height='60' rx='6' fill='#6c5ce7' stroke='#4a3ab5' stroke-width='2'/>
  <text x='340' y='75' text-anchor='middle' font-size='12' fill='#fff'>硅光芯片</text>
  <text x='340' y='95' text-anchor='middle' font-size='10' fill='#ddd'>SSC + 波导</text>
  <!-- 波导线条 -->
  <line x1='270' y1='80' x2='410' y2='80' stroke='#00d2ff' stroke-width='3' stroke-dasharray='6,3'/>
  <!-- 探测器 -->
  <rect x='460' y='60' width='120' height='40' rx='6' fill='#00b894' stroke='#008a6e' stroke-width='2'/>
  <text x='520' y='85' text-anchor='middle' font-size='12' fill='#fff'>光电探测器</text>
  <line x1='430' y1='80' x2='460' y2='80' stroke='#333' stroke-width='2' marker-end='url(#arrow)'/>
  <!-- 反馈回路 -->
  <path d='M520,100 L520,150 L100,150 L100,120' fill='none' stroke='#e74c3c' stroke-width='2' stroke-dasharray='5,3' marker-end='url(#arrowRed)'/>
  <defs><marker id='arrowRed' markerWidth='8' markerHeight='8' refX='6' refY='3' orient='auto'><path d='M0,0 L6,3 L0,6 Z' fill='#e74c3c'/></marker></defs>
  <text x='310' y='165' text-anchor='middle' font-size='11' fill='#e74c3c'>功率反馈控制</text>
  <!-- 固化胶 -->
  <circle cx='250' cy='80' r='5' fill='#f39c12'/>
  <text x='225' y='65' font-size='10' fill='#b07d20'>UV胶</text>
  <!-- 下方曲线图 -->
  <rect x='60' y='200' width='520' height='130' rx='6' fill='#fff' stroke='#ccc' stroke-width='1'/>
  <text x='320' y='220' text-anchor='middle' font-size='12' font-weight='bold' fill='#333'>耦合效率 η 随横向偏移 Δx 的变化</text>
  <!-- 坐标轴 -->
  <line x1='100' y1='300' x2='540' y2='300' stroke='#333' stroke-width='1.5'/>
  <line x1='100' y1='300' x2='100' y2='235' stroke='#333' stroke-width='1.5'/>
  <text x='540' y='315' text-anchor='end' font-size='10' fill='#555'>Δx (μm)</text>
  <text x='95' y='240' text-anchor='end' font-size='10' fill='#555'>η</text>
  <!-- 高斯曲线 -->
  <path d='M100,240 Q200,240 320,300 Q440,240 540,240' fill='none' stroke='#e74c3c' stroke-width='2.5'/>
  <!-- 标注点 -->
  <line x1='320' y1='300' x2='320' y2='270' stroke='#999' stroke-width='1' stroke-dasharray='3,3'/>
  <text x='320' y='265' text-anchor='middle' font-size='10' fill='#e74c3c'>峰值</text>
  <line x1='220' y1='300' x2='220' y2='255' stroke='#999' stroke-width='1' stroke-dasharray='3,3'/>
  <text x='220' y='250' text-anchor='middle' font-size='9' fill='#777'>-0.5μm</text>
  <line x1='420' y1='300' x2='420' y2='255' stroke='#999' stroke-width='1' stroke-dasharray='3,3'/>
  <text x='420' y='250' text-anchor='middle' font-size='9' fill='#777'>+0.5μm</text>
  <!-- 图例 -->
  <rect x='440' y='330' width='12' height='12' fill='#e74c3c'/>
  <text x='458' y='340' font-size='10' fill='#555'>高斯耦合效率</text>
</svg>