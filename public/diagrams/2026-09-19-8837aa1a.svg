<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 360' font-family='sans-serif'>
  <rect width='640' height='360' fill='#f8f9fa'/>
  <text x='320' y='28' text-anchor='middle' font-size='16' font-weight='bold' fill='#1a1a2e'>1.6T 相干光模块收发链路</text>
  <!-- 发射端 -->
  <rect x='20' y='60' width='120' height='50' rx='6' fill='#e3f2fd' stroke='#1565c0' stroke-width='2'/>
  <text x='80' y='90' text-anchor='middle' font-size='13' fill='#0d47a1'>发射 DSP</text>
  <rect x='170' y='60' width='120' height='50' rx='6' fill='#e8f5e9' stroke='#2e7d32' stroke-width='2'/>
  <text x='230' y='82' text-anchor='middle' font-size='12' fill='#1b5e20'>IQ 调制器</text>
  <text x='230' y='100' text-anchor='middle' font-size='11' fill='#1b5e20'>(硅光)</text>
  <rect x='320' y='60' width='80' height='50' rx='6' fill='#fff3e0' stroke='#e65100' stroke-width='2'/>
  <text x='360' y='90' text-anchor='middle' font-size='12' fill='#bf360c'>光纤</text>
  <!-- 接收端 -->
  <rect x='430' y='60' width='100' height='50' rx='6' fill='#e8f5e9' stroke='#2e7d32' stroke-width='2'/>
  <text x='480' y='82' text-anchor='middle' font-size='12' fill='#1b5e20'>90° 光</text>
  <text x='480' y='100' text-anchor='middle' font-size='12' fill='#1b5e20'>混合器</text>
  <rect x='550' y='60' width='80' height='50' rx='6' fill='#e3f2fd' stroke='#1565c0' stroke-width='2'/>
  <text x='590' y='90' text-anchor='middle' font-size='13' fill='#0d47a1'>接收 DSP</text>
  <!-- 箭头 -->
  <line x1='140' y1='85' x2='165' y2='85' stroke='#333' stroke-width='2' marker-end='url(#arrow)'/>
  <line x1='290' y1='85' x2='315' y2='85' stroke='#333' stroke-width='2' marker-end='url(#arrow)'/>
  <line x1='400' y1='85' x2='425' y2='85' stroke='#333' stroke-width='2' marker-end='url(#arrow)'/>
  <line x1='530' y1='85' x2='545' y2='85' stroke='#333' stroke-width='2' marker-end='url(#arrow)'/>
  <defs><marker id='arrow' markerWidth='8' markerHeight='8' refX='8' refY='4' orient='auto'><path d='M0,0 L8,4 L0,8 Z' fill='#333'/></marker></defs>
  <!-- 激光器 -->
  <rect x='170' y='150' width='120' height='40' rx='6' fill='#fce4ec' stroke='#c62828' stroke-width='2'/>
  <text x='230' y='175' text-anchor='middle' font-size='12' fill='#b71c1c'>本振激光器</text>
  <line x1='230' y1='150' x2='230' y2='115' stroke='#c62828' stroke-width='2' stroke-dasharray='4'/>
  <!-- 平衡探测器 -->
  <rect x='430' y='150' width='100' height='40' rx='6' fill='#f3e5f5' stroke='#6a1b9a' stroke-width='2'/>
  <text x='480' y='175' text-anchor='middle' font-size='11' fill='#4a148c'>平衡光电探测器</text>
  <line x1='480' y1='150' x2='480' y2='115' stroke='#6a1b9a' stroke-width='2' stroke-dasharray='4'/>
  <line x1='480' y1='190' x2='480' y2='230' stroke='#6a1b9a' stroke-width='2'/>
  <line x1='480' y1='230' x2='590' y2='230' stroke='#6a1b9a' stroke-width='2'/>
  <line x1='590' y1='230' x2='590' y2='115' stroke='#6a1b9a' stroke-width='2' stroke-dasharray='4'/>
  <!-- 图例 -->
  <rect x='20' y='280' width='600' height='60' rx='6' fill='#fff' stroke='#ccc' stroke-width='1'/>
  <rect x='40' y='295' width='16' height='16' fill='#e3f2fd' stroke='#1565c0'/>
  <text x='62' y='308' font-size='12' fill='#333'>电信号处理</text>
  <rect x='180' y='295' width='16' height='16' fill='#e8f5e9' stroke='#2e7d32'/>
  <text x='202' y='308' font-size='12' fill='#333'>光调制/混合</text>
  <rect x='330' y='295' width='16' height='16' fill='#fff3e0' stroke='#e65100'/>
  <text x='352' y='308' font-size='12' fill='#333'>光纤链路</text>
  <rect x='460' y='295' width='16' height='16' fill='#fce4ec' stroke='#c62828'/>
  <text x='482' y='308' font-size='12' fill='#333'>激光器</text>
  <rect x='40' y='320' width='16' height='16' fill='#f3e5f5' stroke='#6a1b9a'/>
  <text x='62' y='333' font-size='12' fill='#333'>光电探测</text>
</svg>