<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 360' font-family='sans-serif'>
  <rect width='640' height='360' fill='#f8f9fc'/>
  <text x='320' y='28' text-anchor='middle' font-size='16' font-weight='bold' fill='#1a2a4a'>SkyWater 量子光子学代工平台示意</text>
  <!-- 光纤输入 -->
  <rect x='20' y='150' width='70' height='40' rx='6' fill='#cfe3ff' stroke='#3b6fb6'/>
  <text x='55' y='175' text-anchor='middle' font-size='11' fill='#1a2a4a'>光纤输入</text>
  <!-- 硅波导 -->
  <line x1='90' y1='170' x2='180' y2='170' stroke='#3b6fb6' stroke-width='6'/>
  <!-- 微环 -->
  <circle cx='220' cy='170' r='28' fill='none' stroke='#3b6fb6' stroke-width='5'/>
  <line x1='180' y1='170' x2='192' y2='170' stroke='#3b6fb6' stroke-width='6'/>
  <line x1='248' y1='170' x2='280' y2='170' stroke='#3b6fb6' stroke-width='6'/>
  <text x='220' y='215' text-anchor='middle' font-size='10' fill='#1a2a4a'>微环谐振器</text>
  <!-- MZI -->
  <path d='M280 170 L320 140 L360 140 L400 170' fill='none' stroke='#3b6fb6' stroke-width='4'/>
  <path d='M280 170 L320 200 L360 200 L400 170' fill='none' stroke='#3b6fb6' stroke-width='4'/>
  <text x='340' y='230' text-anchor='middle' font-size='10' fill='#1a2a4a'>MZI 干涉网络</text>
  <!-- SNSPD -->
  <rect x='400' y='145' width='90' height='50' rx='6' fill='#ffe0e0' stroke='#c0392b'/>
  <path d='M410 170 L420 155 L430 185 L440 155 L450 185 L460 155 L470 185 L480 170' fill='none' stroke='#c0392b' stroke-width='3'/>
  <text x='445' y='215' text-anchor='middle' font-size='10' fill='#c0392b'>超导纳米线探测器</text>
  <!-- 电输出 -->
  <line x1='490' y1='170' x2='540' y2='170' stroke='#888' stroke-width='3'/>
  <rect x='540' y='150' width='70' height='40' rx='6' fill='#e8e8e8' stroke='#888'/>
  <text x='575' y='175' text-anchor='middle' font-size='10' fill='#333'>读出电路</text>
  <!-- 低温层 -->
  <rect x='20' y='270' width='600' height='60' rx='8' fill='#e6f0ff' stroke='#3b6fb6' stroke-dasharray='5,3'/>
  <text x='320' y='295' text-anchor='middle' font-size='12' fill='#1a2a4a'>低温恒温器 1–4 K（超导工作环境）</text>
  <text x='320' y='315' text-anchor='middle' font-size='10' fill='#555'>CMOS 控制与偏置电路</text>
  <!-- 图例 -->
  <rect x='20' y='45' width='12' height='12' fill='#3b6fb6'/>
  <text x='38' y='55' font-size='10' fill='#1a2a4a'>硅波导 / 无源器件</text>
  <rect x='180' y='45' width='12' height='12' fill='#c0392b'/>
  <text x='198' y='55' font-size='10' fill='#1a2a4a'>超导纳米线</text>
  <rect x='320' y='45' width='12' height='12' fill='#888'/>
  <text x='338' y='55' font-size='10' fill='#1a2a4a'>金属互连 / 电信号</text>
  <line x1='460' y1='51' x2='490' y2='51' stroke='#3b6fb6' stroke-width='3'/>
  <text x='498' y='55' font-size='10' fill='#1a2a4a'>光信号</text>
</svg>