<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="sans-serif">
  <defs>
    <linearGradient id="perov" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f6c85f"/>
      <stop offset="100%" stop-color="#e09f3e"/>
    </linearGradient>
    <linearGradient id="entropy" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8ecae6"/>
      <stop offset="50%" stop-color="#a7c957"/>
      <stop offset="100%" stop-color="#f28482"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="640" height="360" fill="#ffffff"/>
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">高熵分子接触层钙钛矿太阳能电池</text>
  <rect x="80" y="300" width="480" height="24" fill="#adb5bd" stroke="#555"/>
