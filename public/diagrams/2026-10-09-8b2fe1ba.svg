  <rect x="80" y="260" width="480" height="40" fill="#90e0ef" stroke="#555"/>
  <text x="320" y="285" text-anchor="middle" font-size="12" fill="#111">电子传输层 (ETL)</text>
  <rect x="80" y="170" width="480" height="90" fill="url(#perov)" stroke="#555"/>
  <text x="320" y="220" text-anchor="middle" font-size="14" font-weight="bold" fill="#3a2a00">钙钛矿吸光层</text>
  <rect x="80" y="110" width="480" height="60" fill="url(#entropy)" stroke="#555" opacity="0.9"/>
  <text x="320" y="145" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b3a2b">高熵分子接触层</text>
  <circle cx="140" cy="130" r="8" fill="#0077b6"/>
  <text x="152" y="134" font-size="11" fill="#023e8a">锚定 Pb²⁺</text>
  <circle cx="300" cy="130" r="8" fill="#e76f51"/>
  <text x="312" y="134" font-size="11" fill="#7f2d1a">阻挡 I⁻</text>
  <circle cx="460" cy="130" r="8" fill="#2a9d8f"/>
  <text x="472" y="134" font-size="11" fill="#145a4e">疏水防潮</text>
  <rect x="80" y="70" width="480" height="40" fill="#ced4da" stroke="#555"/>
  <text x="320" y="95" text-anchor="middle" font-size="12" fill="#111">金属电极</text>
  <line x1="580" y1="110" x2="580" y2="300" stroke="#555" stroke-dasharray="4,3"/>
  <text x="590" y="200" font-size="11" fill="#555" transform="rotate(90 590 200)">光照方向</text>
  <rect x="20" y="330" width="600" height="24" fill="#f8f9fa" stroke="#ccc"/>
  <circle cx="40" cy="342" r="6" fill="#0077b6"/>
  <text x="52" y="346" font-size="10" fill="#333">蓝色：钝化铅缺陷</text>
  <circle cx="180" cy="342" r="6" fill="#e76f51"/>
  <text x="192" y="346" font-size="10" fill="#333">橙色：抑制离子迁移</text>
  <circle cx="340" cy="342" r="6" fill="#2a9d8f"/>
  <text x="352" y="346" font-size="10" fill="#333">绿色：疏水稳定</text>
  <text x="500" y="346" font-size="10" fill="#333">多组分协同</text>
</svg>