<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="sans-serif" font-size="12">
  <rect width="640" height="360" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="320" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Q.ANT 第二代光子处理器架构示意</text>
  <!-- Laser -->
  <rect x="20" y="80" width="70" height="50" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="55" y="110" text-anchor="middle" fill="#1e3a8a">激光器</text>
  <!-- Splitter -->
  <polygon points="120,85 160,105 120,125" fill="#bfdbfe" stroke="#2563eb"/>
  <text x="140" y="145" text-anchor="middle" fill="#1e3a8a">1×N分束</text>
  <!-- Waveguides and modulators -->
  <g stroke="#2563eb" stroke-width="2" fill="none">
    <line x1="160" y1="105" x2="230" y2="70"/>
    <line x1="160" y1="105" x2="230" y2="100"/>
    <line x1="160" y1="105" x2="230" y2="130"/>
    <line x1="160" y1="105" x2="230" y2="160"/>
  </g>
  <g fill="#fef3c7" stroke="#d97706">
    <rect x="230" y="58" width="80" height="24" rx="4"/>
    <rect x="230" y="88" width="80" height="24" rx="4"/>
    <rect x="230" y="118" width="80" height="24" rx="4"/>
    <rect x="230" y="148" width="80" height="24" rx="4"/>
  </g>
  <text x="270" y="75" text-anchor="middle" font-size="11" fill="#92400e">TFLN调制器</text>
  <text x="270" y="105" text-anchor="middle" font-size="11" fill="#92400e">TFLN调制器</text>
  <text x="270" y="135" text-anchor="middle" font-size="11" fill="#92400e">TFLN调制器</text>
  <text x="270" y="165" text-anchor="middle" font-size="11" fill="#92400e">TFLN调制器</text>
  <!-- MMI -->
  <rect x="340" y="55" width="100" height="120" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="390" y="105" text-anchor="middle" fill="#166534">多模干涉区</text>
  <text x="390" y="122" text-anchor="middle" font-size="11" fill="#166534">光傅里叶变换</text>
  <!-- Detectors -->
  <g fill="#fce7f3" stroke="#db2777">
    <rect x="470" y="65" width="60" height="22" rx="4"/>
    <rect x="470" y="100" width="60" height="22" rx="4"/>
    <rect x="470" y="135" width="60" height="22" rx="4"/>
  </g>
  <text x="500" y="80" text-anchor="middle" font-size="11" fill="#9d174d">平衡探测</text>
  <text x="500" y="115" text-anchor="middle" font-size="11" fill="#9d174d">平衡探测</text>
  <text x="500" y="150" text-anchor="middle" font-size="11" fill="#9d174d">平衡探测</text>
  <!-- Electronics -->
  <rect x="560" y="80" width="60" height="80" rx="6" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="590" y="115" text-anchor="middle" font-size="11" fill="#4c1d95">电子</text>
  <text x="590" y="130" text-anchor="middle" font-size="11" fill="#4c1d95">控制</text>
  <!-- Arrows -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
  <line x1="90" y1="105" x2="118" y2="105" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="310" y1="105" x2="338" y2="105" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="440" y1="105" x2="468" y2="105" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="530" y1="105" x2="558" y2="105" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Feedback -->
  <path d="M590,160 L590,200 L390,200 L390,178" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="490" y="215" text-anchor="middle" font-size="11" fill="#4c1d95">权重/校准反馈</text>
  <!-- Legend -->
  <rect x="20" y="280" width="600" height="60" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="40" y="300" font-size="12" font-weight="bold" fill="#0f172a">图例</text>
  <rect x="40" y="312" width="14" height="10" fill="#dbeafe" stroke="#2563eb"/><text x="60" y="321" font-size="11">光源/分束</text>
  <rect x="160" y="312" width="14" height="10" fill="#fef3c7" stroke="#d97706"/><text x="180" y="321" font-size="11">TFLN 权重调制</text>
  <rect x="310" y="312" width="14" height="10" fill="#dcfce7" stroke="#16a34a"/><text x="330" y="321" font-size="11">MMI 傅里叶变换</text>
  <rect x="460" y="312" width="14" height="10" fill="#fce7f3" stroke="#db2777"/><text x="480" y="321" font-size="11">光电探测</text>
  <rect x="560" y="312" width="14" height="10" fill="#ede9fe" stroke="#7c3aed"/><text x="580" y="321" font-size="11">电子控制</text>
</svg>