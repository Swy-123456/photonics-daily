<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="sans-serif">
  <rect width="640" height="360" fill="#f8fafc"/>
  <text x="320" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">2D 平面集成 vs 3D 多层光子集成</text>
  <line x1="320" y1="50" x2="320" y2="340" stroke="#cbd5e1" stroke-dasharray="4"/>
  <text x="160" y="62" text-anchor="middle" font-size="13" fill="#334155">2D 平面集成</text>
  <text x="480" y="62" text-anchor="middle" font-size="13" fill="#334155">3D 多层集成</text>
  <rect x="40" y="80" width="240" height="30" rx="4" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="160" y="100" text-anchor="middle" font-size="11" fill="#334155">硅衬底</text>
  <rect x="40" y="110" width="240" height="60" rx="4" fill="#bfdbfe" stroke="#3b82f6"/>
  <text x="160" y="145" text-anchor="middle" font-size="11" fill="#1e3a8a">单层光波导 + 调制器 + 探测器</text>
  <rect x="60" y="180" width="80" height="22" rx="3" fill="#93c5fd" stroke="#2563eb"/>
  <text x="100" y="195" text-anchor="middle" font-size="10" fill="#1e3a8a">调制器</text>
  <rect x="180" y="180" width="80" height="22" rx="3" fill="#93c5fd" stroke="#2563eb"/>
  <text x="220" y="195" text-anchor="middle" font-size="10" fill="#1e3a8a">探测器</text>
  <line x1="140" y1="191" x2="180" y2="191" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="160" y="235" text-anchor="middle" font-size="10" fill="#64748b">横向布线长、面积大</text>
  <defs>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#2563eb"/></marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#dc2626"/></marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#16a34a"/></marker>
  </defs>
  <rect x="360" y="80" width="240" height="30" rx="4" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="480" y="100" text-anchor="middle" font-size="11" fill="#334155">硅衬底</text>
  <rect x="360" y="110" width="240" height="40" rx="4" fill="#fca5a5" stroke="#dc2626"/>
  <text x="480" y="135" text-anchor="middle" font-size="11" fill="#7f1d1d">层 1：激光器 / 探测器</text>
  <rect x="360" y="150" width="240" height="40" rx="4" fill="#86efac" stroke="#16a34a"/>
  <text x="480" y="175" text-anchor="middle" font-size="11" fill="#14532d">层 2：波导 / 调制器</text>
  <rect x="360" y="190" width="240" height="40" rx="4" fill="#93c5fd" stroke="#2563eb"/>
  <text x="480" y="215" text-anchor="middle" font-size="11" fill="#1e3a8a">层 3：驱动电路</text>
  <line x1="430" y1="150" x2="430" y2="110" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="410" y="135" font-size="9" fill="#dc2626">光栅耦合</text>
  <line x1="530" y1="190" x2="530" y2="150" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="540" y="175" font-size="9" fill="#16a34a">TSV</text>
  <text x="480" y="255" text-anchor="middle" font-size="10" fill="#64748b">垂直互连短、密度高</text>
  <rect x="40" y="280" width="560" height="60" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="60" y="302" font-size="11" fill="#0f172a">图例：</text>
  <rect x="110" y="292" width="14" height="14" fill="#93c5fd" stroke="#2563eb"/>
  <text x="130" y="303" font-size="10" fill="#334155">光/电功能层</text>
  <rect x="230" y="292" width="14" height="14" fill="#fca5a5" stroke="#dc2626"/>
  <text x="250" y="303" font-size="10" fill="#334155">有源层</text>
  <line x1="340" y1="299" x2="370" y2="299" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="378" y="303" font-size="10" fill="#334155">光信号</text>
  <line x1="450" y1="299" x2="480" y2="299" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="488" y="303" font-size="10" fill="#334155">电信号</text>
</svg>