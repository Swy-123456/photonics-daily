<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="sans-serif">
  <rect width="640" height="360" fill="#f7f9fc"/>
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2d3d">光子芯片封装：从硅波导到光纤</text>
  <rect x="30" y="120" width="90" height="60" rx="6" fill="#4c78a8"/>
  <text x="75" y="145" text-anchor="middle" font-size="12" fill="#fff">硅波导</text>
  <text x="75" y="162" text-anchor="middle" font-size="10" fill="#dbe9f6">~0.2 μm</text>
  <polygon points="120,120 200,105 200,195 120,180" fill="#72b7b2"/>
  <text x="160" y="150" text-anchor="middle" font-size="11" fill="#fff">模斑</text>
  <text x="160" y="165" text-anchor="middle" font-size="11" fill="#fff">转换器</text>
  <rect x="200" y="130" width="80" height="40" rx="4" fill="#f2a541"/>
  <text x="240" y="148" text-anchor="middle" font-size="11" fill="#fff">光纤阵列</text>
  <text x="240" y="162" text-anchor="middle" font-size="10" fill="#fff">~10 μm</text>
  <rect x="300" y="110" width="110" height="80" rx="6" fill="#e45756"/>
  <text x="355" y="140" text-anchor="middle" font-size="12" fill="#fff">对准与固化</text>
  <text x="355" y="158" text-anchor="middle" font-size="10" fill="#ffe3e0">有源对准 / UV 胶</text>
  <rect x="430" y="100" width="120" height="100" rx="6" fill="#54a24b"/>
  <text x="490" y="130" text-anchor="middle" font-size="12" fill="#fff">封装模块</text>
  <text x="490" y="148" text-anchor="middle" font-size="10" fill="#e6f4e2">TEC + 电互连</text>
  <text x="490" y="165" text-anchor="middle" font-size="10" fill="#e6f4e2">气密封装</text>
  <line x1="30" y1="220" x2="610" y2="220" stroke="#b0b8c1" stroke-width="1"/>
  <text x="40" y="245" font-size="12" fill="#1f2d3d">耦合损耗随横向偏移增大而上升：</text>
  <path d="M 220 275 Q 300 275 360 250 Q 420 225 500 222" fill="none" stroke="#4c78a8" stroke-width="3"/>
  <text x="230" y="295" font-size="11" fill="#4c78a8">扩模后容差宽</text>
  <path d="M 220 275 Q 260 275 290 260 Q 320 245 340 240" fill="none" stroke="#e45756" stroke-width="3" stroke-dasharray="6 4"/>
  <text x="345" y="238" font-size="11" fill="#e45756">未扩模容差窄</text>
  <text x="40" y="330" font-size="11" fill="#5a6570">图例：蓝色=硅波导，青色=模斑转换，橙色=光纤，红色=对准，绿色=封装模块</text>
</svg>