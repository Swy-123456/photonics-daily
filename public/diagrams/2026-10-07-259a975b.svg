<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="sans-serif">
  <rect width="640" height="360" fill="#f8f9fa"/>
  <text x="320" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a2e">硅光芯片可靠性测试流程</text>
  <rect x="30" y="60" width="120" height="80" rx="8" fill="#e3f2fd" stroke="#1976d2" stroke-width="1.5"/>
  <text x="90" y="90" text-anchor="middle" font-size="12" fill="#0d47a1">硅光芯片</text>
  <text x="90" y="108" text-anchor="middle" font-size="10" fill="#0d47a1">激光器/调制器</text>
  <text x="90" y="124" text-anchor="middle" font-size="10" fill="#0d47a1">波导/探测器</text>
  <rect x="200" y="50" width="110" height="45" rx="6" fill="#fff3e0" stroke="#f57c00" stroke-width="1.2"/>
  <text x="255" y="70" text-anchor="middle" font-size="10" fill="#e65100">高温存储</text>
  <text x="255" y="85" text-anchor="middle" font-size="10" fill="#e65100">125°C</text>
  <rect x="200" y="105" width="110" height="45" rx="6" fill="#fff3e0" stroke="#f57c00" stroke-width="1.2"/>
  <text x="255" y="125" text-anchor="middle" font-size="10" fill="#e65100">温度循环</text>
  <text x="255" y="140" text-anchor="middle" font-size="10" fill="#e65100">-40~85°C</text>
  <rect x="200" y="160" width="110" height="45" rx="6" fill="#fff3e0" stroke="#f57c00" stroke-width="1.2"/>
  <text x="255" y="180" text-anchor="middle" font-size="10" fill="#e65100">湿热偏压</text>
  <text x="255" y="195" text-anchor="middle" font-size="10" fill="#e65100">85°C/85%RH</text>
  <rect x="200" y="215" width="110" height="45" rx="6" fill="#fff3e0" stroke="#f57c00" stroke-width="1.2"/>
  <text x="255" y="235" text-anchor="middle" font-size="10" fill="#e65100">光功率老化</text>
  <text x="255" y="250" text-anchor="middle" font-size="10" fill="#e65100">高光强</text>
  <line x1="150" y1="100" x2="200" y2="72" stroke="#546e7a" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="150" y1="100" x2="200" y2="127" stroke="#546e7a" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="150" y1="100" x2="200" y2="182" stroke="#546e7a" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="150" y1="100" x2="200" y2="237" stroke="#546e7a" stroke-width="1.2" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#546e7a"/></marker></defs>
  <rect x="370" y="80" width="230" height="160" rx="8" fill="#e8f5e9" stroke="#388e3c" stroke-width="1.5"/>
  <text x="485" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b5e20">寿命外推曲线</text>
  <line x1="400" y1="210" x2="580" y2="210" stroke="#333" stroke-width="1"/>
  <line x1="400" y1="210" x2="400" y2="120" stroke="#333" stroke-width="1"/>
  <text x="580" y="225" text-anchor="middle" font-size="9" fill="#333">时间</text>
  <text x="390" y="115" text-anchor="end" font-size="9" fill="#333">失效</text>
  <path d="M400,200 Q460,190 500,160 Q540,130 570,125" fill="none" stroke="#e53935" stroke-width="2"/>
  <text x="520" y="145" font-size="10" fill="#c62828">Weibull</text>
  <text x="490" y="180" font-size="10" fill="#1b5e20">$\eta$, $\beta$</text>
  <text x="490" y="195" font-size="10" fill="#1b5e20">$E_a$</text>
  <rect x="370" y="260" width="230" height="60" rx="6" fill="#f3e5f5" stroke="#8e24aa" stroke-width="1.2"/>
  <text x="485" y="282" text-anchor="middle" font-size="11" fill="#4a148c">JEDEC 标准输出</text>
  <text x="485" y="300" text-anchor="middle" font-size="10" fill="#4a148c">失效率 / 寿命 / 置信区间</text>
  <line x1="485" y1="240" x2="485" y2="260" stroke="#546e7a" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="30" y="290" width="300" height="50" rx="6" fill="#eceff1" stroke="#90a4ae" stroke-width="1"/>
  <text x="180" y="310" text-anchor="middle" font-size="10" fill="#37474f">图例：蓝色=芯片，橙色=加速测试，绿色=统计外推，紫色=标准输出</text>
  <text x="180" y="328" text-anchor="middle" font-size="10" fill="#37474f">$AF=\exp[E_a/k_B(1/T_{use}-1/T_{stress})]$</text>
</svg>