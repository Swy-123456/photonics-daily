<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360"><rect width="640" height="360" fill="#f8f9fa"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2c3e50">含时介质中频率-时间焦散示意图</text><rect x="40" y="80" width="120" height="200" fill="#d4e6f1" stroke="#2980b9" stroke-width="2"/><text x="100" y="75" text-anchor="middle" font-size="14" fill="#2980b9">入射光</text><rect x="260" y="80" width="120" height="200" fill="#fdebd0" stroke="#e67e22" stroke-width="2"/><text x="320" y="75" text-anchor="middle" font-size="14" fill="#e67e22">含时调制区</text><rect x="480" y="80" width="120" height="200" fill="#d5f5e3" stroke="#27ae60" stroke-width="2"/><text x="540" y="75" text-anchor="middle" font-size="14" fill="#27ae60">出射光</text><path d="M60 120 Q160 120 260 160" stroke="#2980b9" stroke-width="2" fill="none" marker-end="url(#arrowBlue)"/><path d="M60 180 Q160 180 260 180" stroke="#2980b9" stroke-width="2" fill="none" marker-end="url(#arrowBlue)"/><path d="M60 240 Q160 240 260 200" stroke="#2980b9" stroke-width="2" fill="none" marker-end="url(#arrowBlue)"/><path d="M260 160 Q380 160 500 180" stroke="#e67e22" stroke-width="2" fill="none" marker-end="url(#arrowOrange)"/><path d="M260 180 Q380 180 500 180" stroke="#e67e22" stroke-width="2" fill="none" marker-end="url(#arrowOrange)"/><path d="M260 200 Q380 200 500 180" stroke="#e67e22" stroke-width="2" fill="none" marker-end="url(#arrowOrange)"/><circle cx="500" cy="180" r="6" fill="#c0392b"/><text x="500" y="165" text-anchor="middle" font-size="12" fill="#c0392b">焦散点</text><text x="320" y="310" text-anchor="middle" font-size="12" fill="#7f8c8d">广义哈密顿方程：dω_c/dz = -∂H/∂t_c, dt_c/dz = ∂H/∂ω_c</text><defs><marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2980b9"/></marker><marker id="arrowOrange" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#e67e22"/></marker>