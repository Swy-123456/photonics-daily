<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Arial, sans-serif">
  <rect width="640" height="360" fill="#f8f9fa"/>
  <!-- 激光器 -->
  <rect x="20" y="140" width="80" height="40" fill="#4a90d9" stroke="#2c3e50" stroke-width="2"/>
  <text x="60" y="165" text-anchor="middle" fill="white" font-size="12">飞秒激光器</text>
  <!-- 光束 -->
  <line x1="100" y1="160" x2="200" y2="160" stroke="#e74c3c" stroke-width="3" stroke-dasharray="8,4"/>
  <text x="150" y="150" text-anchor="middle" fill="#e74c3c" font-size="10">激光脉冲</text>
  <!-- 透镜 -->
  <ellipse cx="220" cy="160" rx="15" ry="30" fill="#f1c40f" stroke="#2c3e50" stroke-width="2"/>
  <text x="220" y="205" text-anchor="middle" fill="#2c3e50" font-size="10">聚焦物镜</text>
  <!-- 玻璃基板 -->
  <rect x="280" y="100" width="200" height="120" fill="#aed6f1" stroke="#2c3e50" stroke-width="2" opacity="0.7"/>
  <text x="380" y="95" text-anchor="middle" fill="#2c3e50" font-size="12">玻璃基板</text>
  <!-- 焦点 -->
  <circle cx="380" cy="160" r="8" fill="#e74c3c" opacity="0.8"/>
  <text x="380" y="185" text-anchor="middle" fill="#e74c3c" font-size="10">焦点（多光子吸收）</text>
  <!-- 改性区 -->
  <rect x="375" y="140" width="10" height="40" fill="#8e44ad" opacity="0.6"/>
  <text x="400" y="145" fill="#8e44ad" font-size="10">改性区</text>
  <!-- 通孔 -->
  <rect x="375" y="100" width="10" height="120" fill="#ffffff" stroke="#2c3e50" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="400" y="115" fill="#2c3e50" font-size="10">通孔（蚀刻后）</text>
  <!-- 图例 -->
  <rect x="500" y="20" width="120" height="100" fill="white" stroke="#2c3e50" stroke-width="1"/>
  <text x="510" y="40" font-size="12" font-weight="bold">图例</text>
  <line x1="510" y1="55" x2="530" y2="55" stroke="#e74c3c" stroke-width="3" stroke-dasharray="8,4"/>
  <text x="535" y="60" font-size="10">激光束</text>
  <circle cx="520" cy="75" r="5" fill="#e74c3c"/>
  <text x="535" y="80" font-size="10">焦点</text>
  <rect x="510" y="85" width="10" height="10" fill="#8e44ad" opacity="0.6"/>
  <text x="535" y="95" font-size="10">改性区</text>
  <rect x="510" y="100" width="10" height="10" fill="#ffffff" stroke="#2c3e50" stroke-width="1"/>
  <text x="535" y="110" font-size="10">通孔</text>
</svg>