<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="sans-serif">
  <defs>
    <linearGradient id="sub" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d9e6f2"/>
      <stop offset="100%" stop-color="#b0c4de"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a90d9"/>
      <stop offset="100%" stop-color="#2c5f8a"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#e67e22"/>
    </marker>
  </defs>
  <!-- 衬底 -->
  <rect x="40" y="260" width="560" height="50" rx="6" fill="url(#sub)" stroke="#7f8c8d"/>
  <text x="320" y="290" text-anchor="middle" font-size="14" fill="#2c3e50">硅衬底 / 氧化层</text>
  <!-- 波导总线 -->
  <rect x="60" y="230" width="520" height="18" rx="9" fill="#95a5a6" stroke="#5d6d7e"/>
  <text x="320" y="225" text-anchor="middle" font-size="12" fill="#5d6d7e">硅波导总线</text>
  <!-- 微环 -->
  <circle cx="320" cy="190" r="55" fill="none" stroke="url(#ring)" stroke-width="14" opacity="0.9"/>
  <text x="320" y="195" text-anchor="middle" font-size="13" fill="#1a5276">微环谐振器</text>
  <!-- 二维材料 -->
  <ellipse cx="320" cy="135" rx="70" ry="12" fill="#27ae60" opacity="0.85"/>
  <text x="320" y="120" text-anchor="middle" font-size="13" fill="#1e8449">单层 TMDC（WSe2）</text>
  <!-- 泵浦输入 -->
  <line x1="20" y1="239" x2="60" y2="239" stroke="#e67e22" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="10" y="232" font-size="12" fill="#e67e22">泵浦</text>
  <!-- 单光子输出 -->
  <line x1="580" y1="239" x2="620" y2="239" stroke="#8e44ad" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="590" y="232" font-size="12" fill="#8e44ad">单光子</text>
  <!-- 激子发光箭头 -->
  <line x1="320" y1="150" x2="320" y2="170" stroke="#f1c40f" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="335" y="165" font-size="11" fill="#b7950b">激子发光</text>
  <!-- FWM 模块 -->
  <rect x="440" y="40" width="150" height="60" rx="8" fill="#fdebd0" stroke="#e67e22"/>
  <text x="515" y="65" text-anchor="middle" font-size="12" fill="#a04000">四波混频</text>
  <text x="515" y="82" text-anchor="middle" font-size="11" fill="#a04000">→ 1550 nm</text>
  <line x1="390" y1="120" x2="440" y2="70" stroke="#e67e22" stroke-width="1.5" stroke-dasharray="5,3"/>
  <!-- 图例 -->
  <rect x="40" y="320" width="12" height="12" fill="#27ae60"/>
  <text x="58" y="331" font-size="11" fill="#2c3e50">二维材料</text>
  <rect x="140" y="320" width="12" height="12" fill="#4a90d9"/>
  <text x="158" y="331" font-size="11" fill="#2c3e50">微环</text>
  <rect x="210" y="320" width="12" height="12" fill="#e67e22"/>
  <text x="228" y="331" font-size="11" fill="#2c3e50">光路/泵浦</text>
  <rect x="310" y="320" width="12" height="12" fill="#8e44ad"/>
  <text x="328" y="331" font-size="11" fill="#2c3e50">单光子输出</text>
</svg>