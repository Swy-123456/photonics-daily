<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="sans-serif">
  <rect width="640" height="360" fill="#f8f9fa" stroke="#ccc" stroke-width="2"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a237e">CMMC Level 2 认证核心控制族与光学数据保护</text>
  <circle cx="320" cy="180" r="50" fill="#e3f2fd" stroke="#1565c0" stroke-width="3"/>
  <text x="320" y="175" text-anchor="middle" font-size="14" font-weight="bold" fill="#0d47a1">光学数据</text>
  <text x="320" y="195" text-anchor="middle" font-size="12" fill="#0d47a1">(CUI)</text>
  <!-- 控制族节点 -->
  <g font-size="10" fill="#333">
    <rect x="60" y="80" width="100" height="30" rx="5" fill="#fff3e0" stroke="#ef6c00"/>
    <text x="110" y="99" text-anchor="middle">访问控制</text>
    <rect x="60" y="130" width="100" height="30" rx="5" fill="#fff3e0" stroke="#ef6c00"/>
    <text x="110" y="149" text-anchor="middle">审计与问责</text>
    <rect x="60" y="180" width="100" height="30" rx="5" fill="#fff3e0" stroke="#ef6c00"/>
    <text x="110" y="199" text-anchor="middle">配置管理</text>
    <rect x="60" y="230" width="100" height="30" rx="5" fill="#fff3e0" stroke="#ef6c00"/>
    <text x="110" y="249" text-anchor="middle">识别与认证</text>
    <rect x="480" y="80" width="100" height="30" rx="5" fill="#e8f5e9" stroke="#2e7d32"/>
    <text x="530" y="99" text-anchor="middle">加密传输</text>
    <rect x="480" y="130" width="100" height="30" rx="5" fill="#e8f5e9" stroke="#2e7d32"/>
    <text x="530" y="149" text-anchor="middle">事件响应</text>
    <rect x="480" y="180" width="100" height="30" rx="5" fill="#e8f5e9" stroke="#2e7d32"/>
    <text x="530" y="199" text-anchor="middle">风险评估</text>
    <rect x="480" y="230" width="100" height="30" rx="5" fill="#e8f5e9" stroke="#2e7d32"/>
    <text x="530" y="249" text-anchor="middle">系统保护</text>
  </g>
  <!-- 箭头 -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
  <line x1="160" y1="95" x2="270" y2="160" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="160" y1="145" x2="270" y2="170" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="160" y1="195" x2="270" y2="180" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="160" y1="245" x2="270" y2="190" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="480" y1="95" x2="370" y2="160" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="480" y1="145" x2="370" y2="170" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="480" y1="195" x2="370" y2="180" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="480" y1="245" x2="370" y2="190" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- 图例 -->
  <rect x="20" y="300" width="20" height="20" fill="#fff3e0" stroke="#ef6c00"/>
  <text x="50" y="315" font-size="12" fill="#333">控制族（部分）</text>
  <rect x="200" y="300" width="20" height="20" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="230" y="315" font-size="12" fill="#333">保护措施</text>
  <text x="400" y="315" font-size="12" fill="#666">依据 NIST SP 800-171</text>
  <text x="400" y="335" font-size="12" fill="#666">CMMC Level 2 认证</text>
</svg>