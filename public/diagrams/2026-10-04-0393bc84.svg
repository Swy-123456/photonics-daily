  <rect x="40" y="270" width="480" height="40" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="4"/>
  <text x="280" y="295" text-anchor="middle" font-size="12" fill="#475569">异质键合与 BEOL 互连层（超导/硅光/III-V）</text>
