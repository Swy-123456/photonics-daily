<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="sans-serif">
  <rect x="0" y="0" width="640" height="360" fill="#f8fafc"/>
  <text x="320" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">量子—经典共集成光子芯片</text>
  <rect x="40" y="60" width="120" height="60" rx="8" fill="#dbeafe" stroke="#2563eb"/>
