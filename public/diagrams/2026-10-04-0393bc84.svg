  <line x1="320" y1="90" x2="360" y2="90" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="410" y1="120" x2="410" y2="170" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowRed)"/>
  <line x1="360" y1="200" x2="320" y2="200" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowRed)"/>
  <line x1="200" y1="200" x2="160" y2="200" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowRed)"/>
  <defs>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#2563eb"/></marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#dc2626"/></marker>
