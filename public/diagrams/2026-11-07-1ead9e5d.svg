<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#333"/>
    </marker>
    <marker id="arrowE" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect x="10" y="10" width="620" height="340" fill="#f9f9f9" stroke="#ccc" rx="8"/>
  <text x="320" y="32" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c3e50">硅基异质集成光子发射机</text>
  <!-- III-V gain -->
  <rect x="40" y="120" width="80" height="70" fill="#f39c12" stroke="#333" rx="4"/>
  <text x="80" y="150" text-anchor="middle" font-size="12" fill="#fff">III-V</text>
  <text x="80" y="166" text-anchor="middle" font-size="11" fill="#fff">增益区</text>
  <!-- taper -->
  <polygon points="120,135 170,145 170,165 120,175" fill="#3498db" stroke="#333"/>
  <text x="145" y="125" text-anchor="middle" font-size="10" fill="#333">锥形耦合</text>
  <!-- splitter -->
  <rect x="180" y="140" width="30" height="30" fill="#95a5a6" stroke="#333"/>
  <text x="195" y="160" text-anchor="middle" font-size="10" fill="#fff">分束</text>
  <!-- upper arm -->
  <path d="M210,145 L270,110 L390,110 L420,145" fill="none" stroke="#2c3e50" stroke-width="2"/>
  <!-- lower arm -->
  <path d="M210,165 L270,200 L390,200 L420,165" fill="none" stroke="#2c3e50" stroke-width="2"/>
  <!-- electrodes -->
  <rect x="270" y="90" width="120" height="8" fill="#c0392b" rx="2"/>
  <rect x="270" y="212" width="120" height="8" fill="#c0392b" rx="2"/>
  <text x="330" y="84" text-anchor="middle" font-size="10" fill="#c0392b">行波电极（射频）</text>
  <text x="330" y="234" text-anchor="middle" font-size="10" fill="#c0392b">行波电极（射频）</text>
  <!-- combiner -->
  <rect x="420" y="140" width="30" height="30" fill="#95a5a6" stroke="#333"/>
  <text x="435" y="160" text-anchor="middle" font-size="10" fill="#fff">合束</text>
  <!-- output -->
  <path d="M450,155 L540,155" fill="none" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="540" y="145" text-anchor="middle" font-size="11" fill="#333">调制光输出</text>
  <!-- optical arrows -->
  <path d="M120,155 L170,155" fill="none" stroke="#2980b9" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M210,155 L270,110" fill="none" stroke="#2980b9" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M210,155 L270,200" fill="none" stroke="#2980b9" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- RF arrows -->
  <path d="M330,50 L330,90" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4" marker-end="url(#arrowE)"/>
  <text x="360" y="60" font-size="10" fill="#c0392b">RF输入</text>
  <!-- legend -->
  <rect x="40" y="280" width="560" height="55" fill="#fff" stroke="#ccc" rx="4"/>
  <line x1="55" y1="300" x2="85" y2="300" stroke="#2980b9" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="95" y="304" font-size="11" fill="#333">光信号</text>
  <line x1="200" y1="300" x2="230" y2="300" stroke="#c0392b" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrowE)"/>
  <text x="240" y="304" font-size="11" fill="#333">电信号（射频）</text>
  <rect x="380" y="292" width="16" height="16" fill="#f39c12" stroke="#333"/>
  <text x="405" y="304" font-size="11" fill="#333">有源区</text>
  <rect x="470" y="292" width="16" height="16" fill="#3498db" stroke="#333"/>
  <text x="495" y="304" font-size="11" fill="#333">波导/耦合器</text>
</svg>