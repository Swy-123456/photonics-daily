name: 抓取并部署

on:
  schedule:
    # 每天 23:00 UTC = 北京时间次日 07:00
    - cron: '0 23 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # 允许提交生成的内容
  pages: write
  id-token: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 抓取 + 生成只在定时/手动触发时运行（避免每次 push 都消耗 API）
      - name: 抓取并生成资讯
        if: github.event_name != 'push'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: node scripts/run-daily.mjs
        continue-on-error: true

      - name: 提交生成的内容
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无内容变更"
            exit 0
          fi
          git commit -m "chore: 每日资讯更新 $(date -u +%F)"
          # 远端可能在本次 run 执行期间被并发推进（手动推送 / 其它触发），
          # 直接 push 会因非 fast-forward 被拒。先 rebase 拉平再推，最多重试 5 次。
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              echo "推送成功"
              exit 0
            fi
            echo "推送被拒（第 ${attempt} 次），5 秒后重试…"
            sleep 5
          done
          echo "多次重试后仍推送失败"
          exit 1

      - name: 计算部署路径
        run: |
          REPO="${{ github.event.repository.name }}"
          OWNER="${{ github.repository_owner }}"
          if [ "$REPO" = "$OWNER.github.io" ]; then
            echo "BASE_PATH=/" >> "$GITHUB_ENV"
            echo "SITE_URL=https://$OWNER.github.io" >> "$GITHUB_ENV"
          else
            echo "BASE_PATH=/$REPO/" >> "$GITHUB_ENV"
            echo "SITE_URL=https://$OWNER.github.io/$REPO/" >> "$GITHUB_ENV"
          fi

      - name: 构建
        run: npm run build

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
